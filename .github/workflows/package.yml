name: package

# One run produces every artifact. The thin builds are smoked cold on all three platforms
# on every push; the fat (offline, pre-baked) builds are ~2 GB each, so they are opt-in.
#
# Smoke scope is startup only: app opens, first run installs, service comes up, provider
# screen, shelf renders. No API key, no model request.

on:
  push:
    branches: [windows, main]
    paths:
      - 'app/io/**'
      - 'installation/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:
    inputs:
      fat:
        description: 'also build the offline (fat) artifacts - slow, ~2 GB each'
        type: boolean
        default: false
      release_tag:
        description: 'publish the artifacts straight to this release tag, e.g. v0.3.0 (blank = do not publish)'
        type: string
        default: ''
      only:
        description: 'build only platforms whose label contains this, e.g. mac (blank = all)'
        type: string
        default: ''

permissions:
  contents: write        # publishing release assets from the runner

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # nothing is signed for the event

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          all='[
            {"os":"windows-latest","label":"win-x64","target":"--win zip --x64"},
            {"os":"ubuntu-latest","label":"linux-x64","target":"--linux AppImage tar.gz --x64"},
            {"os":"macos-14","label":"mac-arm64","target":"--mac dmg --arm64"},
            {"os":"macos-13","label":"mac-x64","target":"--mac dmg --x64"}
          ]'
          only='${{ inputs.only }}'
          if [ -n "$only" ]; then
            picked=$(echo "$all" | jq -c --arg o "$only" '[.[] | select(.label | contains($o))]')
          else
            picked=$(echo "$all" | jq -c '.')
          fi
          echo "building: $(echo "$picked" | jq -r '[.[].label] | join(", ")')"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  thin:
    name: thin ${{ matrix.label }}
    # A fat-only dispatch has no reason to rebuild and re-smoke the thin matrix.
    if: github.event_name != 'workflow_dispatch' || !inputs.fat
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: build the app
        working-directory: app/io
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --config electron-builder.config.js ${{ matrix.target }}

      - name: list what came out
        working-directory: app/io
        shell: bash
        run: ls -lh dist/ || true

      # Unpack the artifact the way a participant would, so the smoke drives the real
      # shipped thing rather than the staging directory next to it.
      # Git Bash on the Windows runner has no unzip, so use PowerShell for this one step.
      - name: stage the artifact (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = Get-ChildItem app/io/dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath staged -Force
          "IO_EXE=$PWD\staged\io.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: stage the artifact (linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          APP=$(ls app/io/dist/*.AppImage | head -1)
          chmod +x "$APP"
          echo "IO_EXE=$PWD/$APP" >> $GITHUB_ENV
          # the runner has no libfuse2 either, so the AppImage has to self-extract
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

      - name: stage the artifact (mac)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          DMG=$(ls app/io/dist/*.dmg | head -1)
          hdiutil attach "$DMG" -mountpoint /Volumes/io -nobrowse -quiet
          cp -R /Volumes/io/io.app staged-io.app
          hdiutil detach /Volumes/io -quiet
          xattr -dr com.apple.quarantine staged-io.app || true
          echo "IO_EXE=$PWD/staged-io.app/Contents/MacOS/io" >> $GITHUB_ENV

      - name: the tar.gz is the no-FUSE path, so check it is usable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          TGZ=$(ls app/io/dist/*.tar.gz | head -1)
          echo "checking $TGZ"
          mkdir -p tgz-check && tar -xzf "$TGZ" -C tgz-check --strip-components=1
          test -x tgz-check/io || { echo "no runnable io in the tarball"; exit 1; }
          test -f tgz-check/resources/io/service.py || { echo "no service.py in the tarball"; exit 1; }
          echo "tar.gz ok: $(du -sh "$TGZ" | cut -f1)"

      - name: smoke (cold start, first run installs everything)
        working-directory: installation/smoke
        shell: bash
        run: |
          npm install --no-audit --no-fund
          RUN="node smoke.js --exe \"$IO_EXE\" --out out --label ${{ matrix.label }}-thin --cdp 9800 --port-base 8811 --budget-min 40"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a --server-args="-screen 0 1400x900x24" bash -c "$RUN"
          else
            bash -c "$RUN"
          fi

      - name: what the smoke saw
        if: always()
        shell: bash
        run: cat installation/smoke/out/results.json || echo 'no results.json'

      - name: publish to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.release_tag }}'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "io $TAG" --notes "built by the package workflow" --target "$GITHUB_SHA"
          shopt -s nullglob
          files=(app/io/dist/*.zip app/io/dist/*.AppImage app/io/dist/*.tar.gz app/io/dist/*.dmg)
          echo "uploading ${#files[@]} file(s): ${files[*]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}-thin
          path: installation/smoke/out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: io-${{ matrix.label }}
          path: |
            app/io/dist/*.zip
            app/io/dist/*.AppImage
            app/io/dist/*.tar.gz
            app/io/dist/*.dmg
          if-no-files-found: error

  fat:
    name: offline ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.fat
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # The payload has to be built on the target OS and arch: the wheels inside it are
      # compiled, so a Linux payload is useless to a Windows participant.
      - name: bake the payload (python runtime + model cache)
        working-directory: app/io
        run: node bootstrap.js --dest payload

      - name: pack with the payload inside
        working-directory: app/io
        env:
          IO_FAT: '1'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --config electron-builder.config.js ${{ matrix.target }}

      # Per-file sizes, not the combined artifact zip: what matters for a USB stick and for
      # the 2 GB per-file cap on GitHub release assets is how big each single file is.
      - name: how big is each artifact
        shell: bash
        run: ls -lh app/io/dist/ | grep -vE 'unpacked|builder-debug' || true

      - name: stage the artifact (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = Get-ChildItem app/io/dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath staged -Force
          "IO_EXE=$PWD\staged\io.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: stage the artifact (linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          # Smoke the tarball, not the AppImage. It is the artifact the install doc points
          # at (no libfuse2 needed), and without FUSE the offline AppImage self-extracts
          # another 2.6 GB into /tmp on top of the payload and both artifacts already on
          # disk - that filled the runner and left AppRun half-written, exiting 127.
          rm -rf app/io/dist/linux-unpacked app/io/dist/linux-x64-unpacked
          TGZ=$(ls app/io/dist/*.tar.gz | head -1)
          mkdir -p staged && tar -xzf "$TGZ" -C staged --strip-components=1
          test -x staged/io
          echo "IO_EXE=$PWD/staged/io" >> $GITHUB_ENV
          df -h / | tail -1

      - name: stage the artifact (mac)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          DMG=$(ls app/io/dist/*.dmg | head -1)
          hdiutil attach "$DMG" -mountpoint /Volumes/io -nobrowse -quiet
          cp -R /Volumes/io/io.app staged-io.app
          hdiutil detach /Volumes/io -quiet
          xattr -dr com.apple.quarantine staged-io.app || true
          echo "IO_EXE=$PWD/staged-io.app/Contents/MacOS/io" >> $GITHUB_ENV

      - name: smoke, and prove nothing was installed at run time
        working-directory: installation/smoke
        shell: bash
        run: |
          npm install --no-audit --no-fund
          RUN="node smoke.js --exe \"$IO_EXE\" --out out --label ${{ matrix.label }}-fat --cdp 9800 --port-base 8811 --budget-min 15"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a --server-args="-screen 0 1400x900x24" bash -c "$RUN"
          else
            bash -c "$RUN"
          fi
          node -e "
            const r = require('./out/results.json');
            if (r.first_run_install) { console.error('FAIL: the fat build still ran a first-run install'); process.exit(1); }
            console.log('offline confirmed: no install ran, provider screen in ' + r.cold_start_s + 's');
          "

      - name: publish to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.release_tag }}'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "io $TAG" --notes "built by the package workflow" --target "$GITHUB_SHA"
          shopt -s nullglob
          files=(app/io/dist/*.zip app/io/dist/*.AppImage app/io/dist/*.tar.gz app/io/dist/*.dmg)
          echo "uploading ${#files[@]} file(s): ${files[*]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}-fat
          path: installation/smoke/out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: io-${{ matrix.label }}-offline
          path: |
            app/io/dist/*offline*.zip
            app/io/dist/*offline*.AppImage
            app/io/dist/*offline*.tar.gz
            app/io/dist/*offline*.dmg
          if-no-files-found: error
