<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --border-color: #334155;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .brand h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background-color: var(--bg-tertiary);
            border-color: var(--primary-color);
        }

        /* Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            color: var(--primary-color);
        }

        /* Plot Styling */
        .plot-container {
            background-color: #0b0f19;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 12px;
            position: relative;
            overflow: visible;
        }

        .scatter-svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .scatter-dot {
            transition: r 0.2s, stroke-width 0.2s;
            cursor: pointer;
        }

        .scatter-dot:hover, .scatter-dot.active {
            r: 9px;
            stroke-width: 2.5px;
            stroke: #a5b4fc;
        }

        .glow-dot.active-glow {
            opacity: 0.4;
        }

        .x-axis-label {
            cursor: pointer;
            transition: fill 0.2s;
        }

        .x-axis-label:hover, .x-axis-label.active-label {
            fill: #a5b4fc;
            font-weight: bold;
        }

        /* Table Styling */
        .table-container {
            max-height: 380px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px;
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        tr:hover, tr.active-row {
            background-color: var(--primary-glow);
        }

        tr.active-row td {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* Message Drawer */
        .message-section {
            margin-top: 4px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .active-sender-badge {
            background-color: var(--primary-glow);
            border: 1px solid var(--primary-color);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            background-color: #0b0f19;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            align-self: flex-start;
            max-width: 80%;
        }

        .chat-message.self {
            align-self: flex-end;
            background-color: var(--primary-glow);
            border-color: var(--primary-color);
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .msg-sender {
            font-weight: 600;
            color: #a5b4fc;
        }

        .msg-text {
            font-size: 0.88rem;
            line-height: 1.45;
        }
    </style>
</head>

        let activeSender = null;

        window.addEventListener('DOMContentLoaded', () => {
            populateTable();
            renderMessages();
        });

        function populateTable() {
            const tbody = document.getElementById('sender-table-body');
            tbody.innerHTML = '';
            
            const totalMsgs = messages.length;

            sortedSenders.forEach(([name, count]) => {
                const ratio = ((count / totalMsgs) * 100).toFixed(1) + '%';
                const tr = document.createElement('tr');
                tr.setAttribute('data-sender', name);
                tr.onclick = () => selectSender(name);
                
                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td style="text-align: right; font-weight: 500;">${count}</td>
                    <td style="text-align: right; color: var(--text-secondary); font-size: 0.8rem;">${ratio}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderMessages() {
            const container = document.getElementById('chat-list-container');
            container.innerHTML = '';

            const filtered = activeSender 
                ? messages.filter(m => m.sender === activeSender)
                : messages;

            filtered.forEach(m => {
                const isSelf = m.sender === activeSender;
                const div = document.createElement('div');
                div.className = `chat-message ${isSelf ? 'self' : ''}`;

                div.innerHTML = `
                    <div class="message-meta">
                        <span class="msg-sender">${m.sender}</span>
                        <span>${m.date} ${m.time}</span>
                    </div>
                    <div class="msg-text">${m.text}</div>
                `;
                container.appendChild(div);
            });
            
            // Auto scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function selectSender(senderName) {
            const titleBadge = document.getElementById('active-sender-title');
            
            // Toggle selection
            if (activeSender === senderName) {
                activeSender = null;
                titleBadge.textContent = 'Showing all messages';
                
                // Clear UI states
                document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
                document.querySelectorAll('.scatter-dot').forEach(dot => dot.classList.remove('active'));
                document.querySelectorAll('.glow-dot').forEach(dot => dot.classList.remove('active-glow'));
                document.querySelectorAll('.x-axis-label').forEach(lbl => lbl.classList.remove('active-label'));
            } else {
                activeSender = senderName;
                titleBadge.textContent = `Showing messages from: ${senderName}`;
                
                // Set table row active
                document.querySelectorAll('tr').forEach(r => {
                    if (r.getAttribute('data-sender') === senderName) {
                        r.classList.add('active-row');
                        r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        r.classList.remove('active-row');
                    }
                });

                // Set plot circle active
                document.querySelectorAll('.scatter-dot').forEach(dot => {
                    if (dot.getAttribute('data-sender') === senderName) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });

                document.querySelectorAll('.glow-dot').forEach(dot => {
                    if (dot.getAttribute('data-sender') === senderName) {
                        dot.classList.add('active-glow');
                    } else {
                        dot.classList.remove('active-glow');
                    }
                });

                // Set label active
                document.querySelectorAll('.x-axis-label').forEach(lbl => {
                    if (lbl.textContent === senderName) {
                        lbl.classList.add('active-label');
                    } else {
                        lbl.classList.remove('active-label');
                    }
                });
            }

            renderMessages();
        }
