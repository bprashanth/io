<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Immunisation by Year</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .lowest-alert {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 15px 20px;
            margin: 20px 30px;
            border-radius: 10px;
            font-size: 1.1em;
        }

        .lowest-alert strong {
            color: #721c24;
        }

        .bar-fill.lowest {
            background: linear-gradient(90deg, #dc3545, #c82333) !important;
        }

        .district-label.lowest {
            color: #dc3545;
        }

        .percentage.lowest {
            color: #dc3545 !important;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .table-header .chart-title {
            margin-bottom: 0;
            text-align: left;
        }

        .content {
            padding: 30px;
        }

        .chart-container {
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.3em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .district-label {
            width: 100px;
            font-weight: 600;
            color: #495057;
            text-align: right;
        }

        .bar-wrapper {
            flex: 1;
            position: relative;
        }

        .bar-bg {
            height: 30px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 5px;
            transition: width 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }

        .bar-value {
            position: absolute;
            right: 0;
            top: -25px;
            font-weight: 600;
            color: #2c3e50;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 1.8em;
            font-weight: 700;
        }

        .source-section {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px 20px;
            margin-top: 30px;
        }

        .source-section h3 {
            color: #856404;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .source-section p {
            color: #856404;
            font-style: italic;
        }

        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background: #3498db;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .percentage {
            font-weight: 600;
            color: #2ecc71;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5em;
            }

            .district-label {
                width: 80px;
                font-size: 0.9em;
            }

            .controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 District Immunisation Dashboard</h1>
            <p class="subtitle">Compare immunisation rates across districts by year</p>
        </header>

        <div class="lowest-alert" id="lowestAlert"></div>

        <div class="content">
            <div class="chart-container">
                <h2 class="chart-title">Fully Immunised Children by District (2023)</h2>
                <div class="bar-chart" id="barChart"></div>
            </div>

            <div class="stats-grid" id="statsGrid"></div>

            <div class="table-container">
                <div class="table-header">
                    <h2 class="chart-title">Detailed Data</h2>
                    <button class="download-btn" onclick="downloadCSV()">📥 Download 2023 Data as CSV</button>
                </div>
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>District</th>
                            <th>Children Due</th>
                            <th>Fully Immunised</th>
                            <th>Immunisation Rate</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="source-section">
                <h3>📊 Data Source</h3>
                <p id="dataSource">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // CSV Data
        const csvData = `district,year,children_due,children_fully_immunised,source
Gaya,2022,1000,780,synthetic smoke fixture
Nalanda,2022,800,680,synthetic smoke fixture
Purnia,2022,900,630,synthetic smoke fixture
Gaya,2023,1100,935,synthetic smoke fixture
Nalanda,2023,850,765,synthetic smoke fixture
Purnia,2023,1000,760,synthetic smoke fixture`;

        // Parse CSV
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index];
                });
                data.push(row);
            }
            return data;
        }

        const allData = parseCSV(csvData);
        let selectedYear = '2023';

        // Filter data by year
        function getDataByYear(year) {
            return allData.filter(d => d.year === year);
        }

        // Find lowest performing district
        function findLowestDistrict(data) {
            return data.reduce((lowest, current) => {
                const lowestRate = parseInt(lowest.children_fully_immunised) / parseInt(lowest.children_due);
                const currentRate = parseInt(current.children_fully_immunised) / parseInt(current.children_due);
                return currentRate < lowestRate ? current : lowest;
            });
        }

        // Render bar chart
        function renderBarChart(data, lowestDistrict) {
            const container = document.getElementById('barChart');
            const maxVal = Math.max(...data.map(d => parseInt(d.children_fully_immunised)));

            container.innerHTML = data.map(item => {
                const percentage = ((parseInt(item.children_fully_immunised) / parseInt(item.children_due)) * 100).toFixed(1);
                const width = (parseInt(item.children_fully_immunised) / maxVal) * 100;
                const isLowest = item.district === lowestDistrict.district;
                const lowestClass = isLowest ? 'lowest' : '';

                return `
                    <div class="bar-row">
                        <div class="district-label ${lowestClass}">${item.district}${isLowest ? ' ⚠️' : ''}</div>
                        <div class="bar-wrapper">
                            <div class="bar-bg">
                                <div class="bar-fill ${lowestClass}" style="width: ${width}%">${item.children_fully_immunised}</div>
                            </div>
                            <div class="bar-value">${percentage}% rate</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render stats cards
        function renderStats(data, lowestDistrict) {
            const totalDue = data.reduce((sum, d) => sum + parseInt(d.children_due), 0);
            const totalImmunised = data.reduce((sum, d) => sum + parseInt(d.children_fully_immunised), 0);
            const overallRate = ((totalImmunised / totalDue) * 100).toFixed(1);
            const lowestRate = ((parseInt(lowestDistrict.children_fully_immunised) / parseInt(lowestDistrict.children_due)) * 100).toFixed(1);

            // Show lowest district alert
            document.getElementById('lowestAlert').innerHTML = `
                📉 <strong>Lowest Performing District (2023):</strong> ${lowestDistrict.district} with ${lowestRate}% immunisation rate (${lowestDistrict.children_fully_immunised} out of ${lowestDistrict.children_due} children)
            `;

            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <h3>Total Children Due</h3>
                    <div class="value">${totalDue.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Fully Immunised</h3>
                    <div class="value">${totalImmunised.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <h3>Overall Immunisation Rate</h3>
                    <div class="value">${overallRate}%</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                    <h3>Lowest Performing District</h3>
                    <div class="value">${lowestDistrict.district}</div>
                </div>
            `;
        }

        // Render data table
        function renderTable(data, lowestDistrict) {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = data.map(item => {
                const percentage = ((parseInt(item.children_fully_immunised) / parseInt(item.children_due)) * 100).toFixed(1);
                const isLowest = item.district === lowestDistrict.district;
                const lowestClass = isLowest ? 'lowest' : '';
                return `
                    <tr style="${isLowest ? 'background: #f8d7da;' : ''}">
                        <td><strong>${item.district}${isLowest ? ' ⚠️' : ''}</strong></td>
                        <td>${parseInt(item.children_due).toLocaleString()}</td>
                        <td>${parseInt(item.children_fully_immunised).toLocaleString()}</td>
                        <td class="percentage ${lowestClass}">${percentage}%</td>
                    </tr>
                `;
            }).join('');
        }

        // Update source
        function updateSource(data) {
            const source = data[0]?.source || 'Unknown';
            document.getElementById('dataSource').textContent = source;
        }

        // Main update function
        function updateDashboard(year) {
            selectedYear = year;
            const data = getDataByYear(year);
            const lowestDistrict = findLowestDistrict(data);
            renderBarChart(data, lowestDistrict);
            renderStats(data, lowestDistrict);
            renderTable(data, lowestDistrict);
            updateSource(data);
        }

        // Download CSV function
        function downloadCSV() {
            const data = getDataByYear('2023');
            let csvContent = "district,year,children_due,children_fully_immunised,immunisation_rate,source\n";

            data.forEach(item => {
                const percentage = ((parseInt(item.children_fully_immunised) / parseInt(item.children_due)) * 100).toFixed(1);
                csvContent += `${item.district},2023,${item.children_due},${item.children_fully_immunised},${percentage}%,${item.source}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "district_immunisation_2023.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize dashboard with 2023 data
        updateDashboard('2023');
    </script>
</body>
</html>
