<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>District Immunisation Dashboard</title>
<style>
  :root { --bg: #f4f6f9; --card: #fff; --accent: #2563eb; --green: #16a34a; --red: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; padding: 2rem; }
  h1 { text-align: center; margin-bottom: .25rem; }
  .subtitle { text-align: center; color: #64748b; margin-bottom: 2rem; }
  .controls { display: flex; justify-content: center; gap: 1rem; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; }
  label { font-weight: 600; }
  select { padding: .5rem 1rem; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1rem; }
  .card { max-width: 900px; margin: 0 auto 2rem; background: var(--card); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 2rem; }
  .card h2 { margin-bottom: 1rem; font-size: 1.2rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #e2e8f0; }
  th { background: #f8fafc; font-size: .85rem; text-transform: uppercase; color: #64748b; }
  .pct-good { color: var(--green); font-weight: 700; }
  .pct-bad { color: var(--red); font-weight: 700; }
  canvas { width: 100% !important; height: 380px !important; }
  .source { text-align: center; color: #94a3b8; font-size: .85rem; margin-top: 1rem; }
  .legend { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1rem; }
  .legend span { display: flex; align-items: center; gap: .4rem; font-size: .9rem; }
  .legend .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<h1>District Immunisation Coverage — 2023</h1>
<p class="subtitle">Comparing fully immunised children across districts. Lowest coverage: <strong style="color:#dc2626">Purnia (76.0%)</strong></p>

<div class="controls">
  <label for="yearSelect">Year:</label>
  <select id="yearSelect" disabled>
    <option selected>2023</option>
  </select>
</div>

<div class="card">
  <div class="legend">
    <span><span class="swatch" style="background:#3b82f6"></span> Children Due</span>
    <span><span class="swatch" style="background:#16a34a"></span> Fully Immunised</span>
  </div>
  <canvas id="barChart"></canvas>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h2 style="margin:0">Detailed Breakdown</h2>
    <button id="downloadBtn" style="padding:.45rem 1rem;border:none;background:#2563eb;color:#fff;border-radius:6px;font-size:.9rem;cursor:pointer;font-weight:600;">⬇ Download CSV</button>
  </div>
  <table>
    <thead>
      <tr><th>District</th><th>Children Due</th><th>Fully Immunised</th><th>Coverage %</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<p class="source" id="sourceLine"></p>

<script src="app.js"></script>
<script src="chart.js"></script>
</body>
</html>
