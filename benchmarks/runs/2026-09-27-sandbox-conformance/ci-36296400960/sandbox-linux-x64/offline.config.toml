# Written by io on every launch. Edits here do not survive; io owns this file.
# Codex keeps its own choices (the /model pick) in config.toml next to this one.
openai_base_url = "http://127.0.0.1:1/backend-api/codex"
chatgpt_base_url = "http://127.0.0.1:1/backend-api/"
check_for_update_on_startup = false
model_reasoning_effort = "low"
approval_policy = "never"
web_search = "disabled"
default_permissions = "io"

[projects."/home/runner/.io-sandbox-conformance-uV3tQy/allowed workspace"]
trust_level = "trusted"

[analytics]
enabled = false

[features]
enable_request_compression = false
apps = false
plugins = false
remote_plugin = false
plugin_sharing = false
recommended_plugins = false
image_generation = false

[permissions.io]
description = "io: the sheltered folder and nothing else"

[permissions.io.filesystem]
":minimal" = "read"
"/home/runner/.io-sandbox-conformance-uV3tQy/codex-offline/AGENTS.md" = "read"
"/home/runner/work/io/io/app/io/codex-bin/linux-x64" = "read"
"/home/runner/.io-conformance-runtime/linux-x64/runtime" = "read"
"/tmp" = "write"

[permissions.io.filesystem.":workspace_roots"]
"." = "write"

[permissions.io.network]
enabled = false
