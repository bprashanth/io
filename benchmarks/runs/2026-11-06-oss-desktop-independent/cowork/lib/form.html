<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --accent: #2f5d50; --accent-soft: #e4efe9; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --bad: #9b2c2c; --bad-soft: #fbe5e5; --chip: #f0eee9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #a3a29c; --line: #34332f;
    --accent: #8cc7b2; --accent-soft: #23332d; --warn: #e7b85c; --warn-soft: #3a2f19;
    --bad: #f0a3a3; --bad-soft: #3d2222; --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 18px 24px 10px; }
h1 { margin: 0; font-size: 20px; font-weight: 650; }
.sub { color: var(--muted); margin-top: 2px; }
.banner { margin: 10px 24px 0; padding: 10px 14px; border-radius: 8px; }
.banner.ok { background: var(--accent-soft); color: var(--accent); }
.banner.drift { background: var(--warn-soft); color: var(--warn); }
.banner.changed, .banner.unknown { background: var(--bad-soft); color: var(--bad); }
.banner ul { margin: 6px 0 0 18px; padding: 0; }
nav { display: flex; gap: 4px; padding: 14px 24px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { border: 1px solid transparent; border-bottom: none; background: none; color: var(--muted); padding: 8px 14px;
  border-radius: 8px 8px 0 0; font: inherit; cursor: pointer; white-space: nowrap; }
nav button.on { background: var(--panel); color: var(--ink); border-color: var(--line); margin-bottom: -1px; font-weight: 600; }
main { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 18px; padding: 18px 24px 40px; }
main > section { min-width: 0; }
body { overflow-x: hidden; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } header, nav { padding-left: 16px; padding-right: 16px; } .banner { margin: 10px 16px 0; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card + .card { margin-top: 14px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
h2:first-child { margin-top: 0; }
label.check { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; cursor: pointer; }
select, input[type=date], input[type=text], input[type=number] { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filter { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }
.filter .top { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
.vals { max-height: 150px; overflow: auto; }
.x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.more { color: var(--muted); font-size: 12px; }
.answer { font-size: 15px; white-space: pre-wrap; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
tr.total td { font-weight: 650; border-top: 2px solid var(--line); }
.scroll { overflow-x: auto; }
details { margin-top: 10px; color: var(--muted); }
code { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
.err { color: var(--bad); }
.prob { padding: 6px 0; border-bottom: 1px solid var(--line); }
.prob:last-child { border-bottom: none; }
.chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 6px; margin: 2px 4px 0 0; font-size: 12px; }
.fix { display: grid; grid-template-columns: 52px 1fr auto; gap: 4px 8px; align-items: baseline; padding: 3px 0; font-size: 13px; }
.fix .cell { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
.fix .why { grid-column: 2 / 4; color: var(--muted); font-size: 12px; margin-top: -2px; }
.fix .acts button { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 5px; cursor: pointer; margin-left: 4px; }
.fix .acts button.on.acc { background: #d8f0dd; border-color: #8cc79a; color: #1d4d29; }
.fix .acts button.on.rej { background: var(--chip); color: var(--muted); text-decoration: line-through; }
.fix .to { font-weight: 600; }
.groupacts { margin: 4px 0 2px; }
.groupacts button, #savefix { font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 5px; cursor: pointer; }
.skipnote { font-size: 12px; color: var(--muted); padding: 4px 0 8px; }
.muted { color: var(--muted); }
.addbtn { margin-top: 8px; }
</style>
</head>
<body>
<header><h1 id="title">Loading</h1><div class="sub" id="sub"></div></header>
<div id="banner"></div>
<nav id="tabs"></nav>
<main id="main" hidden>
  <section>
    <div class="card" id="formcard">
      <h2>Show</h2><div id="measures"></div>
      <h2>Break down by</h2><div class="row2"><select id="g1"></select><select id="g2"></select></div>
      <div id="presetwrap"><h2>Rules</h2><div id="presets"></div></div>
      <div id="datewrap"><h2>Dates</h2>
        <select id="dcol"></select>
        <div class="row2" style="margin-top:6px"><input type="text" id="dfrom" aria-label="From" placeholder="from dd/mm/yyyy"><input type="text" id="dto" aria-label="To" placeholder="to dd/mm/yyyy"></div>
      </div>
      <h2>Only rows where</h2>
      <div id="filters"></div>
      <select id="addf" class="addbtn"><option value="">+ add a condition</option></select>
    </div>
  </section>
  <section>
    <div class="card"><div class="answer" id="answer"></div><div class="scroll" id="table"></div>
      <details><summary>How this was worked out</summary><code id="sql"></code></details></div>
    <div class="card" id="probcard"><h2 id="probhead">Problems</h2><div id="problems"></div></div>
  </section>
</main>
<script>
const P = new URLSearchParams(location.search);
const T = P.get("t"), FILE = P.get("file");
let META = null, TAB = P.get("tab"), SPEC = {};
try { SPEC = JSON.parse(P.get("spec") || "{}"); } catch (e) { SPEC = {}; }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function indian(v) {
  if (typeof v !== "number") return v ?? "";
  const neg = v < 0; v = Math.abs(v);
  let [w, f] = (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")).split(".");
  let head = w.slice(0, -3), tail = w.slice(-3);
  while (head.length > 2) { tail = head.slice(-2) + "," + tail; head = head.slice(0, -2); }
  return (neg ? "-" : "") + (head ? head + "," + tail : tail) + (f ? "." + f : "");
}
async function api(path, body) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(T),
    body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function dmy(v) { if (!v) return ""; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v); }
function form() { return META.tabs.find(t => t.tab === TAB) || META.tabs[0]; }

async function load() {
  try { META = await api("/api/form?file=" + encodeURIComponent(FILE)); }
  catch (e) { $("title").textContent = "Can't open this file"; $("banner").innerHTML = `<div class="banner changed">${esc(e.message)}</div>`; return; }
  document.title = META.title + " - dashboard";
  $("title").textContent = META.title;
  if (!META.known) {
    $("sub").textContent = FILE;
    $("banner").innerHTML = `<div class="banner unknown">Idli hasn't been taught this file yet. Go back to the chat and say yes to teaching; this page fills in once it's done.</div>`;
    return;
  }
  const c = META.contract;
  const label = {ok: "Same layout Idli was taught", drift: "The file has changed a little since Idli was taught it. Answers still work.",
                 changed: "This file has changed since Idli was taught it. Ask Idli in the chat to re-teach it before trusting answers."}[c.status];
  let hidden = "";
  if (META.hidden_cells) hidden = `<div class="banner drift">Read from Google's export, which blanks text in number columns: ${esc(Object.entries(META.hidden_cells).map(([k, v]) => `${k} (${v} cells)`).join(", "))}. Totals from these may be low. Ask Idli to download the real file.</div>`;
  $("banner").innerHTML = `<div class="banner ${c.status}">${esc(label)}${c.messages.length ? "<ul>" + c.messages.map(m => `<li>${esc(m)}</li>`).join("") + "</ul>" : ""}</div>` + hidden;
  $("sub").textContent = `${FILE} - taught v${META.skill.version} - ${META.problem_count ? META.problem_count + " problems found" : "no problems found"}`;
  if (!META.tabs.some(t => t.tab === TAB)) TAB = META.tabs[0].tab;
  $("tabs").innerHTML = META.tabs.map(t => `<button data-tab="${esc(t.tab)}" class="${t.tab === TAB ? "on" : ""}">${esc(t.tab)} <span class="muted">${t.rows}</span></button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { TAB = b.dataset.tab; SPEC = {}; render(); });
  if (META.tabs.length < 2) $("tabs").hidden = true;
  $("main").hidden = false;
  render();
}

function render() {
  const f = form();
  $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  if (!SPEC.measures && f.rows <= 30 && !f.measures.some(m => !m.auto && m.id !== "rows")) SPEC.measures = [];
  if (!SPEC.measures) SPEC.measures = [f.measures.find(m => !m.auto && m.id !== "rows") ? f.measures.find(m => !m.auto && m.id !== "rows").id : "rows"];
  const shown = f.measures.filter(m => !m.auto || SPEC.measures.includes(m.id));
  const extra = f.measures.filter(m => m.auto && !SPEC.measures.includes(m.id));
  $("measures").innerHTML = shown.map(m => `<label class="check"><input type="checkbox" value="${esc(m.id)}" ${SPEC.measures.includes(m.id) ? "checked" : ""}>${esc(m.label)}</label>`).join("")
    + `<label class="check"><input type="checkbox" value="" ${SPEC.measures.length === 0 ? "checked" : ""}>List the matching ${esc(f.row_noun)}</label>`
    + (extra.length ? `<select id="moremeasure" class="addbtn"><option value="">+ more</option>${extra.map(m => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join("")}</select>` : "");
  $("measures").querySelectorAll("input").forEach(i => i.onchange = () => {
    if (i.value === "") SPEC.measures = i.checked ? [] : ["rows"];
    else SPEC.measures = [...$("measures").querySelectorAll("input:checked")].map(x => x.value).filter(Boolean);
    render(); run();
  });
  if ($("moremeasure")) $("moremeasure").onchange = e => { if (e.target.value) { SPEC.measures = [...SPEC.measures, e.target.value]; render(); run(); } };
  const g = SPEC.group_by || [];
  const opts = sel => `<option value="">${sel ? "then by" : "nothing"}</option>` + f.group_by.map(x => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("");
  $("g1").innerHTML = opts(false); $("g2").innerHTML = opts(true);
  $("g1").value = g[0] || ""; $("g2").value = g[1] || "";
  $("g2").disabled = !g[0];
  $("g1").onchange = $("g2").onchange = () => { SPEC.group_by = [$("g1").value, $("g2").value].filter(Boolean); render(); run(); };
  $("presetwrap").hidden = !f.presets.length;
  const pre = [].concat(SPEC.preset || []);
  $("presets").innerHTML = f.presets.map(p => `<label class="check"><input type="checkbox" value="${esc(p.id)}" ${pre.includes(p.id) ? "checked" : ""}>${esc(p.label)}</label>`).join("");
  $("presets").querySelectorAll("input").forEach(i => i.onchange = () => { SPEC.preset = [...$("presets").querySelectorAll("input:checked")].map(x => x.value); run(); });
  $("datewrap").hidden = !f.date_columns.length;
  const labels = Object.fromEntries(f.filters.map(x => [x.column, x.label]));
  const d = SPEC.date || {};
  $("dcol").innerHTML = f.date_columns.map(c => `<option value="${esc(c)}">${esc(labels[c] || c)}</option>`).join("");
  $("dcol").value = d.column || f.date_columns[0] || "";
  $("dfrom").value = dmy(d.from); $("dto").value = dmy(d.to);
  const fd = f.filters.find(x => x.column === $("dcol").value);
  if (fd) { $("dfrom").placeholder = "from " + (dmy(fd.min) || "dd/mm/yyyy"); $("dto").placeholder = "to " + (dmy(fd.max) || "dd/mm/yyyy"); }
  $("dcol").onchange = $("dfrom").onchange = $("dto").onchange = () => { SPEC.date = {column: $("dcol").value, from: $("dfrom").value, to: $("dto").value}; run(); };
  renderFilters(f);
  renderProblems();
  run();
}

function renderFilters(f) {
  SPEC.filters = SPEC.filters || {};
  const by = Object.fromEntries(f.filters.map(x => [x.column, x]));
  $("filters").innerHTML = Object.keys(SPEC.filters).filter(c => by[c]).map(c => {
    const x = by[c], v = SPEC.filters[c];
    let body = "";
    if (x.kind === "choice") {
      const chosen = (Array.isArray(v) ? v : [v]).map(s => String(s).toLowerCase());
      const not = v && v.not ? [].concat(v.not).map(s => String(s).toLowerCase()) : null;
      body = (not ? `<div class="more">all except the ticked</div>` : "") + `<div class="vals">` + x.values.map(val =>
        `<label class="check"><input type="checkbox" data-col="${esc(c)}" value="${esc(val)}" ${(not ? not : chosen).includes(val.toLowerCase()) ? "checked" : ""}>${esc(val)}</label>`).join("") + `</div>`;
    } else if (x.kind === "contains") {
      body = `<input type="text" data-col="${esc(c)}" data-k="contains" value="${esc(v.contains || "")}" placeholder="contains">`;
    } else {
      const isd = x.kind === "date", t = isd ? "text" : "number", show = z => isd ? dmy(z) : (z ?? "");
      body = `<div class="row2"><input type="${t}" data-col="${esc(c)}" data-k="min" value="${esc(show(v.min ?? v.from))}" placeholder="from ${esc(show(x.min))}"><input type="${t}" data-col="${esc(c)}" data-k="max" value="${esc(show(v.max ?? v.to))}" placeholder="to ${esc(show(x.max))}"></div>`;
    }
    return `<div class="filter"><div class="top">${esc(x.label)}<button class="x" data-rm="${esc(c)}" aria-label="Remove">&times;</button></div>${body}</div>`;
  }).join("");
  $("addf").innerHTML = `<option value="">+ add a condition</option>` + f.filters.filter(x => !(x.column in SPEC.filters)).map(x => `<option value="${esc(x.column)}">${esc(x.label)}</option>`).join("");
  $("addf").onchange = e => { const c = e.target.value; if (!c) return; SPEC.filters[c] = by[c].kind === "choice" ? [] : {}; renderFilters(f); };
  $("filters").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { delete SPEC.filters[b.dataset.rm]; renderFilters(f); run(); });
  $("filters").querySelectorAll("input").forEach(i => i.onchange = () => {
    const c = i.dataset.col, x = by[c];
    if (x.kind === "choice") {
      const vals = [...$("filters").querySelectorAll(`input[data-col="${CSS.escape(c)}"]:checked`)].map(z => z.value);
      SPEC.filters[c] = SPEC.filters[c] && SPEC.filters[c].not ? {not: vals} : vals;
    } else {
      const o = {};
      $("filters").querySelectorAll(`input[data-col="${CSS.escape(c)}"]`).forEach(z => { if (z.value !== "") o[z.dataset.k] = z.value; });
      SPEC.filters[c] = o;
    }
    run();
  });
}

let timer = null, seq = 0;
function run() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const spec = JSON.parse(JSON.stringify(SPEC));
    for (const [c, v] of Object.entries(spec.filters || {})) if ((Array.isArray(v) && !v.length) || (v && !Array.isArray(v) && !Object.keys(v).length)) delete spec.filters[c];
    if (spec.date && !spec.date.from && !spec.date.to) delete spec.date;
    const u = new URL(location.href); u.searchParams.set("tab", TAB); u.searchParams.set("spec", JSON.stringify(spec)); history.replaceState(null, "", u);
    const me = ++seq;
    try {
      const r = await api("/api/run", {file: FILE, tab: TAB, spec});
      if (me !== seq) return;
      $("answer").textContent = r.described + ".";
      const num = c => r.rows.some(x => typeof x[c] === "number");
      let h = `<table><thead><tr>${r.columns.map(c => `<th class="${num(c) ? "num" : ""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
      h += r.rows.map(x => `<tr>${r.columns.map(c => `<td class="${num(c) ? "num" : ""}">${esc(indian(x[c]))}</td>`).join("")}</tr>`).join("");
      if (r.total && r.rows.length > 1 && spec.measures && spec.measures.length) h += `<tr class="total">${r.columns.map((c, i) => `<td class="${num(c) ? "num" : ""}">${c in r.total ? esc(indian(r.total[c])) : (i === 0 ? "All" : "")}</td>`).join("")}</tr>`;
      if (r.total && (!spec.measures || !spec.measures.length)) $("answer").textContent = `${Object.values(r.total)[0]} ${form().row_noun} match` + (r.rows.length < Object.values(r.total)[0] ? ` (first ${r.rows.length} shown)` : "") + ".";
      $("table").innerHTML = h + "</tbody></table>";
      $("sql").textContent = r.sql;
    } catch (e) {
      if (me !== seq) return;
      $("answer").innerHTML = `<span class="err">${esc(e.message)}</span>`; $("table").innerHTML = ""; $("sql").textContent = "";
    }
  }, 150);
}

function fixLine(r) {
  const sg = r.suggestion || {}, has = sg.action === "skip_row" || (sg.to !== undefined && sg.to !== null);
  const to = sg.action === "skip_row" ? "skip this row" : (sg.to === "" ? "leave blank" : sg.to);
  const acts = has ? `<span class="acts"><button class="acc ${r.decision === "accept" ? "on" : ""}" data-k="${esc(r.key)}" data-d="accept">Accept</button><button class="rej ${r.decision === "reject" ? "on" : ""}" data-k="${esc(r.key)}" data-d="reject">Reject</button></span>` : "<span></span>";
  return `<div class="fix"><span class="cell">${esc(r.cell || "row " + r.row)}</span><span>${esc(r.value || "blank")}${has ? ` → <span class="to">${esc(to)}</span>` : ""}</span>${acts}${sg.why ? `<span class="why">${esc(sg.why)}</span>` : ""}</div>`;
}
function renderProblems() {
  const f = form(), groups = (META.problems || {})[f.sheet] || [], skipped = (META.skipped || {})[f.sheet] || [];
  const n = groups.reduce((a, g) => a + g.rows.length, 0);
  const open = META.source && META.source.url ? ` <a href="${esc(META.source.url)}" target="_blank" rel="noopener">Open the file in Google</a> (tab ${esc(f.sheet)}) to fix a cell.` : "";
  $("probhead").textContent = n ? `Problems in ${f.tab}: ${n}` : `Problems in ${f.tab}`;
  const skip = skipped.map(s => `<div class="skipnote">${esc(s.why)} Rows ${s.rows.slice(0, 12).join(", ")}${s.rows.length > 12 ? ` and ${s.rows.length - 12} more` : ""}.</div>`).join("");
  $("problems").innerHTML = skip + (n ? groups.map((g, gi) => {
      const fixable = g.rows.filter(r => r.suggestion && (r.suggestion.action || (r.suggestion.to !== undefined && r.suggestion.to !== null)));
      const all = fixable.length > 1 ? `<div class="groupacts"><button data-g="${gi}" data-d="accept">Accept all ${fixable.length} suggestions</button> <button data-g="${gi}" data-d="reject">Reject all</button></div>` : "";
      return `<div class="prob"><b>${esc(g.column)}</b>: ${esc(g.problem)} <span class="muted">(${g.rows.length})</span>${all}${g.rows.slice(0, 30).map(fixLine).join("")}${g.rows.length > 30 ? `<span class="more">and ${g.rows.length - 30} more (all in the checked copy)</span>` : ""}</div>`;
    }).join("")
    : `<div class="muted">No problems found by the taught checks.</div>`)
    + `<p class="more">Accept or reject each suggested fix; nothing changes in your file.${open} <button id="savefix">Save fix list</button> <span id="fixmsg"></span></p>`
    + `<p class="more">The checked copy <b>${esc(META.checked_copy)}</b> has the problem cells in red, each with a comment saying why and the suggested fix. Rows with problems are still counted in the answers above.</p>`;
  const decide = async (keys, d) => {
    const cur = groups.flatMap(g => g.rows).filter(r => keys.includes(r.key));
    const same = cur.length === 1 && cur[0].decision === d;
    await api("/api/decide", {file: FILE, keys, decision: same ? "clear" : d});
    cur.forEach(r => r.decision = same ? undefined : d);
    renderProblems();
  };
  $("problems").querySelectorAll(".acts button").forEach(b => b.onclick = () => decide([b.dataset.k], b.dataset.d));
  $("problems").querySelectorAll(".groupacts button").forEach(b => b.onclick = () => {
    const g = groups[+b.dataset.g];
    decide(g.rows.filter(r => r.suggestion && (r.suggestion.action || (r.suggestion.to !== undefined && r.suggestion.to !== null))).map(r => r.key), b.dataset.d);
  });
  const sv = $("savefix");
  if (sv) sv.onclick = async () => {
    $("fixmsg").textContent = "Saving…";
    try {
      const j = await api("/api/fixlist", {file: FILE});
      $("fixmsg").textContent = `${j.fixes} accepted fixes saved: ${j.fix_list}` + (j.fixed_copy ? ` and a fixed copy, ${j.fixed_copy} (changed cells have a comment).` : ".");
    } catch (e) { $("fixmsg").textContent = e.message; }
  };
}
load();
</script>
</body>
</html>
