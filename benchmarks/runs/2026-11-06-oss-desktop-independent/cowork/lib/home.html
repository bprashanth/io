<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Idli home</title>
<link rel="stylesheet" href="/home.css?__TOKEN_QUERY__"><main>
<h1>Idli</h1><div id="status" role="status" aria-live="polite"></div>
<section id="compose"><div id="chips" aria-label="Chosen files"></div>
<label for="search">Find your files</label><div class="picker"><input id="search" placeholder="Search Drive or this computer" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="hits" aria-expanded="false"><div id="hits" class="choices" role="listbox" hidden></div></div>
<label for="question">What would you like to know?</label><div class="picker"><textarea id="question" placeholder="Ask a question. Type @ to add a file." aria-controls="mentions" aria-expanded="false"></textarea><div id="mentions" class="choices" role="listbox" hidden></div></div>
<button id="next" class="primary">Next</button></section>
<section id="review" hidden><h2>Review what Claude sees</h2><p class="muted">Checked columns use codes. Your files stay on this computer.</p><div id="reviews"></div><p><strong>Claude will see:</strong> <span id="masked"></span></p><button id="send" class="primary">Send to Claude</button> <button id="back">Back</button></section>
<h2>Minis on this computer</h2><div id="minis" class="cards"></div>
</main><script src="/home.js?__TOKEN_QUERY__"></script></html>
