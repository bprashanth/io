<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installed tools</title>
<style>
:root { --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dedcd6; --accent: #2f5d50;
  --on-accent: #ffffff; --soft: #e8f0ec; --danger: #a33a2c; --on-danger: #ffffff; --warn-bg: #fbf0e6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111110; --card: #1b1b1a;
  --ink: #ecebe7; --muted: #a3a29c; --line: #33332f; --accent: #8cc7b2; --on-accent: #0b0b0b; --soft: #1f2b27;
  --danger: #e08a7c; --on-danger: #1a0b08; --warn-bg: #2b211a; } }
:root[data-theme="dark"] { --bg: #111110; --card: #1b1b1a; --ink: #ecebe7; --muted: #a3a29c; --line: #33332f;
  --accent: #8cc7b2; --on-accent: #0b0b0b; --soft: #1f2b27; --danger: #e08a7c; --on-danger: #1a0b08; --warn-bg: #2b211a; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0; }
.sub { color: var(--muted); margin: 0 0 18px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 20px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 130px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.seg button { border: 0; border-radius: 0; min-height: 36px; padding: 0 16px; }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.row { display: grid; grid-template-columns: 1.4fr .7fr .8fr .9fr auto; gap: 8px; align-items: center; padding: 8px 0;
  border-top: 1px solid var(--line); font-size: 14px; }
.row:first-of-type { margin-top: 8px; }
.row .num { font-variant-numeric: tabular-nums; }
.row .muted { color: var(--muted); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr auto; } .row .hide-sm { display: none; } }
button { font: inherit; font-weight: 600; border-radius: 999px; min-height: 40px; padding: 0 18px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.danger { background: var(--danger); color: var(--on-danger); border-color: var(--danger); }
button.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
button.link { border: 0; padding: 0 4px; min-height: 32px; color: var(--accent); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); min-height: 40px; width: 100%; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.add .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .add .grid { grid-template-columns: 1fr; } }
.verdict { border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 14px; white-space: pre-line; }
.verdict.ok { background: var(--soft); }
.verdict.no { background: var(--warn-bg); }
.empty { color: var(--muted); padding: 8px 0; }
.msg { color: var(--muted); font-size: 13px; min-height: 1.2em; }
.msg.err { color: var(--danger); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>Installed tools</h1>
    <button class="link" id="teams" type="button">Teams</button>
  </div>
  <p class="sub">Tools from Idli's vetted list, on this computer.</p>
  <div class="stats">
    <div class="stat"><b id="used">0 MB</b><span>Used by tools</span></div>
    <div class="stat"><b id="free">0 MB</b><span>Free disk</span></div>
    <div class="stat"><b id="plat">-</b><span>This computer</span></div>
  </div>
  <div class="seg" role="group" aria-label="Group">
    <button type="button" id="bytool" aria-pressed="true">By tool</button>
    <button type="button" id="byteam" aria-pressed="false">By team</button>
  </div>
  <div id="list"></div>
  <p class="msg" id="msg" role="status"></p>
  <section class="card add" id="add">
    <h2>Add a tool</h2>
    <div class="grid">
      <div><label for="team">Team</label><select id="team"></select></div>
      <div><label for="tool">Tool</label><select id="tool"></select></div>
    </div>
    <div class="verdict" id="verdict" hidden></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" id="check">Check</button>
      <button type="button" class="primary" id="install" hidden>Install</button>
    </div>
  </section>
</main>
<script>
const T = new URLSearchParams(location.search).get("t");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const SYS = {"linux-64": "Linux", "linux-aarch64": "Linux ARM", "osx-arm64": "Mac", "osx-64": "Mac Intel", "win-64": "Windows"};
async function api(path, body) {
  const res = await fetch(`${path}?t=${encodeURIComponent(T)}`, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const out = await res.json().catch(() => ({}));
  if (!res.ok && !out.error) out.error = "Idli could not finish this step. Try again.";
  return out;
}
let data = {}, group = "tool", timer = null;
$("teams").onclick = () => { location.href = "/teams?t=" + encodeURIComponent(T); };
$("bytool").onclick = () => { group = "tool"; render(); };
$("byteam").onclick = () => { group = "team"; render(); };

function say(text, err) { $("msg").className = "msg" + (err ? " err" : ""); $("msg").textContent = text || ""; }

function removeButton(label, body, done) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = label;
  let armed = false;
  b.onclick = async () => {
    if (!armed) { armed = true; b.className = "small danger"; b.textContent = "Sure?";
      setTimeout(() => { if (armed) { armed = false; b.className = "small"; b.textContent = label; } }, 4000); return; }
    b.disabled = true;
    const out = await api("/api/tools/remove", body);
    if (out.error) return say(out.error, true);
    say(out.removed && out.removed.length ? `Removed. Freed ${fmt(out.freed)}.` : "Nothing to remove.");
    load();
  };
  return b;
}
function fmt(n) { n = n || 0; return n >= 107374182 ? (n / 1073741824).toFixed(1) + " GB" : Math.round(n / 1048576) + " MB"; }

function row(first, i) {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<span>${esc(first)}</span><span class="num">${esc(i.size)}</span>
    <span class="muted hide-sm">${esc(i.date)}</span><span class="muted hide-sm">${esc(SYS[i.platform] || i.platform)}</span>`;
  el.appendChild(removeButton("Remove", {team: i.team, tool: i.tool}));
  return el;
}

function render() {
  $("bytool").setAttribute("aria-pressed", group === "tool"); $("byteam").setAttribute("aria-pressed", group === "team");
  const list = $("list"); list.innerHTML = "";
  const groups = group === "tool" ? (data.by_tool || []) : (data.by_team || []);
  for (const job of data.jobs || []) {
    const c = document.createElement("div"); c.className = "card";
    const tname = (data.catalog || []).find((t) => t.id === job.tool);
    c.innerHTML = job.state === "installing"
      ? `<b>Installing ${esc(tname ? tname.name : job.tool)}</b> <span class="muted">for ${esc(teamName(job.team))}. This can take a few minutes.</span>`
      : `<b>${esc(tname ? tname.name : job.tool)} did not install.</b> <span class="muted">${esc(job.error || "")}</span>`;
    list.appendChild(c);
  }
  if (!groups.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "No tools installed yet."; list.appendChild(p); }
  for (const g of groups) {
    const c = document.createElement("div"); c.className = "card";
    const top = document.createElement("div"); top.className = "top";
    const total = g.installs.reduce((a, i) => a + (i.bytes || 0), 0);
    top.innerHTML = `<h2>${esc(group === "tool" ? g.tool_name : g.team_name)}</h2><span class="muted">${fmt(total)}</span>`;
    if (group === "team") top.appendChild(removeButton("Remove all", {team: g.team}));
    c.appendChild(top);
    for (const i of g.installs) c.appendChild(row(group === "tool" ? (i.team_name || i.team) : i.tool_name, i));
    list.appendChild(c);
  }
}
function teamName(id) { const t = (data.teams || []).find((x) => x.id === id); return t ? t.name : id; }

function fillAdd() {
  const team = $("team").value, tool = $("tool").value;
  $("team").innerHTML = (data.teams || []).map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  $("tool").innerHTML = (data.catalog || []).map((t) =>
    `<option value="${esc(t.id)}">${esc(t.name)} (${esc(t.size)})${t.fits ? "" : ", does not fit"}</option>`).join("");
  if (team) $("team").value = team; if (tool) $("tool").value = tool;
  $("add").hidden = !(data.teams || []).length;
  if (data.catalog_error) say(data.catalog_error, true);
}

async function load() {
  data = await api("/api/tools");
  if (data.error) return say(data.error, true);
  $("used").textContent = data.used_text; $("free").textContent = data.free_text;
  $("plat").textContent = SYS[data.platform] || data.platform;
  render(); fillAdd();
  clearTimeout(timer);
  if ((data.jobs || []).some((j) => j.state === "installing")) timer = setTimeout(load, 3000);
}

function clearVerdict() { $("verdict").hidden = true; $("install").hidden = true; }
$("team").onchange = clearVerdict; $("tool").onchange = clearVerdict;
$("check").onclick = async () => {
  $("check").disabled = true;
  const out = await api("/api/tools/add", {team: $("team").value, tool: $("tool").value, check_only: true});
  $("check").disabled = false;
  const v = $("verdict"); v.hidden = false;
  if (out.error) { v.className = "verdict no"; v.textContent = out.error; return; }
  v.className = "verdict " + (out.ok ? "ok" : "no");
  v.textContent = out.ok ? [`Fits this computer. Needs about ${out.size}.`, ...(out.notes || []), "", out.summary].join("\n")
                         : (out.reasons || []).join("\n");
  $("install").hidden = !out.ok;
};
$("install").onclick = async () => {
  $("install").disabled = true;
  const out = await api("/api/tools/add", {team: $("team").value, tool: $("tool").value});
  $("install").disabled = false; clearVerdict();
  if (out.error || out.ok === false) return say(out.error || (out.reasons || []).join(" "), true);
  say("Installing. You can leave this page.");
  load();
};
load();
</script>
</body>
</html>
