<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Idli has learned</title>
<style>
:root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc; --accent: #2f5d50;
  --bad: #9b2c2c; --bad-soft: #fbe5e5; --chip: #f0eee9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7;
  --muted: #a3a29c; --line: #34332f; --accent: #8cc7b2; --bad: #f0a3a3; --bad-soft: #3d2222; --chip: #2a2a27; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 22px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
.card h2 { font-size: 15px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 6px; margin: 2px 4px 0 0; font-size: 12px; }
button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
button.del { color: var(--bad); border-color: var(--bad); margin-top: 10px; }
button.sure { background: var(--bad); color: #fff; }
.empty { color: var(--muted); margin-top: 20px; }
.msg { color: var(--muted); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>What Idli has learned</h1>
  <div class="sub">Here is a list of files Idli has learned to analyze.</div>
  <div id="list">Loading…</div>
</main>
<script>
const T = new URLSearchParams(location.search).get("t");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path, body) {
  const r = await fetch(path + "?t=" + encodeURIComponent(T),
    body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let last = null;
async function load() {
  let skills;
  const el = document.getElementById("list");
  try { skills = await api("/api/skills"); }
  catch (e) { if (last === null) el.textContent = "Idli isn't running yet; this list comes back when it is."; return; }
  const now = JSON.stringify(skills);
  if (now === last) return;  // unchanged: keep the page as it is (a half-clicked Delete stays)
  last = now;
  if (!skills.length) { el.innerHTML = `<div class="empty">Nothing yet.</div>`; return; }
  el.innerHTML = skills.map(s => `<div class="card" data-id="${esc(s.id)}">
      <h2>${esc(s.title)} <span class="meta">v${esc(s.version)}</span></h2>
      <div class="meta">Tabs: ${s.tabs.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      <div class="meta">${s.checks} checks · ${s.measures} measures · ${s.charts.length} chart${s.charts.length === 1 ? "" : "s"}${s.charts.length ? ": " + s.charts.map(esc).join(", ") : ""} · changed ${esc(s.changed)}</div>
      ${s.taught ? `<div class="meta">Taught: ${esc(s.taught)}</div>` : ""}
      <button class="del">Delete</button>
      <div class="msg"></div></div>`).join("");
  el.querySelectorAll(".card").forEach(card => {
    const b = card.querySelector(".del");
    b.onclick = async () => {
      if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Delete for sure?"; return; }
      try {
        const j = await api("/api/skills/delete", {id: card.dataset.id});
        card.querySelector(".msg").textContent = `Deleted. Kept at ${j.kept_at} in case you need it back.`;
        b.remove();
        card.style.opacity = .6;
      } catch (e) { card.querySelector(".msg").textContent = e.message; }
    };
  });
}
load();
setInterval(() => { if (!document.hidden) load(); }, 5000);  // it grows as Idli learns files
</script>
</body>
</html>
