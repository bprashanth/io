<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams</title>
<style>
:root { --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dedcd6; --accent: #2f5d50;
  --on-accent: #ffffff; --soft: #e8f0ec; --danger: #a33a2c; --on-danger: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111110; --card: #1b1b1a;
  --ink: #ecebe7; --muted: #a3a29c; --line: #33332f; --accent: #8cc7b2; --on-accent: #0b0b0b; --soft: #1f2b27;
  --danger: #e08a7c; --on-danger: #1a0b08; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 20px 48px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 22px; margin: 0 0 6px; line-height: 1.3; }
.sub { color: var(--muted); margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex;
  flex-direction: column; gap: 8px; min-height: 168px; }
.card.fresh { border-color: var(--accent); box-shadow: 0 0 0 2px var(--soft); }
.card h3 { margin: 0; font-size: 17px; }
.card .goal { color: var(--muted); font-size: 14px; flex: 1; }
.card .tag { align-self: flex-start; font-size: 12px; color: var(--accent); background: var(--soft); border-radius: 999px;
  padding: 2px 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button { font: inherit; font-weight: 600; border-radius: 999px; min-height: 44px; padding: 0 20px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.danger { background: var(--danger); color: var(--on-danger); border-color: var(--danger); }
button.link { border: 0; padding: 0 4px; min-height: 32px; color: var(--accent); font-weight: 600; }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible, .opt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.new { border: 1.5px dashed var(--line); background: transparent; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink); font-size: 16px; }
.new:hover { border-color: var(--accent); }
.new .plus { font-size: 30px; line-height: 1; color: var(--accent); font-weight: 400; }
.msg { color: var(--muted); font-size: 13px; min-height: 1.2em; }
.msg.err { color: var(--danger); }
.panel { max-width: 560px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; color: var(--muted);
  font-size: 13px; }
.bar { height: 4px; background: var(--line); border-radius: 4px; margin: 0 0 28px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 14px 0 8px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { text-align: left; border-radius: 12px; padding: 14px 16px; min-height: 60px; background: var(--card);
  display: block; width: 100%; font-weight: 400; }
.opt b { display: block; font-size: 16px; }
.opt span { color: var(--muted); font-size: 14px; }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--soft); }
.foot { display: flex; justify-content: space-between; margin-top: 26px; gap: 8px; }
.plan { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 16px 0 0; }
.plan ul { margin: 10px 0 0; padding-left: 18px; }
.plan li { margin: 4px 0; }
.help { background: var(--soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-top: 10px; }
.confirm { font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="dash">
    <h1>Teams</h1>
    <p class="sub" id="dashsub">Each team gets its own heading in your sidebar.</p>
    <div class="grid" id="grid"></div>
    <p class="msg" id="dashmsg" role="status"></p>
  </section>
  <section id="wiz" class="panel" hidden>
    <div class="top"><span id="step"></span><button class="link" id="cancel" type="button">Cancel</button></div>
    <div class="bar"><i id="barfill"></i></div>
    <div id="body"></div>
    <p class="msg" id="wizmsg" role="status"></p>
    <div class="foot"><button type="button" id="back">Back</button><button type="button" class="primary" id="next">Next</button></div>
  </section>
</main>
<script>
const T = new URLSearchParams(location.search).get("t");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
async function api(path, body) {
  const res = await fetch(`${path}?t=${encodeURIComponent(T)}`, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const out = await res.json().catch(() => ({}));
  if (!res.ok && !out.error) out.error = "Idli could not finish this step. Try again.";
  return out;
}

// ------------------------------------------------------------------ the dashboard
let fresh = null;
async function showDash(note) {
  $("wiz").hidden = true; $("dash").hidden = false;
  $("dashmsg").className = "msg"; $("dashmsg").textContent = note || "";
  const out = await api("/api/teams");
  const grid = $("grid");
  grid.innerHTML = "";
  const add = document.createElement("button");
  add.type = "button"; add.className = "card new"; add.id = "newteam";
  add.innerHTML = '<span class="plus" aria-hidden="true">+</span><span>New team</span>';
  add.onclick = () => startWizard();
  for (const t of out.teams || []) grid.appendChild(card(t));
  grid.appendChild(add);
  if (out.error) { $("dashmsg").className = "msg err"; $("dashmsg").textContent = out.error; }
}
function card(t) {
  const el = document.createElement("div");
  el.className = "card" + (t.id === fresh ? " fresh" : "");
  el.innerHTML = `${t.id === fresh ? '<span class="tag">New</span>' : ""}<h3>${esc(t.name)}</h3>
    <div class="goal">${esc(t.goal || "")}</div>
    <div class="row acts"><button type="button" class="primary open">Open</button>
    ${t.builtin ? "" : '<button type="button" class="del">Delete</button>'}</div>
    <div class="msg"></div>`;
  const msg = el.querySelector(".msg"), acts = el.querySelector(".acts");
  el.querySelector(".open").onclick = async (e) => {
    e.target.disabled = true; msg.className = "msg"; msg.textContent = "Opening...";
    const out = await api("/api/team-open", {id: t.id});
    e.target.disabled = false;
    msg.className = out.ok ? "msg" : "msg err"; msg.textContent = out.ok ? "" : out.error;
  };
  const del = el.querySelector(".del");
  if (del) del.onclick = () => {
    acts.innerHTML = `<span class="confirm">Delete ${esc(t.name)} and its chats?</span>
      <button type="button" class="danger yes">Delete</button><button type="button" class="no">Keep</button>`;
    acts.querySelector(".no").onclick = () => showDash();
    acts.querySelector(".yes").onclick = async (e) => {
      e.target.disabled = true; msg.className = "msg"; msg.textContent = "Deleting...";
      const out = await api("/api/team-delete", {id: t.id});
      if (out.ok) { if (fresh === t.id) fresh = null; showDash(`${t.name} was deleted.`); }
      else { msg.className = "msg err"; msg.textContent = out.error; e.target.disabled = false; }
    };
  };
  return el;
}

// ------------------------------------------------------------------ making a team, one question per panel
const EXAMPLE_GOAL = "Lower household debt in 12 villages";
const STEPS = [
  {key: "name", kind: "text", q: () => "What's your team called?", hint: "Insights is fine for a try-out.",
   quick: "Insights"},
  {key: "goal", kind: "text", q: (a) => `What does ${a.name} work towards?`, hint: "One line is enough.",
   quick: "Use an example", optional: true},
  {key: "data", kind: "pick", q: () => "Where does the team keep its data?", opts: [
    ["Google Drive", "Sheets and Excel files in Drive."], ["On this computer", "Excel or CSV files."],
    ["Somewhere else", "For example KoBo, Zoho or paper."]]},
  {key: "people", kind: "pick", q: (a) => `Who will use ${a.name}?`, opts: [
    ["Just me", "Others can join later."], ["A few of us", "Two to five people."],
    ["The whole team", "More than five people."]]},
  {key: "private", kind: "pick", q: () => "Do the files have names, places or phone numbers?", opts: [
    ["Yes", "Idli turns them into codes before Claude sees them."], ["No", "Idli still checks each file."],
    ["Not sure", "Idli checks each file for you."]]},
  {key: "outside", kind: "pick", q: () => "When a Mini can't answer a question, may Idli ask an outside service?",
   help: "A service online that writes a query for a new question. It gets the question and column names, never rows. The query runs on this computer.",
   opts: [["Yes, ask me each time", "It gets the question and column names. Never rows."],
          ["No", "Questions stay on this computer."]]},
  {key: "plan", kind: "plan", q: (a) => `Set up ${a.name}?`},
];
let a = {}, i = 0;
function startWizard() { a = {}; i = 0; $("dash").hidden = true; $("wiz").hidden = false; render(); }
function say(text, err) { $("wizmsg").className = err ? "msg err" : "msg"; $("wizmsg").textContent = text || ""; }
function render() {
  const s = STEPS[i];
  say("");
  $("step").textContent = s.kind === "plan" ? "Last step" : `Step ${i + 1} of ${STEPS.length - 1}`;
  $("barfill").style.width = `${Math.round(100 * i / (STEPS.length - 1))}%`;
  $("back").textContent = i === 0 ? "Cancel" : "Back";
  $("next").hidden = s.kind === "pick";
  $("next").disabled = false;
  $("next").textContent = s.kind === "plan" ? "Set it up" : "Next";
  const body = $("body");
  if (s.kind === "text") {
    body.innerHTML = `<h2 id="q">${esc(s.q(a))}</h2>
      <input type="text" id="in" maxlength="${s.key === "name" ? 40 : 200}" aria-labelledby="q" autocomplete="off">
      <div class="row"><span class="msg">${esc(s.hint)}</span><button type="button" class="link" id="quick">${esc(s.quick)}</button></div>`;
    const inp = $("in");
    inp.value = s.key === "goal" ? (a.goal || "") : (a.name || "");
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); next(); } };
    $("quick").onclick = () => { inp.value = s.key === "name" ? "Insights" : EXAMPLE_GOAL; next(); };
    setTimeout(() => inp.focus(), 0);
  } else if (s.kind === "pick") {
    body.innerHTML = `<h2 id="q">${esc(s.q(a))}</h2>${s.help ? '<button type="button" class="link" id="what">What is this?</button><div class="help" id="helptext" hidden></div>' : ""}
      <div class="opts" role="group" aria-labelledby="q"></div>`;
    if (s.help) { $("helptext").textContent = s.help; $("what").onclick = () => { $("helptext").hidden = !$("helptext").hidden; }; }
    const box = body.querySelector(".opts");
    for (const [label, desc] of s.opts) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt" + (a[s.key] === label ? " on" : "");
      b.innerHTML = `<b>${esc(label)}</b><span>${esc(desc)}</span>`;
      b.onclick = () => { a[s.key] = label; i += 1; render(); };
      box.appendChild(b);
    }
    setTimeout(() => box.querySelector(".opt.on, .opt")?.focus(), 0);
  } else {
    const name = esc(a.name), lines = [
      "Its own heading in your sidebar. Ask on the left, Claude helps on the right.",
      "Files come from Google Drive and stay on this computer." +
        (a.data && a.data !== "Google Drive" ? " Put a copy of your files in Drive." : ""),
      a.private === "No" ? "Idli still checks each file. Any names go to Claude as codes."
        : "Names, places and phone numbers go to Claude as codes.",
      a.outside === "No" ? "Minis answer on this computer. New questions stay here too."
        : "Minis answer on this computer. New questions go to an outside service only if you say yes.",
      a.people === "Just me" ? "For you for now. Others can join later."
        : "For your team. Each person uses their own Google login."];
    body.innerHTML = `<h2>${esc(s.q(a))}</h2><div class="plan"><b>${name}</b>${a.goal ? `<div class="msg">Works towards: ${esc(a.goal)}</div>` : ""}
      <ul>${lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>`;
  }
}
async function next() {
  const s = STEPS[i];
  if (s.kind === "text") {
    const v = $("in").value.trim();
    if (s.key === "name") {
      if (!v) return say("Type a name, or click Insights.", true);
      $("next").disabled = true;
      const out = await api("/api/team-check", {name: v});
      $("next").disabled = false;
      if (!out.ok) return say(out.error, true);
      a.name = out.name;
    } else {
      a.goal = v ? (await api("/api/team-goal", {text: v})).goal || v : "";
    }
    i += 1; return render();
  }
  if (s.kind === "plan") {
    $("next").disabled = true; $("back").disabled = true;
    say(`Setting up ${a.name}...`);
    const out = await api("/api/team-create", {name: a.name, goal: a.goal || "", data: a.data, people: a.people,
      private: a.private, outside: a.outside !== "No"});
    $("back").disabled = false;
    if (!out.ok) { $("next").disabled = false; return say(out.error || "Could not set it up. Try again.", true); }
    fresh = out.id;
    return showDash(`${out.name} is ready. Click Open to start.`);
  }
}
$("next").onclick = next;
$("back").onclick = () => { if (i === 0) return showDash(); i -= 1; render(); };
$("cancel").onclick = () => showDash();
showDash();
</script>
</body>
</html>
