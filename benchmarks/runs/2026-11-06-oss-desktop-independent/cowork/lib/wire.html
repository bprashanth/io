<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sent to Claude</title>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>
<style>
:root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc; --accent: #2f5d50;
  --bad: #9b2c2c; --bad-soft: #fbe5e5; --chip: #f0eee9; --code: #e4efe9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7;
  --muted: #a3a29c; --line: #34332f; --accent: #8cc7b2; --bad: #f0a3a3; --bad-soft: #3d2222; --chip: #2a2a27; --code: #23392f; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 22px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin-bottom: 14px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=search], select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); }
input[type=search] { flex: 1; min-width: 180px; }
.note { margin-top: 10px; color: var(--muted); font-size: 13px; }
.note b { color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--muted); }
.chip { background: var(--chip); color: var(--ink); border-radius: 5px; padding: 0 6px; font-size: 12px; }
.stopped { color: var(--bad); font-weight: 600; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, monospace; margin-top: 8px;
  max-height: 9em; overflow: hidden; }
.card.open .text { max-height: none; }
mark { background: var(--code); color: var(--accent); border-radius: 3px; padding: 0 2px; }
mark.hit { background: #f4e3a1; color: #1d1d1b; }
button { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; margin-top: 6px; }
.empty { color: var(--muted); margin-top: 20px; }
/* Inside the Privacy chat: the chat shows the title; the list scrolls inside its frame. */
html.embed body { background: transparent; }
html.embed main { max-width: none; padding: 4px 6px 10px; }
html.embed h1 { display: none; }
html.embed #list { max-height: 520px; overflow-y: auto; }
</style>
</head>
<body>
<main>
  <h1>Sent to Claude</h1>
  <div class="sub">What Idli's privacy guard sent to Claude from this computer in the last 7 days. Private values
    went as codes like <mark>NAME_004</mark>. Only what was new in each message is shown.</div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search a name or a word" aria-label="Search">
    <select id="app" aria-label="App"><option value="">All apps</option></select>
  </div>
  <div class="note" id="note" hidden></div>
  <div id="list">Loading…</div>
</main>
<script>
const P = new URLSearchParams(location.search), T = P.get("t");
if (P.get("q")) document.getElementById("q").value = P.get("q");
const post = () => { if (P.get("embed") === "1") parent.postMessage({type: "idli-height",
  px: Math.ceil(document.querySelector("main").getBoundingClientRect().height + 8)}, "*"); };
new ResizeObserver(post).observe(document.body);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CODE = /\b[A-Z]{2,}_\d{3}\b/g;
const when = t => { const d = new Date(t); return isNaN(d) ? t : d.toLocaleString("en-IN",
  {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit"}); };
function marked(text, terms) {
  let html = esc(text).replace(CODE, c => `<mark>${c}</mark>`);
  for (const t of terms) if (t) {
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    html = html.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag || txt.replace(re, x => `<mark class="hit">${x}</mark>`));
  }
  return html;
}
let timer = null, apps = new Set();
async function load() {
  const q = document.getElementById("q").value.trim(), app = document.getElementById("app").value;
  const list = document.getElementById("list"), note = document.getElementById("note");
  let r;
  try {
    const res = await fetch(`/api/wire?t=${encodeURIComponent(T)}&q=${encodeURIComponent(q)}&app=${encodeURIComponent(app)}`);
    r = await res.json();
    if (!res.ok) throw new Error(r.error || res.statusText);
  } catch (e) { list.innerHTML = `<div class="empty">Idli isn't running yet. This list comes back when it is.</div>`; return; }
  const sel = document.getElementById("app");
  for (const a of r.apps) if (!apps.has(a)) { apps.add(a); sel.insertAdjacentHTML("beforeend", `<option>${esc(a)}</option>`); }
  note.hidden = !(q && r.codes.length);
  if (q && r.codes.length) note.innerHTML = `<b>${esc(q)}</b> is private. It went to Claude only as ${r.codes.map(c => `<mark>${esc(c)}</mark>`).join(", ")}.`;
  if (!r.entries.length) {
    list.innerHTML = `<div class="empty">${q ? "Nothing sent matches this." : "Nothing sent yet."}</div>`;
    return;
  }
  const terms = [q, ...r.codes];
  list.innerHTML = r.entries.map(e => `<div class="card">
      <div class="head"><span>${esc(when(e.time))}</span><span class="chip">${esc(e.app)}</span>
        ${e.refused ? `<span class="stopped">Stopped. A private value was still in it, so nothing was sent.</span>`
                    : `<span>${e.masked} private values hidden</span>`}</div>
      ${e.refused ? `<div class="text">Codes that stopped it: ${marked((e.codes || []).join(", "), terms)}</div>`
                  : e.text ? `<div class="text">${marked(e.text, terms)}</div>` : `<div class="text">Nothing new (the same conversation sent again).</div>`}
    </div>`).join("");
  list.querySelectorAll(".card").forEach(card => {
    const t = card.querySelector(".text");
    // Decide by the text, not the layout: inside a chat the frame can still be sizing itself when this runs.
    const raw = t ? t.textContent : "";
    if (t && (raw.split("\n").length > 6 || raw.length > 360)) {
      const b = document.createElement("button"); b.textContent = "Show all";
      b.onclick = () => { card.classList.toggle("open"); b.textContent = card.classList.contains("open") ? "Show less" : "Show all"; };
      card.appendChild(b);
    }
  });
}
document.getElementById("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 250); });
document.getElementById("app").addEventListener("change", load);
load();
setInterval(() => { if (!document.getElementById("q").value && !document.hidden && !document.querySelector(".card.open")) load(); }, 15000);
</script>
</body>
</html>
