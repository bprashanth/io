# Copy to ~/idli-insights/config/codex-t4gc/config.toml (Windows: %USERPROFILE%\idli-insights\config\codex-t4gc\config.toml).
# A separate CODEX_HOME: no ChatGPT login lives here, so nothing from your subscription is sent to Idli.
# Muse is reached through the SSH tunnel (laptop 127.0.0.1:8181 -> DGX Muse). Test only: no Idli auth yet.
model = "muse-glimmer-30b"
model_provider = "t4gc"
model_reasoning_effort = "low"
model_context_window = 65536
model_auto_compact_token_limit = 45000
approval_policy = "on-request"
sandbox_mode = "workspace-write"
check_for_update_on_startup = false
web_search = "disabled"
[model_providers.t4gc]
name = "T4GC model (Idli Muse)"
base_url = "http://127.0.0.1:8181/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
