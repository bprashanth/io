<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maternal Health Coverage - District Comparison</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --line:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--ink);line-height:1.5}
header{max-width:960px;margin:0 auto;padding:28px 20px 8px}
h1{margin:0 0 4px;font-size:26px}
header p{margin:0;color:var(--muted)}
main{max-width:960px;margin:0 auto;padding:16px 20px 8px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.controls{display:flex;gap:28px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;
      color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
select{font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
       background:#fff;min-width:320px;color:var(--ink)}
h2{margin:0 0 4px;font-size:18px}
.card-head p{margin:0 0 14px;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:34px 150px 1fr 76px 130px;gap:10px;
     align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rank{width:26px;height:26px;border-radius:50%;background:#eef2ff;color:#3730a3;
      font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.label{font-weight:600}
.bar-track{background:#eef2f7;border-radius:6px;height:26px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,#1d4ed8,#3b82f6);border-radius:6px}
.value{font-weight:700;text-align:right}
.raw{color:var(--muted);text-align:right;font-size:13px}
.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:6px}
.field .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
          font-weight:700;margin-bottom:2px}
.field .v{font-size:15px}
code.formula{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;
             background:#0f172a;color:#7dd3fc;padding:10px 12px;border-radius:8px;font-size:14px}
.disclaimer{margin-top:16px;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;
            border-radius:8px;color:#92400e;font-size:14px}
footer{max-width:960px;margin:0 auto;text-align:center;color:var(--muted);
       font-size:13px;padding:14px 20px 30px}
@media (max-width:680px){
  .row{grid-template-columns:120px 1fr 64px}
  .rank,.raw{display:none}
  select{min-width:220px}
}
</style>
</head>
<body>
<header>
  <h1>Maternal Health Coverage</h1>
  <p>Institutional delivery &amp; postnatal check coverage - compare districts by year</p>
</header>
<main>
  <section class="card controls">
    <label for="indicator">Indicator
      <select id="indicator"></select>
    </label>
    <label for="year">Year
      <select id="year"></select>
    </label>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 id="chart-title"></h2>
      <p id="chart-def"></p>
    </div>
    <div id="bars"></div>
  </section>

  <section class="card">
    <h2>Source &amp; formula</h2>
    <div id="source" class="source-grid"></div>
    <div id="disclaimer"></div>
  </section>
</main>
<footer>Generated by build.py from maternal_health.xlsx - data computed client-side, no external dependencies.</footer>
<script>
const DATA = {
  "workbook": "maternal_health.xlsx",
  "sourceSheet": "District Data",
  "dataColumns": [
    "district",
    "year",
    "pregnancies_registered",
    "institutional_deliveries",
    "postnatal_check_48h"
  ],
  "records": [
    {
      "district": "Gaya",
      "year": 2022,
      "pregnancies_registered": 1100,
      "institutional_deliveries": 792,
      "postnatal_check_48h": 693
    },
    {
      "district": "Gaya",
      "year": 2023,
      "pregnancies_registered": 1200,
      "institutional_deliveries": 900,
      "postnatal_check_48h": 816
    },
    {
      "district": "Nalanda",
      "year": 2022,
      "pregnancies_registered": 1000,
      "institutional_deliveries": 780,
      "postnatal_check_48h": 720
    },
    {
      "district": "Nalanda",
      "year": 2023,
      "pregnancies_registered": 1100,
      "institutional_deliveries": 880,
      "postnatal_check_48h": 825
    },
    {
      "district": "Purnia",
      "year": 2022,
      "pregnancies_registered": 1300,
      "institutional_deliveries": 819,
      "postnatal_check_48h": 728
    },
    {
      "district": "Purnia",
      "year": 2023,
      "pregnancies_registered": 1400,
      "institutional_deliveries": 924,
      "postnatal_check_48h": 812
    }
  ],
  "indicators": [
    {
      "name": "Institutional delivery coverage",
      "definition": "Share of registered pregnancies with an institutional delivery",
      "formula": "institutional_deliveries / pregnancies_registered * 100",
      "unit": "percent",
      "source": "synthetic maternal-health workbook fixture",
      "numerator": "institutional_deliveries",
      "denominator": "pregnancies_registered"
    },
    {
      "name": "Postnatal check within 48 hours coverage",
      "definition": "Share of registered pregnancies with a recorded postnatal check within 48 hours",
      "formula": "postnatal_check_48h / pregnancies_registered * 100",
      "unit": "percent",
      "source": "synthetic maternal-health workbook fixture",
      "numerator": "postnatal_check_48h",
      "denominator": "pregnancies_registered"
    }
  ],
  "years": [
    2022,
    2023
  ],
  "districts": [
    "Gaya",
    "Nalanda",
    "Purnia"
  ],
  "notes": [
    "Illustrative benchmark data; not official statistics and not person-level records"
  ]
};
const records = DATA.records;
const indicators = DATA.indicators;
const years = DATA.years;

const selInd = document.getElementById("indicator");
const selYear = document.getElementById("year");
const fmt = new Intl.NumberFormat("en-IN");

for (const ind of indicators) selInd.add(new Option(ind.name, ind.name));
for (const y of years) selYear.add(new Option(y, y));
const DEFAULT_INDICATOR = "Postnatal check within 48 hours coverage";
if (indicators.some((i) => i.name === DEFAULT_INDICATOR)) selInd.value = DEFAULT_INDICATOR;
selYear.value = String(years[years.length - 1]);

function currentIndicator() {
  return indicators.find((i) => i.name === selInd.value);
}

function render() {
  const ind = currentIndicator();
  const year = Number(selYear.value);

  const rows = records
    .filter((r) => r.year === year)
    .map((r) => ({
      district: r.district,
      num: r[ind.numerator],
      den: r[ind.denominator],
      value: r[ind.denominator] ? (r[ind.numerator] / r[ind.denominator]) * 100 : null,
    }))
    .sort((a, b) => (b.value === null ? -1 : b.value) - (a.value === null ? -1 : a.value));

  document.getElementById("chart-title").textContent =
    ind.name + " - " + year + " (by district)";
  document.getElementById("chart-def").textContent = ind.definition;

  const bars = document.getElementById("bars");
  bars.innerHTML = "";
  rows.forEach((row, idx) => {
    const el = document.createElement("div");
    el.className = "row";
    el.title = row.district + ": " + fmt.format(row.num) + " " + ind.numerator +
               " / " + fmt.format(row.den) + " " + ind.denominator;
    el.innerHTML =
      '<div class="rank">' + (idx + 1) + "</div>" +
      '<div class="label">' + row.district + "</div>" +
      '<div class="bar-track"><div class="bar" style="width:' +
        (row.value === null ? 0 : Math.min(Math.round(row.value * 10) / 10, 100)) + '%"></div></div>' +
      '<div class="value">' + (row.value === null ? "n/a" : row.value.toFixed(1) + "%") + "</div>" +
      '<div class="raw">' + fmt.format(row.num) + " / " + fmt.format(row.den) + "</div>";
    bars.appendChild(el);
  });

  document.getElementById("source").innerHTML =
    '<div class="field"><div class="k">Indicator</div><div class="v">' + ind.name + "</div></div>" +
    '<div class="field"><div class="k">Definition</div><div class="v">' + ind.definition + "</div></div>" +
    '<div class="field"><div class="k">Formula</div><code class="formula">' + ind.formula + "</code></div>" +
    '<div class="field"><div class="k">Unit</div><div class="v">' + ind.unit + "</div></div>" +
    '<div class="field"><div class="k">Source sheet</div><div class="v">' + DATA.sourceSheet + "</div></div>" +
    '<div class="field"><div class="k">Columns used</div><div class="v">' +
      "district, year, " + ind.numerator + ", " + ind.denominator + "</div></div>" +
    '<div class="field"><div class="k">Workbook</div><div class="v">' + DATA.workbook + "</div></div>" +
    '<div class="field"><div class="k">Data source</div><div class="v">' + ind.source + "</div></div>";

  document.getElementById("disclaimer").innerHTML = DATA.notes
    .map((n) => '<div class="disclaimer"><strong>Important:</strong> ' + n + "</div>")
    .join("");
}

selInd.addEventListener("change", render);
selYear.addEventListener("change", render);
render();
</script>
</body>
</html>
