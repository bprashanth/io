<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beneficiary Lookup</title>
<style>
    :root {
        --primary: #2c3e50;
        --secondary: #3498db;
        --bg: #f4f7f6;
        --card-bg: #ffffff;
        --text: #333333;
        --border: #e0e0e0;
        --success: #27ae60;
        --warning: #f39c12;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.5;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
    }
    h1 {
        color: var(--primary);
        text-align: center;
        margin-bottom: 30px;
        font-size: 1.8rem;
    }
    .search-box {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    input[type="text"] {
        flex: 1;
        min-width: 200px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 1rem;
    }
    button {
        background-color: var(--secondary);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: background 0.2s;
    }
    button:hover { background-color: #2980b9; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .results-area {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .result-card {
        background: var(--card-bg);
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        overflow: hidden;
        border-left: 5px solid var(--secondary);
    }
    .result-header {
        background: #ecf0f1;
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .result-header h2 {
        margin: 0;
        font-size: 1.2rem;
        color: var(--primary);
    }
    .udid-badge {
        background: var(--primary);
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: bold;
    }
    .result-body {
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }
    .info-group {
        display: flex;
        flex-direction: column;
    }
    .info-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #7f8c8d;
        font-weight: 600;
        margin-bottom: 4px;
    }
    .info-value {
        font-size: 1rem;
        font-weight: 500;
    }
    .status-issued { color: var(--success); font-weight: bold; }
    .status-pending { color: var(--warning); font-weight: bold; }
    .no-results {
        text-align: center;
        padding: 40px;
        color: #7f8c8d;
        background: var(--card-bg);
        border-radius: 8px;
    }
    .empty-state {
        text-align: center;
        padding: 40px;
        color: #7f8c8d;
        background: var(--card-bg);
        border-radius: 8px;
        margin-bottom: 20px;
    }
    @media (max-width: 600px) {
        .search-box { flex-direction: column; }
        .result-header { flex-direction: column; align-items: flex-start; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Beneficiary Lookup</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter UDID Number..." aria-label="Search by UDID Number" style="">
        <button id="searchBtn">Search</button>
    </div>

    <div id="emptyState" class="empty-state">Enter a UDID Number above to view beneficiary details.</div>

    <div id="resultsArea" class="results-area"></div>
</div>

<script>
    // Service Worker Registration for Offline Capability
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'beneficiary-app-v1';
            self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))));
            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed (expected in some environments):', err));
    }

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsArea = document.getElementById('resultsArea');
    const emptyState = document.getElementById('emptyState');

    // Helper: Format Date
    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return new Date(dateString).toLocaleDateString(undefined, options);
    }

    // Helper: Format Phone
    function formatPhone(phone) {
        if (!phone) return 'N/A';
        return phone.replace(/\D/g, '');
    }

    // Core Logic: Render a single beneficiary card
    function renderCard(data) {
        const deviceStatus = data.assistive_device_issued ? 'Issued' : 'Not Issued';
        const deviceClass = data.assistive_device_issued ? 'status-issued' : 'status-pending';
        
        const html = `
            <div class="result-card">
                <div class="result-header">
                    <h2>${data.name}</h2>
                    <span class="udid-badge">UDID: ${data.udid_number}</span>
                </div>
                <div class="result-body">
                    <div class="info-group">
                        <span class="info-label">Gender</span>
                        <span class="info-value">${data.gender}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Date of Birth</span>
                        <span class="info-value">${formatDate(data.dob)}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Disability Type</span>
                        <span class="info-value">${data.disability_type}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Disability Level</span>
                        <span class="info-value">${data.disability}%</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Village</span>
                        <span class="info-value">${data.village}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Guardian Name</span>
                        <span class="info-value">${data.guardian_name}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Guardian Phone</span>
                        <span class="info-value">${formatPhone(data.guardian_phone)}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Assistive Device</span>
                        <span class="info-value ${deviceClass}">${deviceStatus}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Device Issue Date</span>
                        <span class="info-value">${formatDate(data.device_issue_date)}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Registration Date</span>
                        <span class="info-value">${formatDate(data.registration_date)}</span>
                    </div>
                </div>
            </div>
        `;
        return html;
    }

    // Core Logic: Search and Render
    function performSearch() {
        const query = searchInput.value.trim().toLowerCase();
        resultsArea.innerHTML = '';
        
        if (!query) {
            emptyState.style.display = 'block';
            return;
        }

        // Filter data
        const matches = window.data.filter(item => 
            item.udid_number.toLowerCase().includes(query)
        );

        if (matches.length === 0) {
            emptyState.style.display = 'block';
            emptyState.textContent = `No beneficiaries found with UDID containing "${query}".`;
            return;
        }

        emptyState.style.display = 'none';
        
        // Render matches
        matches.forEach(item => {
            resultsArea.innerHTML += renderCard(item);
        });
    }

    // Event Listeners
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });

    // Initial check if data exists (though usually empty on first load)
    if (window.data && window.data.length > 0) {
        emptyState.textContent = "Enter a UDID Number above to view beneficiary details.";
    }
</script>


</body></html>
