    <p>The repayment has been recorded against the ledger.</p>
    <ul id="statusDetails"></ul>

<script>
  // --- Service Worker Registration (Blob) ---
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'ledger-v1';
      self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))));
      self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed (offline mode):', err));
  }

  // --- Data Handling ---
  const form = document.getElementById('repaymentForm');
  const shgSelect = document.getElementById('shgSelect');
  const statusBox = document.getElementById('statusBox');
  const statusDetails = document.getElementById('statusDetails');
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');

  // Helper: Format currency
  const formatCurrency = (num) => {
    return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(num);
  };

  // Helper: Format date
  const formatDate = (dateStr) => {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  };

  // Initialize: Populate SHG List
  function init() {
    if (!window.data || !Array.isArray(window.data) || window.data.length === 0) {
      shgSelect.innerHTML = '<option value="">No SHG data available.</option>';
      return;
    }

    // Sort by SHG Name for better UX
    const sortedData = [...window.data].sort((a, b) => 
      a.shg_name.localeCompare(b.shg_name)
    );

    sortedData.forEach(row => {
      const option = document.createElement('option');
      // Use the primary name, fallback to Zoho name if primary is empty
      const name = row.shg_name || row.shg_name_as_in_zoho_books_invoices_export || 'Unknown SHG';
      option.value = row.shg_id;
      option.textContent = name;
      shgSelect.appendChild(option);
    });

    // Set default date to today
    document.getElementById('repaymentDate').valueAsDate = new Date();
  }

  // Validation Logic
  function validate() {
    const shgId = shgSelect.value;
    const amount = document.getElementById('repaymentAmount').value;
    const date = document.getElementById('repaymentDate').value;
    const purpose = document.getElementById('repaymentPurpose').value;

    let isValid = true;
    let errors = [];

    if (!shgId) {
      errors.push('Please select an SHG.');
      isValid = false;
    }

    if (!amount || parseFloat(amount) <= 0) {
      errors.push('Please enter a valid repayment amount.');
      isValid = false;
    }

    if (!date) {
      errors.push('Please select a repayment date.');
      isValid = false;
    }

    if (!purpose) {
      errors.push('Please select a purpose.');
      isValid = false;
    }

    // Check if SHG exists in data
    const shgData = window.data.find(d => d.shg_id === shgId);
    if (shgData) {
      // Optional: Check if outstanding balance is sufficient (simple check)
      // Note: This is a UI check, backend logic would be stricter.
      // We allow recording even if balance is 0 (maybe partial payment or error correction).
    }

    if (!isValid) {
      errors.forEach(err => {
        const el = document.getElementById(err === 'Please select an SHG.' ? 'shgError' : 'formError');
        if (el) el.style.display = 'block';
      });
      return false;
    }

    return true;
  }

  // Submit Handler
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    if (!validate()) {
      alert('Please fix the errors in the form before submitting.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    // Simulate network delay for better UX
    setTimeout(() => {
      const shgId = shgSelect.value;
      const shgData = window.data.find(d => d.shg_id === shgId);
      
      const record = {
        shg_id: shgId,
        shg_name: shgData.shg_name || shgData.shg_name_as_in_zoho_books_invoices_export,
        repayment_date: document.getElementById('repaymentDate').value,
        repayment_amount: parseFloat(document.getElementById('repaymentAmount').value),
        purpose: document.getElementById('repaymentPurpose').value,
        remarks: document.getElementById('remarks').value
      };

      // In a real app, we would POST to an API here.
      // For this offline demo, we just show success.
      
      // Update UI
      statusBox.style.display = 'block';
      statusDetails.innerHTML = `
        <li><strong>SHG:</strong> ${record.shg_name}</li>
        <li><strong>Date:</strong> ${formatDate(record.repayment_date)}</li>
        <li><strong>Amount:</strong> ${formatCurrency(record.repayment_amount)}</li>
        <li><strong>Purpose:</strong> ${record.purpose}</li>
        ${record.remarks ? `<li><strong>Remarks:</strong> ${record.remarks}</li>` : ''}
      `;

      // Scroll to bottom
      statusBox.scrollIntoView({ behavior: 'smooth' });

      // Reset button logic
      resetBtn.style.display = 'inline-block';
    }, 800);
  });

  // Reset Handler
  resetBtn.addEventListener('click', () => {
    form.reset();
    document.getElementById('shgError').style.display = 'none';
    statusBox.style.display = 'none';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Repayment Record';
    resetBtn.style.display = 'none';
    document.getElementById('repaymentDate').valueAsDate = new Date();
  });

  // Run on load
  init();

</script>
