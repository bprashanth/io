<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Enrolment 2025-26</title>
<style>
    :root {
        --primary: #2c7a7b;
        --primary-dark: #234e52;
        --bg: #f7fafc;
        --surface: #ffffff;
        --text: #2d3748;
        --border: #e2e8f0;
        --error: #e53e3e;
        --success: #38a169;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.5;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--surface);
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
        color: var(--primary-dark);
        text-align: center;
        margin-bottom: 10px;
        font-size: 1.8rem;
    }
    .subtitle {
        text-align: center;
        color: #718096;
        margin-bottom: 30px;
        font-size: 0.95rem;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .full-width {
        grid-column: span 2;
    }
    .form-group {
        display: flex;
        flex-direction: column;
    }
    label {
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 0.9rem;
        color: #4a5568;
    }
    input, select {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.2s;
    }
    input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(44, 122, 123, 0.2);
    }
    .error-msg {
        color: var(--error);
        font-size: 0.85rem;
        margin-top: 4px;
        min-height: 1.2em;
    }
    .success-msg {
        background-color: #c6f6d5;
        color: #22543d;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        text-align: center;
        display: none;
        border: 1px solid #9ae6b4;
    }
    button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
        transition: background-color 0.2s;
    }
    button:hover {
        background-color: var(--primary-dark);
    }
    button:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
    }
    @media (max-width: 600px) {
        .form-grid { grid-template-columns: 1fr; }
        .full-width { grid-column: span 1; }
    }
</style>
</head>

<div class="container">
    <h1>Student Enrolment 2025-26</h1>
    <div class="subtitle">Please fill in the details below for new admissions.</div>
    
    <div id="successMessage" class="success-msg"></div>

    <form id="enrolmentForm" novalidate="">
        <div class="form-grid">
            <!-- S.No (Auto-generated) -->
            <div class="form-group full-width">
                <label for="s_no">S.No</label>
                <input type="text" id="s_no" name="s_no" readonly="" style="background-color: rgb(237, 242, 247);">
            </div>

            <!-- Student ID -->
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" required="" placeholder="e.g. STU2025001" style="">
                <span class="error-msg" id="err_student_id"></span>
            </div>

            <!-- Name -->
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name" required="" placeholder="Full Name" style="">
                <span class="error-msg" id="err_name"></span>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required="">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <span class="error-msg" id="err_gender"></span>
            </div>

            <!-- DOB -->
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required="" style="">

            </div>

            <div class="form-group">
                <label for="class">Class</label>
                <select id="class" name="class" required="">

            <!-- Village -->
            <div class="form-group">
                <label for="village">Village</label>
                <input type="text" id="village" name="village" required="" placeholder="Village Name" style="">
                <span class="error-msg" id="err_village"></span>
            </div>

            <!-- Parent Name -->
            <div class="form-group">
                <label for="parent_name">Parent/Guardian Name</label>
                <input type="text" id="parent_name" name="parent_name" required="" placeholder="Father/Mother Name" style="">
                <span class="error-msg" id="err_parent_name"></span>
            </div>

            <!-- Parent Occupation -->
            <div class="form-group">
                <label for="parent_occupation">Parent Occupation</label>
                <input type="text" id="parent_occupation" name="parent_occupation" required="" placeholder="e.g. Farmer, Teacher" style="">
                <span class="error-msg" id="err_parent_occupation"></span>

            <!-- Aadhaar Number -->
            <div class="form-group">
                <label for="aadhaar_number">Aadhaar Number</label>
                <input type="text" id="aadhaar_number" name="aadhaar_number" required="" placeholder="12 digit number" style="">
                <span class="error-msg" id="err_aadhaar_number"></span>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" required="" placeholder="10 digit mobile number" style="">
                <span class="error-msg" id="err_phone_number"></span>
            </div>

            <!-- Enrolment Date -->
            <div class="form-group">
                <label for="enrolment_date">Enrolment Date</label>
                <input type="date" id="enrolment_date" name="enrolment_date" required="" style="">
                <span class="error-msg" id="err_enrolment_date"></span>
            </div>
        </div>

        <button type="submit" id="submitBtn">Submit Enrolment</button>
    </form>
</div>

<script>
    // --- Data Handling ---
    // Ensure window.data exists. If not, create a dummy array for testing.
    if (typeof window.data === 'undefined' || !Array.isArray(window.data)) {
        window.data = [];
    }

    // --- DOM Elements ---
    const form = document.getElementById('enrolmentForm');
    const successMsg = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const sNoInput = document.getElementById('s_no');

    // --- Helper Functions ---
    function showError(inputId, msgId, message) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(msgId);
        if (input) input.classList.add('error');
        if (errorSpan) errorSpan.textContent = message;
    }

    function clearError(inputId, msgId) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(msgId);
        if (input) input.classList.remove('error');
        if (errorSpan) errorSpan.textContent = '';
    }

    function validateField(inputId, msgId, validator) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(msgId);
        const value = input.value.trim();

        if (!value) {
            showError(inputId, msgId, 'This field is required.');
            return false;
        }

        if (validator(value)) {
            clearError(inputId, msgId);
            return true;
        } else {
            showError(inputId, msgId, 'Invalid format.');
            return false;
        }
    }

    // --- Validation Rules ---
    const validators = {
        student_id: (val) => /^[A-Z0-9]{6,15}$/.test(val),
        name: (val) => val.length >= 2,
        gender: (val) => val !== '',
        dob: (val) => {
            if (!val) return false;
            const date = new Date(val);
            return !isNaN(date.getTime());
        },
        class: (val) => val !== '',
        village: (val) => val.length >= 3,
        parent_name: (val) => val.length >= 2,
        parent_occupation: (val) => val.length >= 2,
        aadhaar_number: (val) => /^\d{12}$/.test(val),
        phone_number: (val) => /^\d{10}$/.test(val),
        enrolment_date: (val) => {
            if (!val) return false;
            const date = new Date(val);
            return !isNaN(date.getTime());
        }
    };

    // --- Event Listeners ---
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        let isValid = true;

        // Validate all fields
        const fields = [
            'student_id', 'name', 'gender', 'dob', 'class', 'village',
            'parent_name', 'parent_occupation', 'aadhaar_number', 'phone_number', 'enrolment_date'
        ];

        fields.forEach(field => {
            if (!validateField(field, 'err_' + field, validators[field])) {
                isValid = false;
            }
        });

        if (isValid) {
            // Generate S.No
            const currentCount = window.data.length;
            const nextSNo = currentCount + 1;
            sNoInput.value = nextSNo;

            // Create Object
            const newEntry = {
                s_no: nextSNo,
                student_id: document.getElementById('student_id').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                class: document.getElementById('class').value,
                village: document.getElementById('village').value,
                parent_name: document.getElementById('parent_name').value,
                parent_occupation: document.getElementById('parent_occupation').value,
                aadhaar_number: document.getElementById('aadhaar_number').value,
                phone_number: document.getElementById('phone_number').value,
                enrolment_date: document.getElementById('enrolment_date').value
            };

            // Add to data
            window.data.push(newEntry);

            // Show Success
            successMsg.textContent = `Enrolment successful! S.No: ${nextSNo}`;
            successMsg.style.display = 'block';
            
            // Reset Form
            form.reset();
            sNoInput.value = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            // Simulate processing delay then reset button
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Enrolment';
                successMsg.style.display = 'none';
            }, 1500);
        }
    });

    // --- Input Formatting ---
    // Format Aadhaar on input
    document.getElementById('aadhaar_number').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 12) value = value.slice(0, 12);
        e.target.value = value;
    });

    // Format Phone on input
    document.getElementById('phone_number').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 10) value = value.slice(0, 10);
        e.target.value = value;
    });

    // Set default enrolment date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('enrolment_date').value = today;

</script>

</body></html>
