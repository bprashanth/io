<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Health Camp - 14 September</title>
<style>
  :root {
    --primary: #006666;
    --primary-dark: #004c4c;
    --accent: #e07a5f;
    --bg: #f7f9fa;
    --card-bg: #ffffff;
    --text-main: #2d3748;
    --text-muted: #718096;
    --border: #e2e8f0;
    --success: #38a169;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
    padding: 24px 16px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    background: var(--card-bg);
    padding: 32px 24px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  .ngo-badge {
    display: inline-block;
    background: #e6f4f1;
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 16px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  h1 {
    font-size: 2rem;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .event-details {
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  /* Countdown */
  .countdown-container {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .timer-card {
    background: #edf2f7;
    border-radius: 8px;
    padding: 12px 18px;
    min-width: 80px;
  }

  .timer-card .number {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary-dark);
    display: block;
  }

  .timer-card .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* Grid Layout */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  @media (min-width: 768px) {
    .content-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 24px;
  }

  h2 {
    font-size: 1.3rem;
    margin-bottom: 16px;
    color: var(--primary);
    border-bottom: 2px solid #edf2f7;
    padding-bottom: 8px;
  }

  /* Form Styles */
  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    background-color: #fff;
  }

  input:focus, select:focus {
    outline: 2px solid var(--primary);
    border-color: transparent;
  }

  button.submit-btn {
    width: 100%;
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  button.submit-btn:hover {
    background-color: var(--primary-dark);
  }

  /* Attendee List */
  .attendee-count {
    margin-bottom: 16px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .attendee-list {
    list-style: none;
    max-height: 380px;
    overflow-y: auto;
  }

  .attendee-item {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .attendee-item:last-child {
    border-bottom: none;
  }

  .attendee-name {
    font-weight: 600;
  }

  .attendee-service {
    font-size: 0.85rem;
    background: #edf2f7;
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--text-muted);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 24px;
    font-style: italic;
  }

  .message {
    padding: 10px;
    margin-bottom: 16px;
    border-radius: 6px;
    display: none;
  }
  .message.success {
    background-color: #def7ec;
    color: #03543f;
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="ngo-badge">Free Community Outreach</div>
    <h1>Annual Health Camp</h1>
    <div class="event-details">Saturday, 14 September | 9:00 AM – 4:00 PM | Community Centre</div>
    
    <div class="countdown-container" id="countdown">
      <div class="timer-card">
        <span class="number" id="days">0</span>
        <span class="label">Days</span>
      </div>
      <div class="timer-card">
        <span class="number" id="hours">0</span>
        <span class="label">Hours</span>
      </div>
      <div class="timer-card">
        <span class="number" id="minutes">0</span>
        <span class="label">Minutes</span>
      </div>
      <div class="timer-card">
        <span class="number" id="seconds">0</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </header>

  <div class="content-grid">
    <!-- Signup Form -->
    <div class="card">
      <h2>Register for the Camp</h2>
      <div id="statusMessage" class="message"></div>
      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="e.g. Jane Doe">
        </div>
        <div class="form-group">
          <label for="contact">Phone Number or Email</label>
          <input type="text" id="contact" required placeholder="e.g. 555-0199 or name@example.com">
        </div>
        <div class="form-group">
          <label for="service">Primary Service Needed</label>
          <select id="service" required>
            <option value="General Checkup">General Health Checkup</option>
            <option value="Dental Screening">Dental Screening</option>
            <option value="Eye Examination">Eye Examination</option>
            <option value="Blood Tests">Basic Blood Tests</option>
            <option value="Nutrition Advice">Nutrition Advice</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">Complete Signup</button>
      </form>
    </div>

    <!-- Registered List -->
    <div class="card">
      <h2>Registered Participants</h2>
      <div class="attendee-count" id="attendeeCount">Total signed up: 0</div>
      <ul class="attendee-list" id="attendeeList">
        <!-- Rendered via JS -->
      </ul>
    </div>
  </div>
</div>

<script>
  // Initial Data Handling (supports runtime window.data if provided)
  let attendees = [];
  if (window.data && Array.isArray(window.data.attendees)) {
    attendees = [...window.data.attendees];
  } else {
    attendees = [
      { name: "Sarah Jenkins", service: "General Checkup" },
      { name: "Robert Taylor", service: "Eye Examination" },
      { name: "Maria Garcia", service: "Dental Screening" }
    ];
  }

  // DOM Elements
  const listEl = document.getElementById("attendeeList");
  const countEl = document.getElementById("attendeeCount");
  const formEl = document.getElementById("signupForm");
  const msgEl = document.getElementById("statusMessage");

  // Render List
  function renderList() {
    listEl.innerHTML = "";
    countEl.textContent = "Total signed up: " + attendees.length;

    if (attendees.length === 0) {
      listEl.innerHTML = '<li class="empty-state">No signups yet. Be the first to register!</li>';
      return;
    }

    attendees.slice().reverse().forEach(function(person) {
      const li = document.createElement("li");
      li.className = "attendee-item";
      
      const nameSpan = document.createElement("span");
      nameSpan.className = "attendee-name";
      nameSpan.textContent = person.name;

      const serviceSpan = document.createElement("span");
      serviceSpan.className = "attendee-service";
      serviceSpan.textContent = person.service;

      li.appendChild(nameSpan);
      li.appendChild(serviceSpan);
      listEl.appendChild(li);
    });
  }

  // Handle Form Submission
  formEl.addEventListener("submit", function(e) {
    e.preventDefault();
    const nameInput = document.getElementById("fullName");
    const serviceInput = document.getElementById("service");

    const newAttendee = {
      name: nameInput.value.trim(),
      service: serviceInput.value
    };

    if (newAttendee.name) {
      attendees.push(newAttendee);
      renderList();
      formEl.reset();

      msgEl.textContent = "Thank you, " + newAttendee.name + "! You are registered.";
      msgEl.className = "message success";
      setTimeout(function() {
        msgEl.style.display = "none";
      }, 4000);
    }
  });

  // Countdown Logic (Target: 14 September of current or upcoming year)
  function getNextTargetDate() {
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 8, 14, 9, 0, 0); // Sept is month 8 (0-indexed)

    if (now > target) {
      target = new Date(year + 1, 8, 14, 9, 0, 0);
    }
    return target;
  }

  const targetDate = getNextTargetDate().getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const difference = targetDate - now;

    if (difference <= 0) {
      document.getElementById("countdown").innerHTML = "<strong>The health camp is happening now!</strong>";
      return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();
  renderList();
</script>
</body>
</html>
