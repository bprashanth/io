<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship Progress</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Scholarship Progress","short_name":"Scholarship","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Scholarship Progress</h1></header>
<main>
<!-- YOUR MARKUP HERE -->
<div class="grid">
  <div class="card">
    <label>Total Applications</label>
    <div id="total-apps" class="muted">Loading...</div>
  </div>
  <div class="card">
    <label>Approved</label>
    <div id="approved-count" class="muted">Loading...</div>
  </div>
  <div class="card">
    <label>Pending</label>
    <div id="pending-count" class="muted">Loading...</div>
  </div>
  <div class="card">
    <label>Rejected</label>
    <div id="rejected-count" class="muted">Loading...</div>
  </div>
</div>

<div class="card">
  <div class="row">
    <label for="district-filter">Filter by District</label>
    <select id="district-filter">
      <option value="">All Districts</option>
    </select>
  </div>
  <div class="row" style="margin-top:12px">
    <label for="scheme-filter">Filter by Scheme</label>
    <select id="scheme-filter">
      <option value="">All Schemes</option>
    </select>
  </div>
  <div class="row" style="margin-top:12px">
    <label for="status-filter">Filter by Status</label>
    <select id="status-filter">
      <option value="">All Statuses</option>
      <option value="Approved">Approved</option>
      <option value="Pending">Pending</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
    <label>District Summary</label>
    <div>
      <button class="secondary" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>
  <div id="district-table">
    <table>
      <thead>
        <tr>
          <th>District</th>
          <th>Taluka</th>
          <th>Scheme</th>
          <th>Applicants</th>
          <th>Approved</th>
          <th>Pending</th>
          <th>Rejected</th>
          <th>Avg Marks</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();
// YOUR CODE HERE
const data = window.data || [];

// Aggregation Logic
const stats = { total: 0, approved: 0, pending: 0, rejected: 0 };
const districtMap = new Map();

data.forEach(row => {
  stats.total++;
  if (row.Status === 'Approved') stats.approved++;
  if (row.Status === 'Pending') stats.pending++;
  if (row.Status === 'Rejected') stats.rejected++;

  const key = `${row.District}|${row.Taluka}`;
  if (!districtMap.has(key)) {
    districtMap.set(key, {
      district: row.District,
      taluka: row.Taluka,
      scheme: row['Name of scheme'],
      applicants: 0,
      approved: 0,
      pending: 0,
      rejected: 0,
      totalMarks: 0
    });
  }
  const entry = districtMap.get(key);
  entry.applicants++;
  if (row.Status === 'Approved') entry.approved++;
  if (row.Status === 'Pending') entry.pending++;
  if (row.Status === 'Rejected') entry.rejected++;
  entry.totalMarks += parseFloat(row['Marks %']) || 0;
});

// Populate Filters
const districts = Array.from(new Set(data.map(d => d.District))).sort();
const schemes = Array.from(new Set(data.map(d => d['Name of scheme']))).sort();

const districtSelect = document.getElementById('district-filter');
districts.forEach(d => {
  const opt = document.createElement('option');
  opt.value = d;
  opt.textContent = d;
  districtSelect.appendChild(opt);
});

const schemeSelect = document.getElementById('scheme-filter');
schemes.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  schemeSelect.appendChild(opt);
});

// Render Stats
document.getElementById('total-apps').textContent = stats.total;
document.getElementById('approved-count').textContent = stats.approved;
document.getElementById('pending-count').textContent = stats.pending;
document.getElementById('rejected-count').textContent = stats.rejected;

// Render Table
const tbody = document.getElementById('table-body');
const rows = Array.from(districtMap.values());
rows.sort((a, b) => a.district.localeCompare(b.district));

rows.forEach(r => {
  const tr = document.createElement('tr');
  const avg = r.applicants > 0 ? (r.totalMarks / r.applicants).toFixed(1) : '0.0';
  tr.innerHTML = `
    <td>${r.district}</td>
    <td>${r.taluka}</td>
    <td>${r.scheme}</td>
    <td>${r.applicants}</td>
    <td>${r.approved}</td>
    <td>${r.pending}</td>
    <td>${r.rejected}</td>
    <td>${avg}</td>
  `;
  tbody.appendChild(tr);
});

// Filter Logic
function renderTable() {
  const dFilter = document.getElementById('district-filter').value;
  const sFilter = document.getElementById('scheme-filter').value;
  const stFilter = document.getElementById('status-filter').value;

  const filtered = rows.filter(r => {
    const matchDist = !dFilter || r.district === dFilter;
    const matchScheme = !sFilter || r.scheme === sFilter;
    const matchStatus = !stFilter || (stFilter === 'Approved' && r.approved > 0) || (stFilter === 'Pending' && r.pending > 0) || (stFilter === 'Rejected' && r.rejected > 0);
    return matchDist && matchScheme && matchStatus;
  });

  tbody.innerHTML = '';
  filtered.forEach(r => {
    const tr = document.createElement('tr');
    const avg = r.applicants > 0 ? (r.totalMarks / r.applicants).toFixed(1) : '0.0';
    tr.innerHTML = `
      <td>${r.district}</td>
      <td>${r.taluka}</td>
      <td>${r.scheme}</td>
      <td>${r.applicants}</td>
      <td>${r.approved}</td>
      <td>${r.pending}</td>
      <td>${r.rejected}</td>
      <td>${avg}</td>
    `;
    tbody.appendChild(tr);
  });
}

// Event Listeners
document.getElementById('district-filter').addEventListener('change', renderTable);
document.getElementById('scheme-filter').addEventListener('change', renderTable);
document.getElementById('status-filter').addEventListener('change', renderTable);

// Export
function exportCSV() {
  const dFilter = document.getElementById('district-filter').value;
  const sFilter = document.getElementById('scheme-filter').value;
  const stFilter = document.getElementById('status-filter').value;

  const filtered = rows.filter(r => {
    const matchDist = !dFilter || r.district === dFilter;
    const matchScheme = !sFilter || r.scheme === sFilter;
    const matchStatus = !stFilter || (stFilter === 'Approved' && r.approved > 0) || (stFilter === 'Pending' && r.pending > 0) || (stFilter === 'Rejected' && r.rejected > 0);
    return matchDist && matchScheme && matchStatus;
  });

  const csv = toCSV(filtered);
  download('scholarship_progress.csv', csv, 'text/csv');
}
</script>
</body></html>
