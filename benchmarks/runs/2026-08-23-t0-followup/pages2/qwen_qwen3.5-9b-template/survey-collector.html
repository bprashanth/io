<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATER POINT SURVEY</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"WATER POINT SURVEY","short_name":"WATER SURVEY","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>WATER POINT SURVEY</h1></header>
<main>
<!-- YOUR MARKUP HERE -->
<div class="card">
  <form id="surveyForm">
    <div class="row">
      <div>
        <label for="location">Location / Village</label>
        <input type="text" id="location" name="location" required placeholder="e.g. North District">
      </div>
      <div>
        <label for="gps">GPS Coordinates</label>
        <input type="text" id="gps" name="gps" readonly placeholder="Auto-capturing...">
      </div>
    </div>
    
    <div class="row">
      <div>
        <label for="pumpType">Pump Type</label>
        <select id="pumpType" name="pumpType" required>
          <option value="">Select Type</option>
          <option value="hand">Hand Pump</option>
          <option value="truck">Truck / Tanker</option>
          <option value="borehole">Borehole</option>
          <option value="river">River / Well</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div>
        <label for="status">Working Status</label>
        <select id="status" name="status" required>
          <option value="">Select Status</option>
          <option value="yes">Yes, Working</option>
          <option value="no">No, Broken</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="users">Daily Users (Est.)</label>
        <input type="number" id="users" name="users" min="0" placeholder="0">
      </div>
      <div>
        <label for="notes">Notes / Observations</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Water quality, maintenance needs..."></textarea>
      </div>
    </div>

    <div class="row" style="margin-top: 20px;">
      <button type="submit">Save Response</button>
      <button type="button" class="secondary" id="exportBtn">Export JSON</button>
    </div>
  </form>
</div>

<div id="resultsArea" class="card" style="display:none;">
  <h3>Survey Responses</h3>
  <div id="resultsList"></div>
  <button id="clearBtn" class="secondary" style="margin-top:10px;">Clear All Data</button>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();
// YOUR CODE HERE
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('surveyForm');
  const gpsInput = document.getElementById('gps');
  const resultsArea = document.getElementById('resultsArea');
  const resultsList = document.getElementById('resultsList');
  const exportBtn = document.getElementById('exportBtn');
  const clearBtn = document.getElementById('clearBtn');

  // 1. Capture GPS
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lon = pos.coords.longitude.toFixed(6);
        gpsInput.value = `${lat}, ${lon}`;
      },
      (err) => {
        console.warn("GPS access denied or failed:", err);
        gpsInput.value = "GPS Unavailable";
      }
    );
  } else {
    gpsInput.value = "GPS Not Supported";
  }

  // 2. Load Data
  const responses = store.get('water_survey_responses', []);
  renderResults();

  // 3. Handle Form Submit
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const newResponse = {
      id: Date.now(),
      timestamp: new Date().toISOString(),
      location: document.getElementById('location').value,
      gps: gpsInput.value,
      pumpType: document.getElementById('pumpType').value,
      status: document.getElementById('status').value,
      users: document.getElementById('users').value,
      notes: document.getElementById('notes').value
    };

    responses.push(newResponse);
    store.set('water_survey_responses', responses);
    
    renderResults();
    form.reset();
    gpsInput.value = "Auto-capturing...";
    alert('Response saved successfully!');
  });

  // 4. Render Results
  function renderResults() {
    if (responses.length === 0) {
      resultsArea.style.display = 'none';
      return;
    }
    resultsArea.style.display = 'block';
    resultsList.innerHTML = responses.map(r => `
      <div style="border-bottom:1px solid var(--line); padding:8px 0;">
        <strong>${r.location}</strong> (${r.pumpType})<br>
        <span class="muted">${new Date(r.timestamp).toLocaleString()}</span><br>
        Status: <strong>${r.status === 'yes' ? 'Working' : r.status === 'no' ? 'Broken' : 'Unknown'}</strong><br>
        Users: ${r.users || '-'} | GPS: ${r.gps}
      </div>
    `).join('');
  }

  // 5. Export JSON
  exportBtn.addEventListener('click', () => {
    const dataStr = JSON.stringify(responses, null, 2);
    download('water_survey_data.json', dataStr, 'application/json');
  });

  // 6. Clear Data
  clearBtn.addEventListener('click', () => {
    if (confirm('Are you sure you want to delete all saved responses?')) {
      store.set('water_survey_responses', []);
      renderResults();
    }
  });
});
</script>
</body></html>
