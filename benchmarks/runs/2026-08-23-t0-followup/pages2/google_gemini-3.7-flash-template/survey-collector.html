<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Point Survey</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Water Point Survey","short_name":"WaterSurvey","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Water Point Survey</h1></header>
<main>
  <form id="surveyForm" class="card">
    <h2 style="margin-top:0;font-size:18px;">New Water Point Record</h2>
    
    <label for="habitation">Habitation / Village Name *</label>
    <input type="text" id="habitation" name="habitation" required placeholder="e.g. Rampur Sector 4">

    <div class="grid">
      <div>
        <label for="pumpType">Pump / Source Type *</label>
        <select id="pumpType" name="pumpType" required>
          <option value="">Select type...</option>
          <option value="India Mark II Handpump">India Mark II Handpump</option>
          <option value="Solar Submersible">Solar Submersible</option>
          <option value="Electric Borewell">Electric Borewell</option>
          <option value="Treadle Pump">Treadle Pump</option>
          <option value="Gravity Fed Tapstand">Gravity Fed Tapstand</option>
          <option value="Open Well with Pulley">Open Well with Pulley</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label for="isWorking">Functional Status *</label>
        <select id="isWorking" name="isWorking" required>
          <option value="Yes">Yes - Fully Functional</option>
          <option value="Partial">Partially Functional</option>
          <option value="No">No - Non-functional / Broken</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="userCount">Estimated Dependent Users (Households/Persons) *</label>
        <input type="number" id="userCount" name="userCount" min="0" required placeholder="e.g. 150">
      </div>
      <div>
        <label>GPS Coordinates</label>
        <div class="row" style="margin-top: 2px;">
          <input type="text" id="gps" name="gps" placeholder="Latitude, Longitude" readonly style="flex:1;min-width:120px;">
          <button type="button" id="btnGps" class="secondary" style="white-space:nowrap;">Get GPS</button>
        </div>
        <div id="gpsStatus" class="muted" style="font-size:12px;margin-top:4px;"></div>
      </div>
    </div>

    <label for="notes">Surveyor Notes / Condition Remarks</label>
    <textarea id="notes" name="notes" rows="2" placeholder="e.g. Broken handle, water turbid, needs valve replacement..."></textarea>

    <div style="margin-top:16px;">
      <button type="submit" style="width:100%;">Save Response Offline</button>
    </div>
  </form>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="margin:0;font-size:18px;">Saved Responses (<span id="recordCount">0</span>)</h2>
      <div class="row">
        <button type="button" id="btnExportJSON" class="secondary">Export JSON</button>
        <button type="button" id="btnExportCSV" class="secondary">Export CSV</button>
        <button type="button" id="btnClear" class="secondary" style="color:#dc2626;border-color:#dc2626;">Clear</button>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Date/Time</th>
            <th>Habitation</th>
            <th>Pump Type</th>
            <th>Working</th>
            <th>Users</th>
            <th>GPS</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="surveyTableBody">
          <tr><td colspan="7" class="muted" style="text-align:center;">No records stored offline yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();

const STORAGE_KEY = 'water_point_surveys';
const form = document.getElementById('surveyForm');
const gpsInput = document.getElementById('gps');
const gpsStatus = document.getElementById('gpsStatus');
const btnGps = document.getElementById('btnGps');
const tableBody = document.getElementById('surveyTableBody');
const recordCount = document.getElementById('recordCount');
const btnExportJSON = document.getElementById('btnExportJSON');
const btnExportCSV = document.getElementById('btnExportCSV');
const btnClear = document.getElementById('btnClear');

btnGps.addEventListener('click', () => {
  if (!navigator.geolocation) {
    gpsStatus.textContent = 'Geolocation not supported by device.';
    return;
  }
  gpsStatus.textContent = 'Acquiring GPS location...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      const acc = pos.coords.accuracy ? ` (±${Math.round(pos.coords.accuracy)}m)` : '';
      gpsInput.value = `${lat}, ${lng}`;
      gpsStatus.textContent = `Acquired accuracy: ±${Math.round(pos.coords.accuracy || 0)}m`;
    },
    err => {
      gpsStatus.textContent = `GPS error: ${err.message}`;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
});

function renderRecords() {
  const records = store.get(STORAGE_KEY, []);
  recordCount.textContent = records.length;
  if (!records.length) {
    tableBody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;">No records stored offline yet.</td></tr>';
    return;
  }
  tableBody.innerHTML = records.map(r => `
    <tr>
      <td>${r.timestamp || ''}</td>
      <td>${r.habitation || ''}</td>
      <td>${r.pumpType || ''}</td>
      <td>${r.isWorking || ''}</td>
      <td>${r.userCount ?? ''}</td>
      <td class="muted">${r.gps || 'N/A'}</td>
      <td>${r.notes || ''}</td>
    </tr>
  `).reverse().join('');
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const record = {
    id: Date.now(),
    timestamp: new Date().toLocaleString(),
    habitation: form.habitation.value.trim(),
    pumpType: form.pumpType.value,
    isWorking: form.isWorking.value,
    userCount: Number(form.userCount.value),
    gps: form.gps.value.trim(),
    notes: form.notes.value.trim()
  };

  const currentRecords = store.get(STORAGE_KEY, []);
  currentRecords.push(record);
  store.set(STORAGE_KEY, currentRecords);

  form.reset();
  gpsStatus.textContent = '';
  renderRecords();
});

btnExportJSON.addEventListener('click', () => {
  const data = store.get(STORAGE_KEY, []);
  if (!data.length) {
    alert('No data available to export.');
    return;
  }
  download(`water_points_${Date.now()}.json`, JSON.stringify(data, null, 2), 'application/json');
});

btnExportCSV.addEventListener('click', () => {
  const data = store.get(STORAGE_KEY, []);
  if (!data.length) {
    alert('No data available to export.');
    return;
  }
  download(`water_points_${Date.now()}.csv`, toCSV(data), 'text/csv');
});

btnClear.addEventListener('click', () => {
  const data = store.get(STORAGE_KEY, []);
  if (!data.length) return;
  if (confirm('Are you sure you want to delete all saved records?')) {
    store.set(STORAGE_KEY, []);
    renderRecords();
  }
});

renderRecords();
</script>
</body></html>
