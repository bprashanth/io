<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuition Attendance Tracker</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Tuition Attendance Tracker","short_name":"Attendance","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tab-nav{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab-nav button{background:none;border:none;color:var(--muted);padding:8px}
.tab-nav button.active{color:var(--accent);font-weight:bold;border-bottom:2px solid var(--accent);border-radius:0}
.status-toggle{display:flex;align-items:center;gap:8px}
.status-btn{padding:4px 8px;font-size:12px;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer}
.status-btn.present{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.status-btn.absent{background:#fee2e2;color:#991b1b;border-color:#fecaca}
</style></head><body>
<header><h1 id="view-title">Attendance</h1></header>
<main>
<nav class="tab-nav">
<button onclick="showView('daily')" id="tab-daily" class="active">Daily Mark</button>
<button onclick="showView('setup')" id="tab-setup">Setup Kids</button>
<button onclick="showView('reports')" id="tab-reports">Reports</button>
</nav>

<div id="view-daily">
<div class="card">
<div class="row">
<div style="flex:1">
<label>Date</label>
<input type="date" id="attendance-date">
</div>
<div style="flex:1; display:flex; align-items:flex-end;">
<button onclick="saveDailyAttendance()" style="width:100%">Save Attendance</button>
</div>
</div>
</div>
<div id="attendance-list" class="card">
<!-- List of kids with toggles -->
</div>
</div>

<div id="view-setup" style="display:none">
<div class="card">
<h3>Manage Students</h3>
<p class="muted">Add or remove students. Total: <span id="student-count">0</span></p>
<div class="row">
<input type="text" id="new-student-name" placeholder="Student Name">
<button onclick="addStudent()">Add</button>
</div>
<div style="margin-top:20px">
<table id="student-table">
<thead><tr><th>Name</th><th>Action</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>

<div id="view-reports" style="display:none">
<div class="card">
<h3>Monthly Summary</h3>
<div class="row">
<div style="flex:1">
<label>Month</label>
<input type="month" id="report-month">
</div>
<div style="flex:1; display:flex; align-items:flex-end;">
<button class="secondary" onclick="generateReport()">View Report</button>
</div>
</div>
</div>
<div id="report-output" class="card" style="display:none">
<table id="report-table">
<thead><tr><th>Name</th><th>Days Present</th><th>%</th></tr></thead>
<tbody></tbody>
</table>
<div style="margin-top:15px" class="row">
<button onclick="exportReportCSV()">Export CSV</button>
</div>
</div>
</div>
</main>
<script>
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();

let students = store.get('tuition_students', []);
let attendance = store.get('tuition_attendance', {}); // Format: { "YYYY-MM-DD": { "Name": "P"|"A" } }

const dateInput = document.getElementById('attendance-date');
const today = new Date().toISOString().split('T')[0];
dateInput.value = today;
dateInput.addEventListener('change', renderDailyList);

function showView(view) {
    ['daily', 'setup', 'reports'].forEach(v => {
        document.getElementById('view-' + v).style.display = (v === view) ? 'block' : 'none';
        document.getElementById('tab-' + v).classList.toggle('active', v === view);
    });
    if(view === 'daily') renderDailyList();
    if(view === 'setup') renderStudentList();
}

function addStudent() {
    const name = document.getElementById('new-student-name').value.trim();
    if (name && students.length < 100) {
        students.push(name);
        store.set('tuition_students', students);
        document.getElementById('new-student-name').value = '';
        renderStudentList();
    }
}

function removeStudent(index) {
    if(confirm('Remove this student?')) {
        students.splice(index, 1);
        store.set('tuition_students', students);
        renderStudentList();
    }
}

function renderStudentList() {
    const tbody = document.querySelector('#student-table tbody');
    document.getElementById('student-count').innerText = students.length;
    tbody.innerHTML = '';
    students.forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${s}</td><td><button class="secondary" onclick="removeStudent(${i})">Delete</button></td>`;
        tbody.appendChild(tr);
    });
}

function renderDailyList() {
    const container = document.getElementById('attendance-list');
    const date = dateInput.value;
    const dayData = attendance[date] || {};
    
    if (students.length === 0) {
        container.innerHTML = '<p class="muted">No students added. Go to Setup.</p>';
        return;
    }

    container.innerHTML = '';
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Student</th><th>Status</th></tr></thead>';
    const tbody = document.createElement('tbody');

    students.forEach(name => {
        const status = dayData[name] || 'A'; // Default to Absent
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${name}</td>
            <td>
                <div class="status-toggle">
                    <button class="status-btn ${status === 'P' ? 'present' : ''}" onclick="toggleStatus('${name}', 'P')">P</button>
                    <button class="status-btn ${status === 'A' ? 'absent' : ''}" onclick="toggleStatus('${name}', 'A')">A</button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    container.appendChild(table);
}

function toggleStatus(name, status) {
    const date = dateInput.value;
    if (!attendance[date]) attendance[date] = {};
    attendance[date][name] = status;
    renderDailyList();
}

function saveDailyAttendance() {
    const date = dateInput.value;
    if (!attendance[date]) attendance[date] = {};
    // Ensure all students are represented in the object for this date
    students.forEach(s => {
        if (attendance[date][s] === undefined) attendance[date][s] = 'A';
    });
    store.set('tuition_attendance', attendance);
    alert('Attendance saved for ' + date);
}

let currentReportData = [];

function generateReport() {
    const month = document.getElementById('report-month').value; // YYYY-MM
    if (!month) return;
    
    const tbody = document.querySelector('#report-table tbody');
    tbody.innerHTML = '';
    currentReportData = [];

    const daysInMonth = new Date(month + '-01').getDays(); // This is wrong logic, let's fix
    // Correct way to get days in month:
    const [y, m] = month.split('-').map(Number);
    const lastDay = new Date(y, m, 0).getDate();

    students.forEach(name => {
        let presentCount = 0;
        let totalDays = 0;

        for (let d = 1; d <= lastDay; d++) {
            const dateStr = `${month}-${String(d).padStart(2, '0')}`;
            if (attendance[dateStr]) {
                totalDays++;
                if (attendance[dateStr][name] === 'P') presentCount++;
            }
        }

        const percent = totalDays > 0 ? Math.round((presentCount / totalDays) * 100) : 0;
        currentReportData.push({ Name: name, Present: presentCount, Percentage: percent + '%' });

        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${name}</td><td>${presentCount}</td><td>${percent}%</td>`;
        tbody.appendChild(tr);
    });

    document.getElementById('report-output').style.display = 'block';
}

function exportReportCSV() {
    if (currentReportData.length === 0) return;
    const csv = toCSV(currentReportData);
    download(`attendance_report_${document.getElementById('report-month').value}.csv`, csv, 'text/csv');
}

// Init
renderDailyList();
</script>
</body></html>
