<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width-width,initial-scale=1"><title>Health Camp Signup</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Health Camp Signup","short_name":"Health Camp","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
#countdown { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
</style></head><body>
<header><h1 id="header-title">Health Camp Signup</h1></header>
<main>
    <div class="card">
        <h2>Community Health Camp</h2>
        <p>Join us for our upcoming health screening and consultation camp.</p>
        <div id="countdown">Loading countdown...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Register for the Event</h3>
            <form id="signupForm">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required>
                
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
                
                <label for="service">Preferred Service</label>
                <select id="service">
                    <option value="General Checkup">General Checkup</option>
                    <option value="Dental">Dental</option>
                    <option value="Eye Exam">Eye Exam</option>
                    <option value="Vaccination">Vaccination</option>
                </select>

                <button type="submit" style="margin-top:15px; width:100%">Confirm Registration</button>
            </form>
        </div>

        <div class="card">
            <h3>Attendees</h3>
            <div style="overflow-x:auto;">
                <table id="attendeeTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Service</th>
                        </tr>
                    </thead>
                    <tbody id="attendeeList">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
            <div class="row" style="margin-top:15px">
                <button class="secondary" id="exportBtn">Export CSV</button>
                <button class="secondary" id="clearBtn" style="color:#dc2626; border-color:#dc2626">Clear List</button>
            </div>
        </div>
    </div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k))?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null? '' : String(v); return /[",\n]/.test(s)? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();

// YOUR CODE HERE
const STORAGE_KEY = 'health_camp_signups';
const TARGET_DATE = new Date('2024-09-14T09:00:00').getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = TARGET_DATE - now;
    const el = document.getElementById('countdown');
    
    if (distance < 0) {
        el.innerHTML = "Event has started!";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    el.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s remaining`;
}

function renderAttendees() {
    const attendees = store.get(STORAGE_KEY, []);
    const list = document.getElementById('attendeeList');
    list.innerHTML = '';
    
    if (attendees.length === 0) {
        list.innerHTML = '<tr><td colspan="2" class="muted">No signups yet</td></tr>';
        return;
    }

    attendees.forEach(person => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${person.name}</td><td>${person.service}</td>`;
        list.appendChild(row);
    });
}

document.getElementById('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const service = document.getElementById('service').value;

    const attendees = store.get(STORAGE_KEY, []);
    attendees.push({ name, email, service, timestamp: new Date().toISOString() });
    store.set(STORAGE_KEY, attendees);
    
    e.target.reset();
    renderAttendees();
});

document.getElementById('exportBtn').addEventListener('click', () => {
    const attendees = store.get(STORAGE_KEY, []);
    if (attendees.length === 0) return alert('No data to export');
    download('health_camp_signups.csv', toCSV(attendees), 'text/csv');
});

document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('Are you sure you want to clear all signups?')) {
        store.set(STORAGE_KEY, []);
        renderAttendees();
    }
});

setInterval(updateCountdown, 1000);
updateCountdown();
renderAttendees();
</script>
</body></html>
