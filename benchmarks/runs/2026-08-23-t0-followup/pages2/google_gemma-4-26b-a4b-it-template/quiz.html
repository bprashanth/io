<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Washing Quiz</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Hand Washing Quiz","short_name":"Quiz","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.option-label { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: background 0.2s; }
.option-label:hover { background: #f9fafb; }
.option-label input { width: auto; }
.hidden { display: none; }
#result-area { text-align: center; padding: 40px 0; }
.score-big { font-size: 48px; font-weight: bold; color: var(--accent); }
</style></head><body>
<header><h1 id="header-title">Hand Washing Quiz</h1></header>
<main>
<div id="quiz-container">
<div id="question-card" class="card">
<p id="question-text" style="font-weight:600; font-size:18px;"></p>
<div id="options-list"></div>
</div>
<div style="display:flex; justify-content: space-between; align-items: center;">
<span id="progress-text" class="muted"></span>
<button id="next-btn">Next Question</button>
</div>
</div>

<div id="result-area" class="card hidden">
<h2>Quiz Complete!</h2>
<div class="score-big" id="final-score">0/0</div>
<p id="feedback-text"></p>
<button onclick="initQuiz()">Try Again</button>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k))?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null? '' : String(v); return /[",\n]/.test(s)? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();

// YOUR CODE HERE
const quizData = [
  { q: "How long should you wash your hands with soap?", a: ["5 seconds", "20 seconds", "1 minute", "5 minutes"], correct: 1 },
  { q: "When is the best time to wash your hands?", a: ["Before eating", "After using the bathroom", "After playing outside", "All of the above"], correct: 3 },
  { q: "Which of these helps kill germs on your hands?", a: ["Water only", "Soap and warm water", "Just a towel", "Sand"], correct: 1 },
  { q: "What should you do after washing your hands?", a: ["Wipe them on your shirt", "Dry them with a clean towel", "Leave them wet", "Shake them"], correct: 1 },
  { q: "True or False: Hand sanitizer is a replacement for soap and water.", a: ["True", "False"], correct: 1 }
];

let currentIdx = 0;
let score = 0;

const qText = document.getElementById('question-text');
const optList = document.getElementById('options-list');
const nextBtn = document.getElementById('next-btn');
const progressText = document.getElementById('progress-text');
const quizContainer = document.getElementById('quiz-container');
const resultArea = document.getElementById('result-area');
const finalScore = document.getElementById('final-score');
const feedbackText = document.getElementById('feedback-text');

function initQuiz() {
  currentIdx = 0;
  score = 0;
  quizContainer.classList.remove('hidden');
  resultArea.classList.add('hidden');
  showQuestion();
}

function showQuestion() {
  const data = quizData[currentIdx];
  qText.innerText = data.q;
  optList.innerHTML = '';
  progressText.innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
  
  data.a.forEach((opt, i) => {
    const label = document.createElement('label');
    label.className = 'option-label';
    label.innerHTML = `<input type="radio" name="quiz-opt" value="${i}"> <span>${opt}</span>`;
    optList.appendChild(label);
  });

  nextBtn.innerText = currentIdx === quizData.length - 1? "See Results" : "Next Question";
}

nextBtn.addEventListener('click', () => {
  const selected = document.querySelector('input[name="quiz-opt"]:checked');
  if (!selected) {
    alert("Please select an answer!");
    return;
  }

  if (parseInt(selected.value) === quizData[currentIdx].correct) {
    score++;
  }

  currentIdx++;
  if (currentIdx < quizData.length) {
    showQuestion();
  } else {
    showResults();
  }
});

function showResults() {
  quizContainer.classList.add('hidden');
  resultArea.classList.remove('hidden');
  finalScore.innerText = `${score} / ${quizData.length}`;
  
  if (score === quizData.length) {
    feedbackText.innerText = "Perfect! You are a Hand Washing Hero! 🧼✨";
  } else if (score >= quizData.length / 2) {
    feedbackText.innerText = "Good job! Keep practicing to be a pro! 👍";
  } else {
    feedbackText.innerText = "Keep learning! Germs are sneaky! 🦠";
  }
}

initQuiz();
</script>
</body></html>
