<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Camp Signup</title>
<style>
    :root {
        --primary: #2e7d32;
        --primary-dark: #1b5e20;
        --bg: #f5f5f5;
        --card: #ffffff;
        --text: #333333;
        --border: #e0e0e0;
        --error: #d32f2f;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.5;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
    }
    header {
        text-align: center;
        margin-bottom: 30px;
    }
    h1 { color: var(--primary); margin-bottom: 10px; }
    .date-badge {
        display: inline-block;
        background: var(--primary);
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9rem;
    }
    .card {
        background: var(--card);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        padding: 25px;
        margin-bottom: 25px;
    }
    .section-title {
        font-size: 1.2rem;
        color: var(--primary-dark);
        border-bottom: 2px solid var(--border);
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    /* Countdown */
    .countdown-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }
    .time-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        min-width: 80px;
    }
    .time-val {
        font-size: 2rem;
        font-weight: bold;
        color: var(--primary);
        display: block;
    }
    .time-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #666;
    }
    /* Form */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 1rem;
    }
    input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.2);
    }
    button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error-msg {
        color: var(--error);
        font-size: 0.9rem;
        margin-top: 5px;
        display: none;
    }
    /* List */
    .attendee-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .attendee-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
    }
    .attendee-item:last-child { border-bottom: none; }
    .attendee-name { font-weight: 500; }
    .attendee-time { color: #666; font-size: 0.9rem; }
    .empty-state {
        text-align: center;
        color: #888;
        padding: 20px;
        font-style: italic;
    }
    .status-msg {
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
    }
    .success { color: var(--primary); }
    .fail { color: var(--error); }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Community Health Camp</h1>
        <div class="date-badge" id="eventDate">Loading Date...</div>
    </header>

    <!-- Countdown Section -->
    <div class="card">
        <div class="section-title">Time Until Event</div>
        <div class="countdown-container" id="countdown">
            <div class="time-box"><span class="time-val" id="days">00</span><span class="time-label">Days</span></div>
            <div class="time-box"><span class="time-val" id="hours">00</span><span class="time-label">Hours</span></div>
            <div class="time-box"><span class="time-val" id="minutes">00</span><span class="time-label">Mins</span></div>
            <div class="time-box"><span class="time-val" id="seconds">00</span><span class="time-label">Secs</span></div>
        </div>
    </div>

    <!-- Signup Form -->
    <div class="card">
        <div class="section-title">Register for the Camp</div>
        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="e.g. 555-0123">
            </div>
            <div class="form-group">
                <label for="service">Service Needed</label>
                <select id="service" name="service" required>
                    <option value="" disabled selected>Select a service...</option>
                    <option value="checkup">General Health Checkup</option>
                    <option value="vaccination">Vaccination</option>
                    <option value="consultation">Doctor Consultation</option>
                    <option value="blood_test">Blood Test</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Additional Notes (Optional)</label>
                <input type="text" id="notes" name="notes" placeholder="e.g. Wheelchair access needed">
            </div>
            <div id="formError" class="error-msg"></div>
            <button type="submit" id="submitBtn">Sign Up Now</button>
        </form>
    </div>

    <!-- Attendee List -->
    <div class="card">
        <div class="section-title">Current Signups</div>
        <ul class="attendee-list" id="attendeeList">
            <!-- List items injected here -->
        </ul>
        <div id="emptyState" class="empty-state">No signups yet.</div>
    </div>
</div>

<script>
    // --- Configuration & Data ---
    const EVENT_DATE = new Date("2024-09-14T09:00:00").getTime();
    
    // Initialize data from window.data if available, otherwise empty array
    let attendees = [];
    if (window.data && Array.isArray(window.data.attendees)) {
        attendees = window.data.attendees;
    }

    // --- DOM Elements ---
    const elDate = document.getElementById('eventDate');
    const elCountdown = document.getElementById('countdown');
    const elDays = document.getElementById('days');
    const elHours = document.getElementById('hours');
    const elMinutes = document.getElementById('minutes');
    const elSeconds = document.getElementById('seconds');
    const elForm = document.getElementById('signupForm');
    const elError = document.getElementById('formError');
    const elList = document.getElementById('attendeeList');
    const elEmptyState = document.getElementById('emptyState');
    const elSubmitBtn = document.getElementById('submitBtn');

    // --- Initialization ---
    function init() {
        // Format Date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        elDate.textContent = new Date(EVENT_DATE).toLocaleDateString('en-US', options);
        
        // Render initial list
        renderList();
        
        // Start Countdown
        startCountdown();
    }

    // --- Countdown Logic ---
    function startCountdown() {
        const timer = setInterval(() => {
            const now = new Date().getTime();
            const distance = EVENT_DATE - now;

            if (distance < 0) {
                clearInterval(timer);
                elCountdown.innerHTML = '<div class="time-box" style="color:var(--primary-dark); font-weight:bold;">EVENT STARTED</div>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            elDays.textContent = days < 10 ? '0' + days : days;
            elHours.textContent = hours < 10 ? '0' + hours : hours;
            elMinutes.textContent = minutes < 10 ? '0' + minutes : minutes;
            elSeconds.textContent = seconds < 10 ? '0' + seconds : seconds;
        }, 1000);
    }

    // --- Form Handling ---
    elForm.addEventListener('submit', (e) => {
        e.preventDefault();
        elError.style.display = 'none';
        elError.textContent = '';

        const btnText = elSubmitBtn.textContent;
        elSubmitBtn.disabled = true;
        elSubmitBtn.textContent = 'Processing...';

        // Simulate network delay for realism
        setTimeout(() => {
            const formData = new FormData(elForm);
            const newAttendee = {
                id: Date.now(),
                name: formData.get('fullName'),
                phone: formData.get('phone'),
                service: formData.get('service'),
                notes: formData.get('notes') || 'None',
                timestamp: new Date().toISOString()
            };

            // Update Data
            attendees.push(newAttendee);
            
            // Save back to window.data (simulating persistence)
            window.data.attendees = attendees;

            // Reset UI
            elForm.reset();
            elSubmitBtn.disabled = false;
            elSubmitBtn.textContent = btnText;
            
            // Show Success
            elError.textContent = 'You have been successfully registered!';
            elError.style.display = 'block';
            elError.className = 'error-msg success';
            
            renderList();
        }, 800);
    });

    // --- List Rendering ---
    function renderList() {
        elList.innerHTML = '';
        
        if (attendees.length === 0) {
            elEmptyState.style.display = 'block';
            return;
        }

        elEmptyState.style.display = 'none';

        // Sort by most recent first
        const sortedAttendees = [...attendees].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        sortedAttendees.forEach(person => {
            const li = document.createElement('li');
            li.className = 'attendee-item';
            
            const timeStr = new Date(person.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            li.innerHTML = `
                <span class="attendee-name">${escapeHtml(person.name)}</span>
                <span class="attendee-time">${escapeHtml(person.service)} • ${timeStr}</span>
            `;
            elList.appendChild(li);
        });
    }

    // --- Utilities ---
    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Run
    init();

</script>
</body>
</html>
