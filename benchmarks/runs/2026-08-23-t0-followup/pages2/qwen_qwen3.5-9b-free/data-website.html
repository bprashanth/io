<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Scheme Progress</title>
<style>
    :root {
        --primary: #2c3e50;
        --secondary: #3498db;
        --success: #27ae60;
        --warning: #f39c12;
        --danger: #c0392b;
        --light: #ecf0f1;
        --dark: #2c3e50;
        --border: #bdc3c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 20px; }
    h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 10px; }
    .subtitle { color: #7f8c8d; font-size: 0.95rem; }
    
    /* Dashboard Cards */
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { font-size: 0.9rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .card .value { font-size: 2rem; font-weight: bold; color: var(--primary); }
    .card .trend { font-size: 0.8rem; margin-top: 5px; }
    .trend.up { color: var(--success); }
    .trend.down { color: var(--danger); }

    /* Filters */
    .filters { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .filters label { font-weight: 600; font-size: 0.9rem; }
    .filters select, .filters input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; min-width: 150px; }
    .filters button { padding: 8px 20px; background-color: var(--secondary); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .filters button:hover { background-color: #2980b9; }

    /* Table */
    .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background-color: var(--primary); color: white; font-weight: 600; font-size: 0.9rem; }
    tr:hover { background-color: #f9f9f9; }
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
    .status-pending { background-color: #fff3cd; color: #856404; }
    .status-approved { background-color: #d4edda; color: #155724; }
    .status-rejected { background-color: #f8d7da; color: #721c24; }
    .income-low { color: var(--success); font-weight: bold; }
    .income-high { color: var(--danger); font-weight: bold; }
    .marks-high { color: var(--success); font-weight: bold; }
    .marks-med { color: var(--warning); font-weight: bold; }
    .marks-low { color: var(--danger); font-weight: bold; }

    /* Empty State */
    .empty-state { padding: 40px; text-align: center; color: #7f8c8d; display: none; }
    .empty-state.visible { display: block; }

    /* Responsive */
    @media (max-width: 768px) {
        .dashboard { grid-template-columns: 1fr 1fr; }
        .filters { flex-direction: column; align-items: stretch; }
        .filters select, .filters input { width: 100%; }
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Scholarship Scheme Progress</h1>
        <p class="subtitle">District-wise analysis of pending cases and application status</p>
    </header>

    <!-- Summary Cards -->
    <div class="dashboard" id="dashboard">
        <div class="card">
            <h3>Total Applications</h3>
            <div class="value" id="total-apps">0</div>
        </div>
        <div class="card">
            <h3>Pending Cases</h3>
            <div class="value" id="pending-count">0</div>
            <div class="trend" id="pending-rate">0% of total</div>
        </div>
        <div class="card">
            <h3>Approved</h3>
            <div class="value" id="approved-count">0</div>
        </div>
        <div class="card">
            <h3>Rejected</h3>
            <div class="value" id="rejected-count">0</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <label for="district-filter">District:</label>
        <select id="district-filter">
            <option value="all">All Districts</option>
        </select>
        
        <label for="scheme-filter">Scheme:</label>
        <select id="scheme-filter">
            <option value="all">All Schemes</option>
        </select>

        <label for="status-filter">Status:</label>
        <select id="status-filter">
            <option value="all">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
        </select>

        <button id="apply-filters">Apply Filters</button>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>District</th>
                    <th>Taluka</th>
                    <th>Scheme</th>
                    <th>Name</th>
                    <th>Marks %</th>
                    <th>Family Income</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
        <div id="empty-state" class="empty-state">
            <p>No data found matching your filters.</p>
        </div>
    </div>
</div>

<script>
    // --- Data Handling ---
    // Data is expected at window.data
    const rawData = window.data || [];

    // --- State Management ---
    let currentData = [];
    let filters = {
        district: 'all',
        scheme: 'all',
        status: 'all'
    };

    // --- DOM Elements ---
    const els = {
        totalApps: document.getElementById('total-apps'),
        pendingCount: document.getElementById('pending-count'),
        pendingRate: document.getElementById('pending-rate'),
        approvedCount: document.getElementById('approved-count'),
        rejectedCount: document.getElementById('rejected-count'),
        districtFilter: document.getElementById('district-filter'),
        schemeFilter: document.getElementById('scheme-filter'),
        statusFilter: document.getElementById('status-filter'),
        tableBody: document.getElementById('table-body'),
        emptyState: document.getElementById('empty-state'),
        applyBtn: document.getElementById('apply-filters')
    };

    // --- Initialization ---
    function init() {
        populateFilters();
        applyFilters();
    }

    // --- Populate Dropdowns ---
    function populateFilters() {
        // Districts
        const districts = [...new Set(rawData.map(item => item.District))].sort();
        districts.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            els.districtFilter.appendChild(opt);
        });

        // Schemes
        const schemes = [...new Set(rawData.map(item => item['Name of scheme']))].sort();
        schemes.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            els.schemeFilter.appendChild(opt);
        });
    }

    // --- Logic: Calculate Stats ---
    function calculateStats(data) {
        const total = data.length;
        const pending = data.filter(i => i.Status === 'Pending').length;
        const approved = data.filter(i => i.Status === 'Approved').length;
        const rejected = data.filter(i => i.Status === 'Rejected').length;

        return { total, pending, approved, rejected };
    }

    // --- Logic: Render Table ---
    function renderTable(data) {
        els.tableBody.innerHTML = '';
        els.emptyState.classList.remove('visible');

        if (data.length === 0) {
            els.emptyState.classList.add('visible');
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');

            // Status Badge Logic
            let statusClass = '';
            if (row.Status === 'Pending') statusClass = 'status-pending';
            else if (row.Status === 'Approved') statusClass = 'status-approved';
            else if (row.Status === 'Rejected') statusClass = 'status-rejected';

            // Income Logic (Assuming < 50000 is low, > 100000 is high, else medium)
            const income = parseFloat(row.Family Income);
            let incomeClass = '';
            if (income < 50000) incomeClass = 'income-low';
            else if (income > 100000) incomeClass = 'income-high';

            // Marks Logic
            const marks = parseFloat(row.Marks %);
            let marksClass = '';
            if (marks >= 80) marksClass = 'marks-high';
            else if (marks >= 50) marksClass = 'marks-med';
            else marksClass = 'marks-low';

            tr.innerHTML = `
                <td><strong>${row.District}</strong></td>
                <td>${row.Taluka}</td>
                <td>${row['Name of scheme']}</td>
                <td>${row.Name}</td>
                <td class="${marksClass}">${marks}%</td>
                <td class="${incomeClass}">${income.toLocaleString()}</td>
                <td><span class="status-badge ${statusClass}">${row.Status}</span></td>
            `;
            els.tableBody.appendChild(tr);
        });
    }

    // --- Logic: Update Dashboard ---
    function updateDashboard(stats) {
        els.totalApps.textContent = stats.total.toLocaleString();
        els.pendingCount.textContent = stats.pending.toLocaleString();
        els.approvedCount.textContent = stats.approved.toLocaleString();
        els.rejectedCount.textContent = stats.rejected.toLocaleString();

        // Calculate pending rate
        const rate = stats.total > 0 ? ((stats.pending / stats.total) * 100).toFixed(1) : 0;
        els.pendingRate.textContent = `${rate}% of total`;
    }

    // --- Main Filter Function ---
    function applyFilters() {
        // 1. Get raw values
        const d = els.districtFilter.value;
        const s = els.schemeFilter.value;
        const st = els.statusFilter.value;

        // 2. Filter Data
        currentData = rawData.filter(item => {
            const matchDistrict = filters.district === 'all' || item.District === filters.district;
            const matchScheme = filters.scheme === 'all' || item['Name of scheme'] === filters.scheme;
            const matchStatus = filters.status === 'all' || item.Status === filters.status;
            return matchDistrict && matchScheme && matchStatus;
        });

        // 3. Update UI
        updateDashboard(calculateStats(currentData));
        renderTable(currentData);
    }

    // --- Event Listeners ---
    els.districtFilter.addEventListener('change', () => { filters.district = els.districtFilter.value; applyFilters(); });
    els.schemeFilter.addEventListener('change', () => { filters.scheme = els.schemeFilter.value; applyFilters(); });
    els.statusFilter.addEventListener('change', () => { filters.status = els.statusFilter.value; applyFilters(); });
    els.applyBtn.addEventListener('click', applyFilters);

    // --- Start ---
    init();

</script>
</body>
</html>
