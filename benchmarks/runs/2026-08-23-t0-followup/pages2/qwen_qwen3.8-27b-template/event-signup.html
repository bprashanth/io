<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Camp — 14 September</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Health Camp — 14 September","short_name":"Health Camp","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Health Camp — 14 September</h1></header>
<main>
<!-- YOUR MARKUP HERE -->
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();
// YOUR CODE HERE
(function () {
  'use strict';
  var data = (typeof window.data === 'object' && window.data) ? window.data : {};
  var KEY = 'healthcamp.signups';
  var EVENT_KEY = 'healthcamp.event';
  var EVENT_TITLE = data.title || 'Community Health Camp';
  var EVENT_DATE = data.date || '2025-09-14';
  var EVENT_TIME = data.time || '09:00';
  var EVENT_LOCATION = data.location || 'Community Hall, Main Street';
  var EVENT_CAPACITY = (typeof data.capacity === 'number' && data.capacity > 0) ? data.capacity : 100;
  var EVENT_SERVICES = (Array.isArray(data.services) && data.services.length) ? data.services : ['General check-up', 'Blood pressure', 'Blood sugar', 'Vision screening', 'Nutrition advice'];

  var main = document.querySelector('main');
  main.innerHTML =
    '<section class="card">' +
      '<h2 style="margin-top:0">' + EVENT_TITLE + '</h2>' +
      '<p class="muted">' + EVENT_LOCATION + ' &middot; ' + EVENT_TIME + '</p>' +
      '<div class="grid" id="countdown"></div>' +
      '<p id="countdown-note" class="muted"></p>' +
    '</section>' +
    '<section class="card">' +
      '<h2 style="margin-top:0">Services offered</h2>' +
      '<ul id="services"></ul>' +
    '</section>' +
    '<section class="card">' +
      '<h2 style="margin-top:0">Sign up</h2>' +
      '<form id="signup-form" novalidate>' +
        '<div class="row">' +
          '<div style="flex:1 1 220px"><label for="f-name">Full name</label><input id="f-name" name="name" type="text" required autocomplete="name"></div>' +
          '<div style="flex:1 1 160px"><label for="f-age">Age</label><input id="f-age" name="age" type="number" min="0" max="120" required></div>' +
        '</div>' +
        '<div class="row">' +
          '<div style="flex:1 1 220px"><label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" required autocomplete="tel"></div>' +
          '<div style="flex:1 1 220px"><label for="f-service">Service</label><select id="f-service" name="service"></select></div>' +
        '</div>' +
        '<label for="f-notes">Notes (optional)</label><textarea id="f-notes" name="notes" rows="2"></textarea>' +
        '<div class="row" style="margin-top:12px">' +
          '<button type="submit">Sign up</button>' +
          '<button type="button" class="secondary" id="clear-form">Clear</button>' +
        '</div>' +
        '<p id="form-msg" class="muted" role="status" aria-live="polite"></p>' +
      '</form>' +
    '</section>' +
    '<section class="card">' +
      '<div class="row" style="align-items:center;justify-content:space-between">' +
        '<h2 style="margin:0">Who has signed up</h2>' +
        '<div class="row">' +
          '<button type="button" class="secondary" id="export-csv">Export CSV</button>' +
          '<button type="button" class="secondary" id="export-json">Export JSON</button>' +
        '</div>' +
      '</div>' +
      '<p id="capacity" class="muted"></p>' +
      '<div style="overflow-x:auto"><table id="signups-table"><thead><tr><th>#</th><th>Name</th><th>Age</th><th>Phone</th><th>Service</th><th>Notes</th><th></th></tr></thead><tbody></tbody></table></div>' +
      '<p id="empty" class="muted" style="display:none">No signups yet. Be the first!</p>' +
    '</section>';

  var cd = document.getElementById('countdown');
  var cdNote = document.getElementById('countdown-note');
  var servicesEl = document.getElementById('services');
  var serviceSel = document.getElementById('f-service');
  var form = document.getElementById('signup-form');
  var formMsg = document.getElementById('form-msg');
  var tbody = document.querySelector('#signups-table tbody');
  var emptyEl = document.getElementById('empty');
  var capacityEl = document.getElementById('capacity');

  var serviceList = EVENT_SERVICES.slice();
  serviceList.forEach(function (s) {
    var li = document.createElement('li'); li.textContent = s; servicesEl.appendChild(li);
    var opt = document.createElement('option'); opt.value = s; opt.textContent = s; serviceSel.appendChild(opt);
  });

  function pad(n) { return String(n).padStart(2, '0'); }
  function targetDate() {
    var p = String(EVENT_DATE).split('-');
    var y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, d = parseInt(p[2], 10);
    var t = String(EVENT_TIME || '00:00').split(':');
    var hh = parseInt(t[0], 10) || 0, mm = parseInt(t[1], 10) || 0;
    return new Date(y, m, d, hh, mm, 0, 0);
  }
  function tick() {
    var now = new Date();
    var diff = targetDate() - now;
    if (diff <= 0) {
      cd.innerHTML = '';
      cdNote.textContent = 'The health camp is now underway. See you there!';
      return;
    }
    var s = Math.floor(diff / 1000);
    var days = Math.floor(s / 86400); s -= days * 86400;
    var hrs = Math.floor(s / 3600); s -= hrs * 3600;
    var mins = Math.floor(s / 60); s -= mins * 60;
    var secs = s;
    var units = [
      { v: days, l: 'Days' }, { v: hrs, l: 'Hours' }, { v: mins, l: 'Minutes' }, { v: secs, l: 'Seconds' }
    ];
    cd.innerHTML = units.map(function (u) {
      return '<div style="text-align:center"><div style="font-size:34px;font-weight:700;color:var(--accent)">' + pad(u.v) + '</div><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em">' + u.l + '</div></div>';
    }).join('');
    cdNote.textContent = 'Counting down to ' + EVENT_TITLE + ' on ' + EVENT_DATE + ' at ' + EVENT_TIME + '.';
  }

  function getSignups() { return store.get(KEY, []); }
  function setSignups(list) { store.set(KEY, list); }

  function render() {
    var list = getSignups();
    tbody.innerHTML = '';
    list.forEach(function (r, i) {
      var tr = document.createElement('tr');
      var cells = [String(i + 1), r.name, r.age, r.phone, r.service, r.notes || ''];
      cells.forEach(function (c) {
        var td = document.createElement('td'); td.textContent = c; tr.appendChild(td);
      });
      var td = document.createElement('td');
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'secondary'; btn.textContent = 'Remove';
      btn.addEventListener('click', function () {
        var cur = getSignups();
        cur = cur.filter(function (x) { return x.id !== r.id; });
        setSignups(cur); render();
      });
      td.appendChild(btn); tr.appendChild(td);
      tbody.appendChild(tr);
    });
    emptyEl.style.display = list.length ? 'none' : 'block';
    var full = list.length >= EVENT_CAPACITY;
    capacityEl.textContent = list.length + ' of ' + EVENT_CAPACITY + ' spots filled' + (full ? ' — camp is full' : '');
    form.style.display = full ? 'none' : '';
    if (full) formMsg.textContent = 'The camp is full. Thank you for your interest.';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var list = getSignups();
    if (list.length >= EVENT_CAPACITY) { formMsg.textContent = 'The camp is full. Thank you for your interest.'; return; }
    var name = document.getElementById('f-name').value.trim();
    var age = document.getElementById('f-age').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    var service = serviceSel.value;
    var notes = document.getElementById('f-notes').value.trim();
    if (!name || !age || !phone) { formMsg.textContent = 'Please fill in name, age and phone.'; return; }
    var rec = {
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2),
      name: name, age: age, phone: phone, service: service, notes: notes,
      at: new Date().toISOString()
    };
    list.push(rec); setSignups(list);
    form.reset();
    formMsg.textContent = 'Thanks, ' + name + '! You are signed up.';
    render();
  });

  document.getElementById('clear-form').addEventListener('click', function () {
    form.reset(); formMsg.textContent = '';
  });

  document.getElementById('export-csv').addEventListener('click', function () {
    var list = getSignups();
    if (!list.length) { formMsg.textContent = 'Nothing to export yet.'; return; }
    var rows = list.map(function (r, i) { return { '#': i + 1, Name: r.name, Age: r.age, Phone: r.phone, Service: r.service, Notes: r.notes || '', SignedUp: r.at }; });
    download('health-camp-signups.csv', toCSV(rows), 'text/csv');
  });

  document.getElementById('export-json').addEventListener('click', function () {
    var list = getSignups();
    if (!list.length) { formMsg.textContent = 'Nothing to export yet.'; return; }
    download('health-camp-signups.json', JSON.stringify(list, null, 2), 'application/json');
  });

  tick();
  setInterval(tick, 1000);
  render();
})();
</script>
</body></html>
