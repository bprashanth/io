<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Point Survey</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Water Point Survey","short_name":"WaterSurvey","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Water Point Survey</h1></header>
<main>
<div class="card">
  <form id="surveyForm">
    <div class="grid">
      <div>
        <label for="habitation">Habitation / Village</label>
        <input type="text" id="habitation" name="habitation" required placeholder="Enter village name">
      </div>
      <div>
        <label for="pumpType">Pump Type</label>
        <select id="pumpType" name="pumpType">
          <option value="">Select type...</option>
          <option value="Hand Pump">Hand Pump</option>
          <option value="Deep Tube Well">Deep Tube Well</option>
          <option value="Overhead Tank">Overhead Tank</option>
          <option value="Spring">Spring</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label for="status">Working Status</label>
        <select id="status" name="status">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <div>
        <label for="users">Estimated Users</label>
        <input type="number" id="users" name="users" min="0" placeholder="0">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div style="flex:1">
        <label for="gps">GPS Location</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="gps" name="gps" readonly placeholder="Tap to get location" required>
          <button type="button" id="getLocBtn" class="secondary" style="width:auto">📍</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button type="submit">Save Response</button>
      <button type="button" id="exportBtn" class="secondary">Export JSON</button>
    </div>
  </form>
</div>

<div class="card">
  <h3 style="margin-top:0">Saved Responses</h3>
  <div id="responseList" class="muted">No responses saved yet.</div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();
// YOUR CODE HERE
const STORAGE_KEY = 'water_survey_responses';
const form = document.getElementById('surveyForm');
const gpsInput = document.getElementById('gps');
const getLocBtn = document.getElementById('getLocBtn');
const exportBtn = document.getElementById('exportBtn');
const responseList = document.getElementById('responseList');

function getResponses() {
  return store.get(STORAGE_KEY, []);
}

function saveResponse(data) {
  const responses = getResponses();
  responses.push(data);
  store.set(STORAGE_KEY, responses);
  renderList();
}

function renderList() {
  const responses = getResponses();
  if (!responses.length) {
    responseList.textContent = 'No responses saved yet.';
    return;
  }
  let html = '<table><thead><tr><th>Habitation</th><th>Type</th><th>Status</th><th>Users</th><th>GPS</th></tr></thead><tbody>';
  responses.forEach(r => {
    html += `<tr>
      <td>${escapeHtml(r.habitation)}</td>
      <td>${escapeHtml(r.pumpType)}</td>
      <td>${escapeHtml(r.status)}</td>
      <td>${escapeHtml(r.users)}</td>
      <td><a href="https://maps.google.com/?q=${r.gps}" target="_blank" rel="noopener">${escapeHtml(r.gps)}</a></td>
    </tr>`;
  });
  html += '</tbody></table>';
  responseList.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

getLocBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser.');
    return;
  }
  getLocBtn.textContent = '...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      gpsInput.value = `${pos.coords.latitude},${pos.coords.longitude}`;
      getLocBtn.textContent = '📍';
    },
    (err) => {
      alert('Unable to retrieve location. Please check permissions.');
      getLocBtn.textContent = '📍';
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const habitation = document.getElementById('habitation').value.trim();
  const pumpType = document.getElementById('pumpType').value;
  const status = document.getElementById('status').value;
  const users = document.getElementById('users').value;
  const gps = gpsInput.value.trim();

  if (!habitation || !pumpType || !gps) {
    alert('Please fill in Habitation, Pump Type, and GPS Location.');
    return;
  }

  saveResponse({
    timestamp: new Date().toISOString(),
    habitation,
    pumpType,
    status,
    users: users ? parseInt(users, 10) : null,
    gps
  });

  form.reset();
  gpsInput.value = '';
  alert('Response saved successfully!');
});

exportBtn.addEventListener('click', () => {
  const responses = getResponses();
  if (!responses.length) {
    alert('No responses to export.');
    return;
  }
  const json = JSON.stringify(responses, null, 2);
  download('water_survey_data.json', json, 'application/json');
});

renderList();
</script>
</body></html>
