<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Attendance</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Daily Attendance","short_name":"ATT","start_url":".","display":"standalone","background_color":"#f6f7fb","theme_color":"#2563eb"}'>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb;--success:#10b981;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* Attendance Specifics */
.att-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.att-row:last-child { border-bottom: none; }
.att-name { font-weight: 500; flex: 1; }
.att-controls { display: flex; gap: 8px; }
.att-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: all 0.2s; }
.att-btn.present { border-color: var(--success); color: var(--success); }
.att-btn.present.active { background: var(--success); color: #fff; }
.att-btn.absent { border-color: var(--danger); color: var(--danger); }
.att-btn.absent.active { background: var(--danger); color: #fff; }
.att-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Stats */
.stat-box { text-align: center; padding: 10px; background: #f9fafb; border-radius: 8px; }
.stat-val { font-size: 24px; font-weight: bold; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--muted); }

/* Tabs */
.tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.tab-btn { background: none; border: none; color: var(--muted); padding: 5px 10px; cursor: pointer; font-weight: 600; }
.tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
.view-section { display: none; }
.view-section.active { display: block; }
</style></head><body>
<header><h1>Daily Attendance</h1></header>
<main>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('mark')">Mark Today</button>
        <button class="tab-btn" onclick="switchTab('manage')">Manage Names</button>
        <button class="tab-btn" onclick="switchTab('summary')">Monthly Summary</button>
    </div>

    <!-- MARK ATTENDANCE VIEW -->
    <div id="view-mark" class="view-section active">
        <div class="card">
            <div class="row" style="justify-content: space-between; align-items: center;">
                <div>
                    <label>Date</label>
                    <input type="date" id="att-date">
                </div>
                <div style="display:flex; gap:5px; align-items:flex-end;">
                    <button class="secondary" onclick="markAll(true)">All Present</button>
                    <button class="secondary" onclick="markAll(false)">All Absent</button>
                </div>
            </div>
            <div id="att-list" style="margin-top:15px;">
                <!-- List generated by JS -->
            </div>
            <div style="margin-top:15px; text-align:right;">
                <button onclick="saveAttendance()">Save Attendance</button>
            </div>
        </div>
    </div>

    <!-- MANAGE NAMES VIEW -->
    <div id="view-manage" class="view-section">
        <div class="card">
            <h3>Add Student</h3>
            <div class="row">
                <input type="text" id="new-name" placeholder="Enter student name">
                <button onclick="addStudent()">Add</button>
            </div>
            <div id="student-list" style="margin-top:15px;">
                <!-- List generated by JS -->
            </div>
        </div>
    </div>

    <!-- SUMMARY VIEW -->
    <div id="view-summary" class="view-section">
        <div class="card">
            <div class="row">
                <div style="flex:1">
                    <label>Select Month</label>
                    <input type="month" id="summary-month">
                </div>
                <div style="flex:1; display:flex; align-items:flex-end;">
                    <button class="secondary" onclick="exportSummary()">Export CSV</button>
                </div>
            </div>
            <div id="summary-content" style="margin-top:15px;">
                <!-- Summary generated by JS -->
            </div>
        </div>
    </div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
offlineReady();

// YOUR CODE HERE
const STORAGE_KEYS = {
    STUDENTS: 'att_students',
    RECORDS: 'att_records'
};

// State
let students = store.get(STORAGE_KEYS.STUDENTS, []);
let records = store.get(STORAGE_KEYS.RECORDS, {}); // Format: { "YYYY-MM-DD": { studentId: "P"|"A" } }

// Init
document.addEventListener('DOMContentLoaded', () => {
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('att-date').value = today;
    
    // Set default summary month to current month
    const currentMonth = today.substring(0, 7);
    document.getElementById('summary-month').value = currentMonth;

    renderStudentList();
    renderAttendanceList();
    renderSummary();

    // Listeners
    document.getElementById('att-date').addEventListener('change', renderAttendanceList);
    document.getElementById('summary-month').addEventListener('change', renderSummary);
});

// Tab Switching
function switchTab(tabName) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`view-${tabName}`).classList.add('active');
    // Find button that calls this function (simple approximation)
    const btns = document.querySelectorAll('.tab-btn');
    if(tabName === 'mark') btns[0].classList.add('active');
    if(tabName === 'manage') btns[1].classList.add('active');
    if(tabName === 'summary') btns[2].classList.add('active');
}

// Student Management
function addStudent() {
    const input = document.getElementById('new-name');
    const name = input.value.trim();
    if (!name) return;
    
    const id = 's_' + Date.now();
    students.push({ id, name });
    store.set(STORAGE_KEYS.STUDENTS, students);
    input.value = '';
    renderStudentList();
}

function removeStudent(id) {
    if(!confirm('Remove this student?')) return;
    students = students.filter(s => s.id !== id);
    store.set(STORAGE_KEYS.STUDENTS, students);
    renderStudentList();
}

function renderStudentList() {
    const container = document.getElementById('student-list');
    if (students.length === 0) {
        container.innerHTML = '<p class="muted">No students added yet.</p>';
        return;
    }
    container.innerHTML = students.map(s => `
        <div class="att-row">
            <span class="att-name">${s.name}</span>
            <button class="secondary" style="padding:4px 8px; font-size:12px;" onclick="removeStudent('${s.id}')">Remove</button>
        </div>
    `).join('');
}

// Attendance Marking
function renderAttendanceList() {
    const date = document.getElementById('att-date').value;
    const container = document.getElementById('att-list');
    
    if (students.length === 0) {
        container.innerHTML = '<p class="muted">Please add students in the "Manage Names" tab first.</p>';
        return;
    }

    // Get existing record for this date
    const dayRecord = records[date] || {};

    container.innerHTML = students.map(s => {
        const status = dayRecord[s.id] || ''; // 'P', 'A', or ''
        return `
        <div class="att-row">
            <span class="att-name">${s.name}</span>
            <div class="att-controls">
                <button class="att-btn present ${status === 'P' ? 'active' : ''}" 
                    onclick="setStatus('${s.id}', 'P')" title="Present">P</button>
                <button class="att-btn absent ${status === 'A' ? 'active' : ''}" 
                    onclick="setStatus('${s.id}', 'A')" title="Absent">A</button>
            </div>
        </div>
        `;
    }).join('');
}

function setStatus(studentId, status) {
    const date = document.getElementById('att-date').value;
    if (!records[date]) records[date] = {};
    
    // Toggle logic: if clicking same status, remove it (mark as unmarked)
    if (records[date][studentId] === status) {
        delete records[date][studentId];
    } else {
        records[date][studentId] = status;
    }
    
    // Re-render to show active state
    renderAttendanceList();
}

function markAll(status) {
    const date = document.getElementById('att-date').value;
    if (!records[date]) records[date] = {};
    
    students.forEach(s => {
        if (status === true) records[date][s.id] = 'P';
        else records[date][s.id] = 'A';
    });
    renderAttendanceList();
}

function saveAttendance() {
    const date = document.getElementById('att-date').value;
    if (!date) return alert('Please select a date');
    
    // Check if all students are marked
    const dayRecord = records[date] || {};
    const unmarked = students.filter(s => !dayRecord[s.id]);
    
    if (unmarked.length > 0) {
        if(!confirm(`You have ${unmarked.length} unmarked students. Save anyway?`)) return;
    }

    store.set(STORAGE_KEYS.RECORDS, records);
    alert('Attendance saved successfully!');
}

// Summary & Export
function renderSummary() {
    const monthInput = document.getElementById('summary-month').value; // YYYY-MM
    const container = document.getElementById('summary-content');
    
    if (!monthInput) return;

    // Filter records for this month
    const monthRecords = {};
    Object.keys(records).forEach(date => {
        if (date.startsWith(monthInput)) {
            monthRecords[date] = records[date];
        }
    });

    if (Object.keys(monthRecords).length === 0) {
        container.innerHTML = '<p class="muted">No records found for this month.</p>';
        return;
    }

    // Calculate stats
    const stats = students.map(s => {
        let present = 0;
        let total = 0;
        Object.values(monthRecords).forEach(day => {
            if (day[s.id] === 'P') present++;
            if (day[s.id] === 'P' || day[s.id] === 'A') total++;
        });
        const pct = total > 0 ? Math.round((present / total) * 100) : 0;
        return { name: s.name, present, total, pct };
    });

    // Render Table
    let html = `
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Present</th>
                    <th>Total Days</th>
                    <th>Attendance %</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    stats.forEach(s => {
        html += `
            <tr>
                <td>${s.name}</td>
                <td>${s.present}</td>
                <td>${s.total}</td>
                <td>${s.pct}%</td>
            </tr>
        `;
    });
    
    html += '</tbody></table>';
    container.innerHTML = html;
}

function exportSummary() {
    const monthInput = document.getElementById('summary-month').value;
    if (!monthInput) return alert('Select a month first');
    
    const monthRecords = {};
    Object.keys(records).forEach(date => {
        if (date.startsWith(monthInput)) monthRecords[date] = records[date];
    });

    const rows = students.map(s => {
        let present = 0;
        let total = 0;
        Object.values(monthRecords).forEach(day => {
            if (day[s.id] === 'P') present++;
            if (day[s.id] === 'P' || day[s.id] === 'A') total++;
        });
        return {
            Name: s.name,
            Present: present,
            Total: total,
            Percentage: total > 0 ? Math.round((present/total)*100) + '%' : '0%'
        };
    });

    download(`attendance_${monthInput}.csv`, toCSV(rows), 'text/csv');
}
</script>
</body></html>
