<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Camp Signup - 14 September</title>
    <style>
        :root {
            --primary: #2c7a7b;
            --primary-dark: #234e52;
            --accent: #e6fffa;
            --text: #2d3748;
            --bg: #f7fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --danger: #e53e3e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Countdown */
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-dark);
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .time-box {
            background: var(--primary);
            color: var(--white);
            padding: 15px;
            border-radius: 8px;
            min-width: 80px;
            text-align: center;
        }

        .time-val {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-dark);
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--accent);
        }

        button {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        /* List Styles */
        .signup-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .signup-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .signup-item:last-child {
            border-bottom: none;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            color: var(--text);
        }

        .user-contact {
            font-size: 0.85rem;
            color: #718096;
        }

        .delete-btn {
            background: transparent;
            color: #cbd5e0;
            width: auto;
            padding: 5px;
            font-size: 1.2rem;
        }

        .delete-btn:hover {
            color: var(--danger);
            background: transparent;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 20px;
            font-style: italic;
        }

        .status-msg {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.5em;
        }
        .status-success { color: #38a169; }
        .status-error { color: var(--danger); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Community Health Camp</h1>
        <p class="subtitle">Free checkups, vaccinations, and health education.</p>
        <p><strong>Date:</strong> 14 September 2024</p>
        
        <div class="countdown-container" id="countdown">
            <div class="time-box">
                <span class="time-val" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="minutes">00</span>
                <span class="time-label">Mins</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="seconds">00</span>
                <span class="time-label">Secs</span>
            </div>
        </div>
    </header>

    <div class="content-grid">
        <!-- Signup Form -->
        <div class="card">
            <h2>Register Now</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. Jane Doe">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="e.g. 555-0123">
                </div>
                <div class="form-group">
                    <label for="service">Service Needed</label>
                    <select id="service">
                        <option value="General Checkup">General Checkup</option>
                        <option value="Vaccination">Vaccination</option>
                        <option value="Dental">Dental Checkup</option>
                        <option value="Eye Test">Eye Test</option>
                    </select>
                </div>
                <button type="submit">Sign Up</button>
                <div id="formStatus" class="status-msg"></div>
            </form>
        </div>

        <!-- Attendee List -->
        <div class="card">
            <h2>Attendees (<span id="count">0</span>)</h2>
            <ul class="signup-list" id="attendeeList">
                <!-- List items injected here -->
            </ul>
            <div id="emptyState" class="empty-state">No one has signed up yet.</div>
        </div>
    </div>
</div>

<script>
    // --- Configuration & State ---
    const STORAGE_KEY = 'health_camp_data';
    const EVENT_DATE = new Date('September 14, 2024 09:00:00').getTime();
    
    // State object: { attendees: [] }
    let appData = { attendees: [] };

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        renderList();
        startCountdown();
        
        // Register Service Worker (Blob) for offline capability
        registerSW();
    });

    // --- Data Handling ---
    function loadData() {
        // 1. Check for runtime data injection (window.data)
        if (window.data && window.data.attendees) {
            appData.attendees = window.data.attendees;
        } 
        // 2. Fallback to LocalStorage
        else {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    appData = JSON.parse(stored);
                } catch (e) {
                    console.error("Data parse error", e);
                    appData = { attendees: [] };
                }
            }
        }
    }

    function saveData() {
        // Save to local storage
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        // Update UI
        renderList();
    }

    // --- UI Rendering ---
    function renderList() {
        const listEl = document.getElementById('attendeeList');
        const countEl = document.getElementById('count');
        const emptyEl = document.getElementById('emptyState');

        listEl.innerHTML = '';
        countEl.textContent = appData.attendees.length;

        if (appData.attendees.length === 0) {
            emptyEl.style.display = 'block';
        } else {
            emptyEl.style.display = 'none';
            // Render in reverse order (newest first)
            [...appData.attendees].reverse().forEach((person, index) => {
                const li = document.createElement('li');
                li.className = 'signup-item';
                
                // Calculate original index for deletion
                const originalIndex = appData.attendees.length - 1 - index;

                li.innerHTML = `
                    <div class="user-info">
                        <span class="user-name">${escapeHtml(person.name)}</span>
                        <span class="user-contact">${escapeHtml(person.phone)} • ${escapeHtml(person.service)}</span>
                    </div>
                    <button class="delete-btn" onclick="removeAttendee(${originalIndex})" title="Remove">&times;</button>
                `;
                listEl.appendChild(li);
            });
        }
    }

    // --- Form Handling ---
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const serviceInput = document.getElementById('service');
        const statusEl = document.getElementById('formStatus');

        const newAttendee = {
            name: nameInput.value.trim(),
            phone: phoneInput.value.trim(),
            service: serviceInput.value,
            timestamp: new Date().toISOString()
        };

        // Basic validation
        if (!newAttendee.name || !newAttendee.phone) {
            showStatus('Please fill in all fields.', 'error');
            return;
        }

        // Add to data
        appData.attendees.push(newAttendee);
        saveData();

        // Reset form
        nameInput.value = '';
        phoneInput.value = '';
        serviceInput.value = 'General Checkup';
        showStatus('You are registered!', 'success');
    });

    // Exposed function for the delete button
    window.removeAttendee = function(index) {
        if(confirm('Remove this person from the list?')) {
            appData.attendees.splice(index, 1);
            saveData();
        }
    };

    function showStatus(msg, type) {
        const el = document.getElementById('formStatus');
        el.textContent = msg;
        el.className = 'status-msg status-' + type;
        setTimeout(() => {
            el.textContent = '';
        }, 3000);
    }

    // --- Countdown Logic ---
    function startCountdown() {
        const updateTimer = () => {
            const now = new Date().getTime();
            const distance = EVENT_DATE - now;

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = "<div class='time-box' style='width:100%'>Event Started!</div>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days < 10 ? '0' + days : days;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        };

        setInterval(updateTimer, 1000);
        updateTimer(); // Run immediately
    }

    // --- Utilities ---
    function escapeHtml(text) {
        if (!text) return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // --- Service Worker (Blob) ---
    function registerSW() {
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'health-camp-v1';
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => {
                            return cache.addAll([
                                './', // The current file
                                'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css' // Optional icon font if needed, though we use text here
                            ]);
                        })
                    );
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((response) => {
                            return response || fetch(e.request);
                        })
                    );
                });
            `;
            
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('SW Registration Failed', err));
        }
    }
</script>

</body>
</html>
