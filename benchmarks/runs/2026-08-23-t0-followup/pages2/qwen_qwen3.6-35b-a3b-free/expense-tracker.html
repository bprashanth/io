<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Team Expense Tracker</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 0;
        }

        /* Dashboard Cards */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* Breakdown List */
        .breakdown-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .breakdown-item:last-child {
            border-bottom: none;
        }

        .breakdown-head {
            font-weight: 500;
        }

        .breakdown-val {
            font-family: monospace;
            font-weight: bold;
        }

        /* Form */
        .input-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
        }

        input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button#add-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            height: 42px; /* Match input height roughly */
        }

        button#add-btn:hover {
            background-color: #219150;
        }

        /* Table */
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #95a5a6;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Field Expense Tracker</h1>
        <p class="subtitle">Offline-capable local tracker</p>
    </header>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="card">
            <h2>Running Total</h2>
            <div class="total-amount" id="grand-total">0.00</div>
        </div>
        <div class="card">
            <h2>Breakdown by Head</h2>
            <ul class="breakdown-list" id="breakdown-list">
                <!-- Populated by JS -->
            </ul>
        </div>
    </div>

    <!-- Input Form -->
    <div class="input-section">
        <form id="expense-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="head">Expense Head</label>
                    <input type="text" id="head" placeholder="e.g. Travel, Food" list="head-suggestions" required>
                    <datalist id="head-suggestions">
                        <option value="Travel">
                        <option value="Food">
                        <option value="Stationery">
                        <option value="Accommodation">
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button type="submit" id="add-btn">Add</button>
            </div>
        </form>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <table id="expense-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Head</th>
                    <th>Amount</th>
                    <th style="width: 50px;"></th>
                </tr>
            </thead>
            <tbody id="expense-list">
                <!-- Rows go here -->
            </tbody>
        </table>
        <div id="empty-msg" class="empty-state">No expenses recorded yet.</div>
    </div>
</div>

<script>
    (function() {
        // --- State Management ---
        let expenses = [];
        const STORAGE_KEY = 'field_expenses_v1';

        // --- Initialization ---
        function init() {
            // 1. Load from LocalStorage
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    expenses = JSON.parse(stored);
                } catch (e) {
                    console.error("Failed to parse local storage", e);
                    expenses = [];
                }
            }

            // 2. Check for window.data (as per prompt instructions)
            // If window.data exists, it overrides local storage to ensure runtime data is used.
            if (window.data && Array.isArray(window.data)) {
                expenses = window.data;
                saveData(); // Save the injected data to local storage for persistence
            }

            // 3. Set default date to today
            document.getElementById('date').valueAsDate = new Date();

            // 4. Render
            render();

            // 5. Attach Event Listeners
            document.getElementById('expense-form').addEventListener('submit', handleAdd);
        }

        // --- Core Logic ---
        function handleAdd(e) {
            e.preventDefault();
            
            const dateInput = document.getElementById('date');
            const headInput = document.getElementById('head');
            const amountInput = document.getElementById('amount');

            const newExpense = {
                id: Date.now(), // Simple unique ID
                date: dateInput.value,
                head: headInput.value.trim(),
                amount: parseFloat(amountInput.value)
            };

            if (!newExpense.head || isNaN(newExpense.amount)) return;

            expenses.push(newExpense);
            saveData();
            render();

            // Reset form but keep date
            headInput.value = '';
            amountInput.value = '';
            headInput.focus();
        }

        function deleteExpense(id) {
            if(confirm('Delete this entry?')) {
                expenses = expenses.filter(ex => ex.id !== id);
                saveData();
                render();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        }

        // --- Rendering ---
        function render() {
            const listEl = document.getElementById('expense-list');
            const emptyMsg = document.getElementById('empty-msg');
            const totalEl = document.getElementById('grand-total');
            const breakdownEl = document.getElementById('breakdown-list');

            // Clear current list
            listEl.innerHTML = '';

            // Sort by date descending (newest first)
            const sortedExpenses = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sortedExpenses.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                emptyMsg.style.display = 'none';
                sortedExpenses.forEach(ex => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${formatDate(ex.date)}</td>
                        <td>${escapeHtml(ex.head)}</td>
                        <td>${formatCurrency(ex.amount)}</td>
                        <td style="text-align: right;">
                            <button class="delete-btn" onclick="window._delete(${ex.id})">✕</button>
                        </td>
                    `;
                    listEl.appendChild(row);
                });
            }

            // Calculate Totals
            const totals = calculateTotals();
            const grandTotal = Object.values(totals).reduce((sum, val) => sum + val, 0);

            // Update Grand Total
            totalEl.textContent = formatCurrency(grandTotal);

            // Update Breakdown
            breakdownEl.innerHTML = '';
            // Sort heads alphabetically for the breakdown
            const sortedHeads = Object.keys(totals).sort();
            
            if (sortedHeads.length === 0) {
                breakdownEl.innerHTML = '<li class="breakdown-item"><span>No data</span></li>';
            } else {
                sortedHeads.forEach(head => {
                    const li = document.createElement('li');
                    li.className = 'breakdown-item';
                    li.innerHTML = `
                        <span class="breakdown-head">${escapeHtml(head)}</span>
                        <span class="breakdown-val">${formatCurrency(totals[head])}</span>
                    `;
                    breakdownEl.appendChild(li);
                });
            }
        }

        function calculateTotals() {
            const totals = {};
            expenses.forEach(ex => {
                if (!totals[ex.head]) {
                    totals[ex.head] = 0;
                }
                totals[ex.head] += ex.amount;
            });
            return totals;
        }

        // --- Helpers ---
        function formatCurrency(num) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            // Use locale date string for readability
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Expose delete function to global scope for the onclick handler
        window._delete = deleteExpense;

        // Start
        init();

    })();
</script>

</body>
</html>
