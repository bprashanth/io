<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Expense Tracker</title>
<style>
    :root {
        --primary: #2c3e50;
        --accent: #27ae60;
        --bg: #f4f7f6;
        --card: #ffffff;
        --text: #333333;
        --border: #e0e0e0;
        --danger: #e74c3c;
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.5;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 30px;
        font-size: 1.8rem;
    }

    .card {
        background: var(--card);
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        padding: 20px;
        margin-bottom: 20px;
    }

    .card-header {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
        color: var(--primary);
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: end;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    label {
        font-size: 0.85rem;
        margin-bottom: 5px;
        color: #666;
    }

    input, select {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 1rem;
        width: 100%;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
    }

    .btn-primary {
        background-color: var(--accent);
        color: white;
        width: 100%;
    }

    .btn-primary:hover {
        background-color: #219150;
    }

    .btn-danger {
        background-color: var(--danger);
        color: white;
        padding: 5px 10px;
        font-size: 0.8rem;
    }

    .btn-danger:hover {
        background-color: #c0392b;
    }

    .btn-reset {
        background-color: var(--primary);
        color: white;
        margin-top: 10px;
        width: 100%;
    }

    .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
    }

    .summary-row:last-child {
        border-bottom: none;
        font-weight: bold;
        font-size: 1.2rem;
        color: var(--primary);
        margin-top: 10px;
    }

    .total-display {
        text-align: right;
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--accent);
        margin-top: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
    }

    th, td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid var(--border);
    }

    th {
        background-color: #f8f9fa;
        color: var(--primary);
    }

    .amount-col {
        text-align: right;
        font-family: monospace;
        font-size: 1.1rem;
    }

    .empty-state {
        text-align: center;
        color: #999;
        padding: 20px;
        font-style: italic;
    }

    @media (max-width: 600px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
        .amount-col {
            text-align: left;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Field Expense Tracker</h1>

    <!-- Input Section -->
    <div class="card">
        <div class="card-header">Add New Expense</div>
        <form id="expenseForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="head">Head of Account</label>
                    <select id="head" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Travel">Travel</option>
                        <option value="Food">Food & Refreshments</option>
                        <option value="Office">Office Supplies</option>
                        <option value="Medical">Medical</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn-primary">Add Expense</button>
            </div>
        </form>
    </div>

    <!-- Totals Section -->
    <div class="card">
        <div class="card-header">Running Total</div>
        <div id="grandTotal" class="total-display">$0.00</div>
    </div>

    <!-- Breakdown Section -->
    <div class="card">
        <div class="card-header">Totals by Head</div>
        <div id="breakdownList">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- History Section -->
    <div class="card">
        <div class="card-header">Recent Entries</div>
        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Head</th>
                    <th class="amount-col">Amount</th>
                    <th style="width: 50px;"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Populated by JS -->
            </tbody>
        </table>
        <div id="emptyState" class="empty-state">No expenses recorded yet.</div>
        <button id="resetBtn" class="btn-reset" style="display:none;">Reset All Data</button>
    </div>
</div>

<script>
    // --- State Management ---
    let expenses = [];

    // --- DOM Elements ---
    const form = document.getElementById('expenseForm');
    const dateInput = document.getElementById('date');
    const headInput = document.getElementById('head');
    const amountInput = document.getElementById('amount');
    const tableBody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');
    const grandTotalEl = document.getElementById('grandTotal');
    const breakdownList = document.getElementById('breakdownList');
    const resetBtn = document.getElementById('resetBtn');

    // --- Initialization ---
    function init() {
        // Set default date to today
        dateInput.valueAsDate = new Date();
        
        // Check for runtime data
        if (window.data && window.data.expenses) {
            expenses = window.data.expenses;
        }

        render();
    }

    // --- Core Logic ---

    // Add Expense
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const newExpense = {
            id: Date.now(),
            date: dateInput.value,
            head: headInput.value,
            amount: parseFloat(amountInput.value)
        };

        expenses.push(newExpense);
        form.reset();
        dateInput.valueAsDate = new Date(); // Reset date to today
        render();
    });

    // Delete Expense
    function deleteExpense(id) {
        if(confirm('Are you sure you want to delete this entry?')) {
            expenses = expenses.filter(exp => exp.id !== id);
            render();
        }
    }

    // Reset All
    resetBtn.addEventListener('click', () => {
        if(confirm('This will delete all expense records. Are you sure?')) {
            expenses = [];
            render();
        }
    });

    // --- Rendering ---

    function formatCurrency(num) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    }

    function render() {
        // Sort by date descending
        const sortedExpenses = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

        // Update Table
        tableBody.innerHTML = '';
        
        if (sortedExpenses.length === 0) {
            emptyState.style.display = 'block';
            resetBtn.style.display = 'none';
        } else {
            emptyState.style.display = 'none';
            resetBtn.style.display = 'block';
            
            sortedExpenses.forEach(exp => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${exp.date}</td>
                    <td>${exp.head}</td>
                    <td class="amount-col">${formatCurrency(exp.amount)}</td>
                    <td style="text-align: right;">
                        <button class="btn-danger" onclick="deleteExpense(${exp.id})">X</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Calculate Totals
        const total = expenses.reduce((sum, item) => sum + item.amount, 0);
        grandTotalEl.textContent = formatCurrency(total);

        // Calculate Breakdown
        const breakdown = {};
        expenses.forEach(exp => {
            if (!breakdown[exp.head]) {
                breakdown[exp.head] = 0;
            }
            breakdown[exp.head] += exp.amount;
        });

        // Render Breakdown List
        breakdownList.innerHTML = '';
        Object.keys(breakdown).forEach(head => {
            const row = document.createElement('div');
            row.className = 'summary-row';
            row.innerHTML = `
                <span>${head}</span>
                <span>${formatCurrency(breakdown[head])}</span>
            `;
            breakdownList.appendChild(row);
        });
    }

    // Start
    init();

</script>
</body>
</html>
