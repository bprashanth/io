<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Camp Signup</title>
<style>
    :root {
        --primary: #2e7d32;
        --primary-dark: #1b5e20;
        --bg: #f5f5f5;
        --card: #ffffff;
        --text: #333333;
        --border: #e0e0e0;
        --error: #d32f2f;
        --success: #388e3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: var(--primary); margin-bottom: 10px; }
    .date-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; display: inline-block; }
    
    .card { background: var(--card); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 25px; margin-bottom: 25px; }
    h2 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
    
    /* Countdown */
    .countdown { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .time-box { text-align: center; background: #e8f5e9; padding: 10px; border-radius: 6px; min-width: 70px; }
    .time-val { font-size: 1.5rem; font-weight: bold; color: var(--primary-dark); display: block; }
    .time-label { font-size: 0.8rem; color: #666; text-transform: uppercase; }
    .expired { color: var(--error); background: #ffebee; }
    
    /* Form */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.95rem; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: var(--primary-dark); }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error-msg { color: var(--error); font-size: 0.9rem; margin-top: 5px; display: none; }
    
    /* List */
    .signup-list { list-style: none; max-height: 300px; overflow-y: auto; }
    .signup-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .signup-item:last-child { border-bottom: none; }
    .signup-item strong { color: var(--primary); }
    .empty-state { text-align: center; color: #888; padding: 20px; font-style: italic; }
    
    /* Toast */
    #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 17px; }
    #toast.show { visibility: visible; -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Community Health Camp</h1>
        <div class="date-badge">14 September</div>
    </header>

    <section class="card">
        <h2>Event Countdown</h2>
        <div id="countdown" class="countdown">
            <div class="time-box"><span class="time-val" id="days">00</span><span class="time-label">Days</span></div>
            <div class="time-box"><span class="time-val" id="hours">00</span><span class="time-label">Hours</span></div>
            <div class="time-box"><span class="time-val" id="minutes">00</span><span class="time-label">Mins</span></div>
            <div class="time-box"><span class="time-val" id="seconds">00</span><span class="time-label">Secs</span></div>
        </div>
    </section>

    <section class="card">
        <h2>Register for the Camp</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="e.g. Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="e.g. jane@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="e.g. 555-0123">
            </div>
            <div class="form-group">
                <label for="service">Service Needed</label>
                <select id="service" name="service" required>
                    <option value="" disabled selected>Select a service...</option>
                    <option value="checkup">General Health Checkup</option>
                    <option value="vaccination">Vaccination</option>
                    <option value="consultation">Doctor Consultation</option>
                    <option value="blood_test">Blood Test</option>
                </select>
            </div>
            <div id="formError" class="error-msg"></div>
            <button type="submit" id="submitBtn">Sign Up</button>
        </form>
    </section>

    <section class="card">
        <h2>Registered Participants</h2>
        <ul id="signupList" class="signup-list">
            <!-- List items injected here -->
        </ul>
    </section>
</div>

<div id="toast">Message</div>

<script>
    // --- Configuration & Data ---
    const EVENT_DATE = new Date("September 14, 2024 09:00:00").getTime();
    
    // Initialize data from window.data if available, otherwise empty array
    let participants = window.data ? window.data.participants : [];

    // --- DOM Elements ---
    const countdownEls = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
    };
    const form = document.getElementById('signupForm');
    const listEl = document.getElementById('signupList');
    const errorEl = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const toastEl = document.getElementById('toast');

    // --- Countdown Logic ---
    function updateCountdown() {
        const now = new Date().getTime();
        const distance = EVENT_DATE - now;

        if (distance < 0) {
            // Event passed
            document.getElementById('countdown').innerHTML = '<div style="text-align:center; color:var(--error); font-weight:bold;">The event has passed.</div>';
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        countdownEls.days.textContent = days < 10 ? '0' + days : days;
        countdownEls.hours.textContent = hours < 10 ? '0' + hours : hours;
        countdownEls.minutes.textContent = minutes < 10 ? '0' + minutes : minutes;
        countdownEls.seconds.textContent = seconds < 10 ? '0' + seconds : seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown(); // Initial call

    // --- Form Logic ---
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorEl.style.display = 'none';
        errorEl.textContent = '';

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const service = document.getElementById('service').value;

        // Simple validation
        if (!fullName || !email || !phone || !service) {
            showError("Please fill in all fields.");
            return;
        }

        // Create participant object
        const newParticipant = {
            id: Date.now(),
            name: fullName,
            email: email,
            phone: phone,
            service: service
        };

        // Add to data
        participants.push(newParticipant);
        
        // Update UI
        renderList();
        showToast("You have successfully signed up!");
        form.reset();
    });

    function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
    }

    // --- List Rendering ---
    function renderList() {
        listEl.innerHTML = '';
        
        if (participants.length === 0) {
            listEl.innerHTML = '<li class="empty-state">No one has signed up yet.</li>';
            return;
        }

        // Sort by name
        participants.sort((a, b) => a.name.localeCompare(b.name));

        participants.forEach(p => {
            const li = document.createElement('li');
            li.className = 'signup-item';
            li.innerHTML = `
                <span><strong>${p.name}</strong> (${p.service})</span>
                <span style="color:#666; font-size:0.9rem;">${p.email}</span>
            `;
            listEl.appendChild(li);
        });
    }

    // --- Toast Notification ---
    function showToast(message) {
        toastEl.textContent = message;
        toastEl.className = "show";
        setTimeout(function(){ toastEl.className = toastEl.className.replace("show", ""); }, 3000);
    }

    // Initial render
    renderList();

</script>
</body>
</html>
