<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Scheme Progress</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #c0392b;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --border: #bdc3c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid var(--accent); }
        h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 5px; }
        .subtitle { font-size: 0.9rem; color: #7f8c8d; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { font-size: 1rem; color: var(--secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 2rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: #7f8c8d; }
        .stat-change { font-size: 0.85rem; margin-top: 5px; }
        .positive { color: var(--success); }
        .negative { color: var(--danger); }
        .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--light); }
        th { background-color: var(--light); font-weight: 600; color: var(--secondary); font-size: 0.9rem; }
        tr:hover { background-color: #f9f9f9; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-approved { background-color: #d4edda; color: #155724; }
        .status-rejected { background-color: #f8d7da; color: #721c24; }
        .status-processed { background-color: #d1ecf1; color: #0c5460; }
        .empty-state { padding: 40px; text-align: center; color: #7f8c8d; }
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            th, td { padding: 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Scholarship Scheme Progress</h1>
            <p class="subtitle">District-wise analysis of pending cases and approval status</p>
        </header>

        <div id="dashboard" class="dashboard-grid">
            <!-- Dashboard cards will be injected here -->
        </div>

        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>District</th>
                        <th>Taluka</th>
                        <th>Scheme</th>
                        <th>Applicant</th>
                        <th>Marks %</th>
                        <th>Family Income</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Table rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Register Service Worker from Blob URL for offline capability
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'scholarship-app-v1';
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => cache.addAll(['./']))
                    );
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request);
                        })
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed (expected in some environments):', err));
        }

        // Data Processing Logic
        function processData(rawData) {
            if (!Array.isArray(rawData)) return [];
            
            // Group by District
            const districtMap = {};
            
            rawData.forEach(row => {
                const district = row.District || 'Unknown';
                if (!districtMap[district]) {
                    districtMap[district] = {
                        total: 0,
                        pending: 0,
                        approved: 0,
                        rejected: 0,
                        processed: 0,
                        rows: []
                    };
                }
                
                districtMap[district].total++;
                
                const status = (row.Status || '').toLowerCase().trim();
                if (status === 'pending') districtMap[district].pending++;
                else if (status === 'approved') districtMap[district].approved++;
                else if (status === 'rejected') districtMap[district].rejected++;
                else if (status === 'processed') districtMap[district].processed++;
                
                districtMap[district].rows.push(row);
            });

            // Convert to array and sort by total count descending
            return Object.values(districtMap).sort((a, b) => b.total - a.total);
        }

        // Render Dashboard Cards
        function renderDashboard(districts) {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            districts.forEach(d => {
                const total = d.total;
                const pending = d.pending;
                const approved = d.approved;
                const rejected = d.rejected;
                const processed = d.processed;
                
                // Calculate percentages
                const pendingPct = total > 0 ? Math.round((pending / total) * 100) : 0;
                const approvedPct = total > 0 ? Math.round((approved / total) * 100) : 0;
                const rejectedPct = total > 0 ? Math.round((rejected / total) * 100) : 0;
                const processedPct = total > 0 ? Math.round((processed / total) * 100) : 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${d.District}</h3>
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">Total Cases</div>
                    <div class="stat-change">
                        <span class="negative">Pending: ${pending} (${pendingPct}%)</span>
                    </div>
                    <div class="stat-change" style="margin-top:5px;">
                        <span class="positive">Approved: ${approved} (${approvedPct}%)</span>
                    </div>
                    <div class="stat-change" style="margin-top:5px;">
                        <span class="positive">Processed: ${processed} (${processedPct}%)</span>
                    </div>
                    <div class="stat-change" style="margin-top:5px;">
                        <span class="negative">Rejected: ${rejected} (${rejectedPct}%)</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Table
        function renderTable(districts) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (districts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No data available</td></tr>';
                return;
            }

            // Flatten rows, but group visually by district if possible, or just list all
            // For simplicity in a single table, we list all rows.
            // To make it readable, we might want to sort by District then Taluka.
            const allRows = districts.flatMap(d => d.rows);
            allRows.sort((a, b) => {
                const dA = a.District || '';
                const dB = b.District || '';
                if (dA !== dB) return dA.localeCompare(dB);
                return (a.Taluka || '').localeCompare(b.Taluka || '');
            });

            allRows.forEach(row => {
                const tr = document.createElement('tr');
                
                // Determine status class
                const status = (row.Status || '').toLowerCase().trim();
                let statusClass = 'status-pending';
                if (status === 'approved') statusClass = 'status-approved';
                if (status === 'rejected') statusClass = 'status-rejected';
                if (status === 'processed') statusClass = 'status-processed';

                tr.innerHTML = `
                    <td><strong>${row.District || 'N/A'}</strong></td>
                    <td>${row.Taluka || '-'}</td>
                    <td>${row['Name of scheme'] || '-'}</td>
                    <td>${row.Name || '-'}</td>
                    <td>${row['Marks %'] || '-'}</td>
                    <td>${row['Family Income'] || '-'}</td>
                    <td><span class="status-badge ${statusClass}">${row.Status || 'Unknown'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize
        function init() {
            // Check for data
            if (window.data) {
                const processedData = processData(window.data);
                renderDashboard(processedData);
                renderTable(processedData);
            } else {
                // Fallback for testing if data is not present
                console.warn("window.data is not defined. Please ensure data is passed to the window object.");
                document.getElementById('dashboard').innerHTML = '<div class="card"><h3>Waiting for Data</h3><p>Please load this page with data available in window.data</p></div>';
                document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="empty-state">No data available</td></tr>';
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
