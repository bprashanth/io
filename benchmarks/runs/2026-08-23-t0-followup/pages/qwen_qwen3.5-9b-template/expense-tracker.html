<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Expense Tracker</h1></header>
<main>
<div class="grid">
  <div class="card">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <label>Date</label>
      <input type="date" id="date" required>
      
      <label>Head</label>
      <select id="head" required>
        <option value="">Select Head</option>
        <option value="Travel">Travel</option>
        <option value="Office Supplies">Office Supplies</option>
        <option value="Training">Training</option>
        <option value="Communication">Communication</option>
        <option value="Other">Other</option>
      </select>
      
      <label>Amount</label>
      <input type="number" id="amount" step="0.01" min="0" required>
      
      <button type="submit">Add Expense</button>
    </form>
  </div>

  <div class="card">
    <h2>Running Total</h2>
    <div id="runningTotal" class="muted">0.00</div>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between; align-items:center;">
    <h2>Expenses by Head</h2>
    <div>
      <button class="secondary" id="exportBtn">Export CSV</button>
      <button class="secondary" id="clearBtn">Clear Data</button>
    </div>
  </div>
  <table id="summaryTable">
    <thead>
      <tr>
        <th>Head</th>
        <th>Count</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows generated by script -->
    </tbody>
  </table>
</div>

<div class="card">
  <h2>Recent Transactions</h2>
  <table id="transactionTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Head</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows generated by script -->
    </tbody>
  </table>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
const form = document.getElementById('expenseForm');
const dateInput = document.getElementById('date');
const headInput = document.getElementById('head');
const amountInput = document.getElementById('amount');
const runningTotalEl = document.getElementById('runningTotal');
const summaryTableBody = document.querySelector('#summaryTable tbody');
const transactionTableBody = document.querySelector('#transactionTable tbody');
const exportBtn = document.getElementById('exportBtn');
const clearBtn = document.getElementById('clearBtn');

const HEADS = ['Travel', 'Office Supplies', 'Training', 'Communication', 'Other'];

function render() {
  const data = store.get('expenses', []);
  const total = data.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
  runningTotalEl.textContent = total.toFixed(2);

  // Group by Head
  const groups = {};
  data.forEach(item => {
    const head = item.head || 'Other';
    if (!groups[head]) groups[head] = { count: 0, total: 0 };
    groups[head].count++;
    groups[head].total += parseFloat(item.amount || 0);
  });

  // Render Summary Table
  summaryTableBody.innerHTML = '';
  Object.keys(groups).sort().forEach(head => {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${head}</td><td>${groups[head].count}</td><td>${groups[head].total.toFixed(2)}</td>`;
    summaryTableBody.appendChild(row);
  });

  // Render Recent Transactions (Last 10)
  transactionTableBody.innerHTML = '';
  const sortedData = [...data].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10);
  sortedData.forEach(item => {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${item.date}</td><td>${item.head}</td><td>${parseFloat(item.amount || 0).toFixed(2)}</td>`;
    transactionTableBody.appendChild(row);
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const data = store.get('expenses', []);
  const newItem = {
    id: Date.now(),
    date: dateInput.value,
    head: headInput.value,
    amount: amountInput.value
  };
  data.push(newItem);
  store.set('expenses', data);
  form.reset();
  dateInput.value = new Date().toISOString().split('T')[0];
  render();
});

exportBtn.addEventListener('click', () => {
  const data = store.get('expenses', []);
  const headers = ['Date', 'Head', 'Amount'];
  const rows = data.map(item => [item.date, item.head, item.amount]);
  const csv = toCSV([...headers, ...rows]);
  download('expenses.csv', csv, 'text/csv');
});

clearBtn.addEventListener('click', () => {
  if (confirm('Are you sure you want to clear all expense data?')) {
    store.set('expenses', []);
    render();
  }
});

// Initialize
dateInput.value = new Date().toISOString().split('T')[0];
render();
</script>
</body></html>
