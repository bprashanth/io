<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Attendance Tracker</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Daily Attendance Tracker</h1></header>
<main>
<!-- YOUR MARKUP HERE -->
<div class="card">
  <div class="row">
    <div style="flex:1">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Enter name...">
    </div>
    <div>
      <button id="addStudentBtn">Add Student</button>
    </div>
  </div>
  <div id="studentList" style="margin-top:16px"></div>
</div>

<div class="card">
  <div class="row">
    <div style="flex:1">
      <label for="attendanceDate">Date</label>
      <input type="date" id="attendanceDate">
    </div>
    <div>
      <button id="saveAttendanceBtn">Save Attendance</button>
    </div>
  </div>
  <div id="attendanceForm" style="margin-top:16px"></div>
</div>

<div class="card">
  <div class="row">
    <div style="flex:1">
      <label for="summaryMonth">Month</label>
      <input type="month" id="summaryMonth">
    </div>
    <div>
      <button id="exportBtn" class="secondary">Export CSV</button>
    </div>
  </div>
  <div id="summaryTable" style="margin-top:16px"></div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
const students = store.get('students', []);
const attendance = store.get('attendance', {});
const today = new Date().toISOString().split('T')[0];

document.getElementById('attendanceDate').value = today;
document.getElementById('summaryMonth').value = new Date().toISOString().slice(0, 7);

function renderStudents() {
  const list = document.getElementById('studentList');
  list.innerHTML = students.map((s, i) => `
    <div class="row" style="align-items:center; margin-bottom:8px">
      <span style="flex:1">${s}</span>
      <button class="secondary" style="padding:4px 8px;font-size:12px" onclick="removeStudent(${i})">Remove</button>
    </div>
  `).join('');
}

function renderAttendanceForm() {
  const form = document.getElementById('attendanceForm');
  const date = document.getElementById('attendanceDate').value;
  const key = `attendance_${date}`;
  const records = attendance[key] || {};
  
  form.innerHTML = students.map(s => {
    const status = records[s] || '';
    return `
      <div class="row" style="margin-bottom:8px">
        <span style="flex:1">${s}</span>
        <div style="display:flex;gap:4px">
          <button class="secondary" style="padding:6px 12px" onclick="mark('${s}', 'present')">Present</button>
          <button class="secondary" style="padding:6px 12px" onclick="mark('${s}', 'absent')">Absent</button>
          <button class="secondary" style="padding:6px 12px" onclick="mark('${s}', '')">Clear</button>
        </div>
      </div>
    `;
  }).join('');
}

function mark(name, status) {
  const date = document.getElementById('attendanceDate').value;
  const key = `attendance_${date}`;
  if (!attendance[key]) attendance[key] = {};
  attendance[key][name] = status;
  store.set('attendance', attendance);
  renderAttendanceForm();
}

function saveAttendance() {
  const date = document.getElementById('attendanceDate').value;
  if (!date) return alert('Please select a date');
  const form = document.getElementById('attendanceForm');
  const inputs = form.querySelectorAll('button');
  let changed = false;
  
  students.forEach(s => {
    const btn = Array.from(inputs).find(b => b.textContent.includes(s));
    if (btn) {
      const status = btn.classList.contains('secondary') ? '' : btn.textContent.toLowerCase();
      if (attendance[`attendance_${date}`][s] !== status) changed = true;
    }
  });
  
  if (!changed) return;
  store.set('attendance', attendance);
  alert('Attendance saved!');
}

function removeStudent(index) {
  students.splice(index, 1);
  store.set('students', students);
  renderStudents();
  renderAttendanceForm();
}

function renderSummary() {
  const monthInput = document.getElementById('summaryMonth').value;
  if (!monthInput) return;
  
  const [year, month] = monthInput.split('-');
  const monthNum = parseInt(month, 10);
  
  const rows = students.map(s => {
    let present = 0;
    let absent = 0;
    let total = 0;
    
    for (let d = 1; d <= new Date(year, monthNum, 0).getDate(); d++) {
      const dateStr = `${year}-${String(monthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const key = `attendance_${dateStr}`;
      const record = attendance[key] || {};
      if (record[s] === 'present') present++;
      if (record[s] === 'absent') absent++;
      total++;
    }
    
    return {
      name: s,
      present,
      absent,
      total,
      rate: total ? ((present / total) * 100).toFixed(1) : 0
    };
  });
  
  const table = document.getElementById('summaryTable');
  table.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Present</th>
          <th>Absent</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.name}</td>
            <td>${r.present}</td>
            <td>${r.absent}</td>
            <td>${r.rate}%</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

document.getElementById('addStudentBtn').addEventListener('click', () => {
  const input = document.getElementById('studentName');
  const name = input.value.trim();
  if (name && !students.includes(name)) {
    students.push(name);
    store.set('students', students);
    input.value = '';
    renderStudents();
    renderAttendanceForm();
  } else if (students.includes(name)) {
    alert('Student already exists');
  }
});

document.getElementById('saveAttendanceBtn').addEventListener('click', saveAttendance);
document.getElementById('exportBtn').addEventListener('click', () => {
  const monthInput = document.getElementById('summaryMonth').value;
  if (!monthInput) return alert('Select a month first');
  
  const [year, month] = monthInput.split('-');
  const monthNum = parseInt(month, 10);
  
  const rows = students.map(s => {
    let present = 0;
    let absent = 0;
    for (let d = 1; d <= new Date(year, monthNum, 0).getDate(); d++) {
      const dateStr = `${year}-${String(monthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const key = `attendance_${dateStr}`;
      const record = attendance[key] || {};
      if (record[s] === 'present') present++;
      if (record[s] === 'absent') absent++;
    }
    return { name: s, present, absent };
  });
  
  const csv = toCSV(rows);
  download(`attendance_${monthInput}.csv`, csv, 'text/csv');
});

renderStudents();
renderAttendanceForm();
renderSummary();
</script>
</body></html>
