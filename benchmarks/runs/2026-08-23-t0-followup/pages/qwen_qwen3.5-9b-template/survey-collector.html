<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Point Survey</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Water Point Survey</h1></header>
<main>
<!-- YOUR MARKUP HERE -->
<div class="card">
  <form id="surveyForm">
    <div class="row">
      <div>
        <label for="location">Location / Village</label>
        <input type="text" id="location" name="location" required>
      </div>
      <div>
        <label for="gps">GPS Coordinates</label>
        <input type="text" id="gps" name="gps" placeholder="Auto-capturing..." readonly>
      </div>
    </div>
    
    <div class="row">
      <div>
        <label for="pumpType">Pump Type</label>
        <select id="pumpType" name="pumpType" required>
          <option value="">Select...</option>
          <option value="Hand Pump">Hand Pump</option>
          <option value="Solar Pump">Solar Pump</option>
          <option value="Electric Pump">Electric Pump</option>
          <option value="Borehole">Borehole</option>
          <option value="Spring">Spring</option>
        </select>
      </div>
      <div>
        <label for="status">Working Status</label>
        <select id="status" name="status" required>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="users">Daily Users (approx)</label>
        <input type="number" id="users" name="users" min="0">
      </div>
      <div>
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>
      </div>
    </div>

    <div class="row" style="margin-top: 16px;">
      <button type="submit">Save Response</button>
      <button type="button" class="secondary" id="exportBtn">Export JSON</button>
    </div>
  </form>
</div>

<div id="resultsArea" class="card" style="display:none;">
  <h3>Recent Responses</h3>
  <div id="resultsList"></div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('surveyForm');
  const gpsInput = document.getElementById('gps');
  const resultsArea = document.getElementById('resultsArea');
  const resultsList = document.getElementById('resultsList');
  const exportBtn = document.getElementById('exportBtn');

  // 1. Auto-capture GPS
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        gpsInput.value = `${lat}, ${lng}`;
      },
      (err) => {
        console.warn('GPS access denied or unavailable', err);
        gpsInput.value = 'GPS Unavailable';
      }
    );
  } else {
    gpsInput.value = 'GPS Not Supported';
  }

  // 2. Load existing data
  const savedData = store.get('waterSurveyData', []);
  if (savedData.length > 0) {
    resultsArea.style.display = 'block';
    renderResults(savedData);
  }

  // 3. Handle Form Submit
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const response = {
      id: Date.now(),
      timestamp: new Date().toISOString(),
      location: document.getElementById('location').value,
      gps: gpsInput.value,
      pumpType: document.getElementById('pumpType').value,
      status: document.getElementById('status').value,
      users: document.getElementById('users').value,
      notes: document.getElementById('notes').value
    };

    // Save to local storage
    const currentData = store.get('waterSurveyData', []);
    currentData.push(response);
    store.set('waterSurveyData', currentData);

    // UI Feedback
    alert('Response saved successfully!');
    form.reset();
    gpsInput.value = ''; // Reset GPS for next entry
    renderResults(currentData);
  });

  // 4. Render Results
  function renderResults(data) {
    resultsList.innerHTML = '';
    // Show newest first
    [...data].reverse().forEach(item => {
      const div = document.createElement('div');
      div.className = 'card';
      div.style.padding = '10px';
      div.style.marginBottom = '8px';
      div.style.borderLeft = item.status === 'Yes' ? '4px solid #10b981' : '4px solid #ef4444';
      
      div.innerHTML = `
        <div style="font-weight:bold; margin-bottom:4px;">${item.location}</div>
        <div style="font-size:13px; color:var(--muted);">
          <div>Type: ${item.pumpType} | Status: <strong>${item.status}</strong></div>
          <div>Users: ${item.users || '-'} | GPS: ${item.gps}</div>
          <div style="margin-top:4px; font-size:12px;">${item.notes || 'No notes'}</div>
        </div>
      `;
      resultsList.appendChild(div);
    });
  }

  // 5. Export Logic
  exportBtn.addEventListener('click', () => {
    const data = store.get('waterSurveyData', []);
    if (data.length === 0) {
      alert('No data to export.');
      return;
    }

    const jsonString = JSON.stringify(data, null, 2);
    const csvString = toCSV(data);
    
    // Download JSON
    download('water_survey.json', jsonString, 'application/json');
    
    // Download CSV
    download('water_survey.csv', csvString, 'text/csv');
  });
});
</script>
</body></html>
