<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Expense Tracker</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Field Expense Tracker</h1></header>
<main>
<div class="grid">
  <div class="card">
    <h2 style="margin:0 0 10px 0">Add Expense</h2>
    <form id="expenseForm">
      <label>Date</label>
      <input type="date" id="date" required>
      <label>Head</label>
      <input type="text" id="head" placeholder="e.g. Transport, Lodging" list="headSuggestions" required>
      <datalist id="headSuggestions"></datalist>
      <label>Amount</label>
      <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
      <div style="margin-top:12px">
        <button type="submit">Add Entry</button>
        <button type="button" class="secondary" id="exportBtn" style="margin-left:8px">Export CSV</button>
      </div>
    </form>
  </div>
  <div class="card">
    <h2 style="margin:0 0 10px 0">Summary</h2>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div>
        <div class="muted">Total Expenses</div>
        <div style="font-size:24px;font-weight:bold" id="totalDisplay">0.00</div>
      </div>
      <div>
        <div class="muted">Entries</div>
        <div style="font-size:24px;font-weight:bold" id="countDisplay">0</div>
      </div>
    </div>
    <div style="margin-top:16px">
      <div class="muted" style="margin-bottom:4px">Breakdown by Head</div>
      <div id="breakdownList"></div>
    </div>
  </div>
</div>
<div class="card">
  <h2 style="margin:0 0 10px 0">Recent Entries</h2>
  <table id="expenseTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Head</th>
        <th>Amount</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="expenseBody"></tbody>
  </table>
  <div id="emptyState" class="muted" style="text-align:center;padding:20px;display:none">No expenses recorded yet.</div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
(function() {
  const STORAGE_KEY = 'field_expenses_v1';
  const form = document.getElementById('expenseForm');
  const dateInput = document.getElementById('date');
  const headInput = document.getElementById('head');
  const amountInput = document.getElementById('amount');
  const expenseBody = document.getElementById('expenseBody');
  const totalDisplay = document.getElementById('totalDisplay');
  const countDisplay = document.getElementById('countDisplay');
  const breakdownList = document.getElementById('breakdownList');
  const emptyState = document.getElementById('emptyState');
  const exportBtn = document.getElementById('exportBtn');
  const headSuggestions = document.getElementById('headSuggestions');

  // Set default date to today
  dateInput.valueAsDate = new Date();

  function getExpenses() {
    return store.get(STORAGE_KEY, []);
  }

  function saveExpenses(expenses) {
    store.set(STORAGE_KEY, expenses);
  }

  function formatCurrency(amount) {
    return parseFloat(amount).toFixed(2);
  }

  function updateUI() {
    const expenses = getExpenses();
    
    // Sort by date descending
    expenses.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    // Calculate totals
    const total = expenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
    const count = expenses.length;
    
    // Update summary
    totalDisplay.textContent = formatCurrency(total);
    countDisplay.textContent = count;
    
    // Calculate breakdown by head
    const breakdown = {};
    expenses.forEach(e => {
      const head = e.head;
      if (!breakdown[head]) {
        breakdown[head] = 0;
      }
      breakdown[head] += parseFloat(e.amount);
    });
    
    // Update breakdown list
    breakdownList.innerHTML = '';
    const sortedHeads = Object.keys(breakdown).sort((a, b) => breakdown[b] - breakdown[a]);
    sortedHeads.forEach(head => {
      const div = document.createElement('div');
      div.className = 'row';
      div.style.justifyContent = 'space-between';
      div.style.padding = '4px 0';
      div.innerHTML = `<span>${head}</span><span>${formatCurrency(breakdown[head])}</span>`;
      breakdownList.appendChild(div);
    });
    
    // Update table
    expenseBody.innerHTML = '';
    if (expenses.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      expenses.forEach((expense, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${expense.date}</td>
          <td>${expense.head}</td>
          <td>${formatCurrency(expense.amount)}</td>
          <td><button type="button" class="secondary delete-btn" data-index="${index}">Delete</button></td>
        `;
        expenseBody.appendChild(tr);
      });
    }
    
    // Update suggestions
    const uniqueHeads = [...new Set(expenses.map(e => e.head))];
    headSuggestions.innerHTML = '';
    uniqueHeads.forEach(head => {
      const option = document.createElement('option');
      option.value = head;
      headSuggestions.appendChild(option);
    });
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const date = dateInput.value;
    const head = headInput.value.trim();
    const amount = parseFloat(amountInput.value);
    
    if (!date || !head || isNaN(amount) || amount <= 0) {
      return;
    }
    
    const expenses = getExpenses();
    expenses.push({
      date: date,
      head: head,
      amount: amount
    });
    
    saveExpenses(expenses);
    
    // Reset form
    headInput.value = '';
    amountInput.value = '';
    dateInput.valueAsDate = new Date();
    
    updateUI();
  });

  expenseBody.addEventListener('click', function(e) {
    if (e.target.classList.contains('delete-btn')) {
      const index = parseInt(e.target.dataset.index);
      const expenses = getExpenses();
      expenses.splice(index, 1);
      saveExpenses(expenses);
      updateUI();
    }
  });

  exportBtn.addEventListener('click', function() {
    const expenses = getExpenses();
    if (expenses.length === 0) {
      alert('No expenses to export.');
      return;
    }
    const csv = toCSV(expenses);
    download('expenses.csv', csv, 'text/csv');
  });

  // Initial render
  updateUI();
})();
</script>
</body></html>
