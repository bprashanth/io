<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Point Survey</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Water Point Survey</h1></header>
<main>
<div class="card">
  <form id="surveyForm">
    <div class="grid">
      <div>
        <label for="habitation">Habitation / Village</label>
        <input id="habitation" name="habitation" required placeholder="Enter village name">
      </div>
      <div>
        <label for="pumpType">Pump Type</label>
        <select id="pumpType" name="pumpType">
          <option value="Hand Pump">Hand Pump</option>
          <option value="Borewell">Borewell</option>
          <option value="Tap Stand">Tap Stand</option>
          <option value="Well">Open Well</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="grid">
      <div>
        <label for="workingStatus">Working Status</label>
        <select id="workingStatus" name="workingStatus">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <div>
        <label for="users">Estimated Users</label>
        <input id="users" name="users" type="number" min="0" placeholder="Number of people">
      </div>
    </div>
    <div>
      <label for="gps">GPS Location</label>
      <div class="row">
        <input id="gps" name="gps" type="text" readonly placeholder="Tap 'Get Location' to capture GPS" required>
        <button type="button" id="btnLoc" class="secondary">Get Location</button>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button type="submit">Save Response</button>
      <button type="button" id="btnExport" class="secondary">Export JSON</button>
      <button type="button" id="btnClear" class="secondary" style="color:var(--muted);border-color:var(--line)">Clear Form</button>
    </div>
  </form>
</div>

<div class="card">
  <h2 style="margin:0 0 10px 0;font-size:18px">Saved Responses</h2>
  <div id="status" class="muted" style="margin-bottom:10px">No responses saved yet.</div>
  <div style="overflow-x:auto">
    <table id="responsesTable">
      <thead>
        <tr>
          <th>Habitation</th>
          <th>Pump Type</th>
          <th>Status</th>
          <th>Users</th>
          <th>GPS</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody id="responsesBody"></tbody>
    </table>
  </div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
(function() {
  const STORAGE_KEY = 'water_survey_responses';
  const form = document.getElementById('surveyForm');
  const gpsInput = document.getElementById('gps');
  const btnLoc = document.getElementById('btnLoc');
  const btnExport = document.getElementById('btnExport');
  const btnClear = document.getElementById('btnClear');
  const tbody = document.getElementById('responsesBody');
  const statusDiv = document.getElementById('status');

  function getResponses() {
    return store.get(STORAGE_KEY, []);
  }

  function saveResponse(data) {
    const responses = getResponses();
    responses.push(data);
    store.set(STORAGE_KEY, responses);
    renderTable();
  }

  function renderTable() {
    const responses = getResponses();
    tbody.innerHTML = '';
    if (responses.length === 0) {
      statusDiv.textContent = 'No responses saved yet.';
      return;
    }
    statusDiv.textContent = `${responses.length} response(s) saved locally.`;
    responses.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(r.habitation)}</td>
        <td>${escapeHtml(r.pumpType)}</td>
        <td>${escapeHtml(r.workingStatus)}</td>
        <td>${escapeHtml(r.users)}</td>
        <td><a href="https://maps.google.com/?q=${r.gps}" target="_blank" style="color:var(--accent)">${escapeHtml(r.gps)}</a></td>
        <td class="muted">${new Date(r.timestamp).toLocaleString()}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(text) {
    if (text == null) return '';
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(String(text)));
    return div.innerHTML;
  }

  function getGeolocation() {
    if (!navigator.geolocation) {
      alert('Geolocation is not supported by your browser.');
      return;
    }
    btnLoc.textContent = 'Locating...';
    btnLoc.disabled = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        gpsInput.value = `${pos.coords.latitude},${pos.coords.longitude}`;
        btnLoc.textContent = 'Get Location';
        btnLoc.disabled = false;
      },
      (err) => {
        alert('Unable to retrieve location. Please check permissions.');
        btnLoc.textContent = 'Get Location';
        btnLoc.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  btnLoc.addEventListener('click', getGeolocation);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const data = {
      habitation: formData.get('habitation'),
      pumpType: formData.get('pumpType'),
      workingStatus: formData.get('workingStatus'),
      users: formData.get('users'),
      gps: formData.get('gps'),
      timestamp: new Date().toISOString()
    };

    if (!data.gps) {
      alert('Please capture GPS location before submitting.');
      return;
    }

    saveResponse(data);
    form.reset();
    gpsInput.value = '';
    btnLoc.textContent = 'Get Location';
    alert('Response saved successfully!');
  });

  btnClear.addEventListener('click', () => {
    form.reset();
    gpsInput.value = '';
  });

  btnExport.addEventListener('click', () => {
    const responses = getResponses();
    if (responses.length === 0) {
      alert('No data to export.');
      return;
    }
    const jsonStr = JSON.stringify(responses, null, 2);
    download('water_survey_data.json', jsonStr, 'application/json');
  });

  // Initial render
  renderTable();
  offlineReady();
})();
</script>
</body></html>
