<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beneficiary Registration</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.error-msg{color:#dc2626;font-size:12px;margin-top:4px;display:none;} input.invalid, select.invalid { border-color: #dc2626; }
</style></head><body>
<header><h1>Beneficiary Registration</h1></header>
<main>
<div class="card">
    <form id="regForm">
        <div class="grid">
            <div>
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter full name">
                <div class="error-msg" id="err-name">Name is required</div>
            </div>
            <div>
                <label for="age">Age</label>
                <input type="number" id="age" min="0" max="120" required placeholder="Age">
                <div class="error-msg" id="err-age">Valid age (0-120) is required</div>
            </div>
            <div>
                <label for="village">Village</label>
                <input type="text" id="village" required placeholder="Village name">
                <div class="error-msg" id="err-village">Village is required</div>
            </div>
            <div>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="Mobile number">
                <div class="error-msg" id="err-phone">Phone is required</div>
            </div>
            <div>
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="General">General</option>
                    <option value="Senior Citizen">Senior Citizen</option>
                    <option value="Disabled">Disabled</option>
                    <option value="Widow">Widow</option>
                    <option value="Child">Child</option>
                </select>
                <div class="error-msg" id="err-category">Please select a category</div>
            </div>
        </div>
        <div style="margin-top:16px; display:flex; gap:10px;">
            <button type="submit">Register Beneficiary</button>
            <button type="button" class="secondary" onclick="resetForm()">Clear Form</button>
        </div>
    </form>
</div>

<div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0; font-size:18px;">Registered Beneficiaries</h3>
        <button type="button" class="secondary" onclick="downloadCSV()">Download CSV</button>
    </div>
    <div style="overflow-x:auto;">
        <table id="beneficiaryTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Village</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows injected here -->
            </tbody>
        </table>
    </div>
    <p id="emptyMsg" class="muted" style="text-align:center; padding:20px;">No beneficiaries registered yet.</p>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
const STORAGE_KEY = 'beneficiaries_data';
let beneficiaries = store.get(STORAGE_KEY, []);

const form = document.getElementById('regForm');
const tableBody = document.getElementById('tableBody');
const emptyMsg = document.getElementById('emptyMsg');

function renderTable() {
    tableBody.innerHTML = '';
    if (beneficiaries.length === 0) {
        emptyMsg.style.display = 'block';
    } else {
        emptyMsg.style.display = 'none';
        beneficiaries.forEach((b, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(b.name)}</td>
                <td>${b.age}</td>
                <td>${escapeHtml(b.village)}</td>
                <td>${escapeHtml(b.phone)}</td>
                <td>${escapeHtml(b.category)}</td>
                <td><button type="button" class="secondary" style="padding:4px 8px; font-size:12px;" onclick="deleteBeneficiary(${index})">Delete</button></td>
            `;
            tableBody.appendChild(tr);
        });
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showError(id, show) {
    const el = document.getElementById(id);
    const input = el.previousElementSibling;
    if (show) {
        el.style.display = 'block';
        input.classList.add('invalid');
    } else {
        el.style.display = 'none';
        input.classList.remove('invalid');
    }
}

form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('name').value.trim();
    const age = document.getElementById('age').value;
    const village = document.getElementById('village').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const category = document.getElementById('category').value;

    let isValid = true;

    if (!name) { showError('err-name', true); isValid = false; } else { showError('err-name', false); }
    if (!age || isNaN(age) || age < 0 || age > 120) { showError('err-age', true); isValid = false; } else { showError('err-age', false); }
    if (!village) { showError('err-village', true); isValid = false; } else { showError('err-village', false); }
    if (!phone) { showError('err-phone', true); isValid = false; } else { showError('err-phone', false); }
    if (!category) { showError('err-category', true); isValid = false; } else { showError('err-category', false); }

    if (isValid) {
        const newEntry = {
            id: Date.now(),
            name,
            age: parseInt(age),
            village,
            phone,
            category,
            registeredAt: new Date().toISOString()
        };
        beneficiaries.push(newEntry);
        store.set(STORAGE_KEY, beneficiaries);
        renderTable();
        resetForm();
    }
});

function resetForm() {
    form.reset();
    document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
    document.querySelectorAll('input, select').forEach(el => el.classList.remove('invalid'));
}

window.deleteBeneficiary = function(index) {
    if(confirm('Are you sure you want to delete this entry?')) {
        beneficiaries.splice(index, 1);
        store.set(STORAGE_KEY, beneficiaries);
        renderTable();
    }
};

window.downloadCSV = function() {
    if (beneficiaries.length === 0) {
        alert('No data to download.');
        return;
    }
    // Map to simple keys for CSV
    const csvData = beneficiaries.map(b => ({
        Name: b.name,
        Age: b.age,
        Village: b.village,
        Phone: b.phone,
        Category: b.category,
        Registered: new Date(b.registeredAt).toLocaleDateString()
    }));
    const csvText = toCSV(csvData);
    download('beneficiaries.csv', csvText, 'text/csv');
};

// Initial render
renderTable();
offlineReady();
</script>
</body></html>
