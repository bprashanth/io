<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship Scheme Progress — District Wise</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Scholarship Scheme Progress — District Wise</h1></header>
<main>
  <div class="card">
    <div class="grid" id="summary"></div>
  </div>

  <div class="card">
    <div class="row">
      <div style="flex:1;min-width:160px"><label for="fDistrict">District</label><select id="fDistrict"><option value="">All districts</option></select></div>
      <div style="flex:1;min-width:160px"><label for="fStatus">Status</label><select id="fStatus"><option value="">All statuses</option></select></div>
      <div style="flex:1;min-width:160px"><label for="fScheme">Scheme</label><select id="fScheme"><option value="">All schemes</option></select></div>
      <div style="flex:1;min-width:160px"><label for="fSearch">Search name</label><input id="fSearch" type="text" placeholder="Type a name…"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnReset" class="secondary">Reset filters</button>
      <button id="btnCSV">Export CSV</button>
      <button id="btnJSON">Export JSON</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px;font-size:18px">District-wise progress</h2>
    <div id="districts"></div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px;font-size:18px">Pending cases</h2>
    <p class="muted" id="pendingNote" style="margin:0 0 10px"></p>
    <div style="overflow-x:auto"><table id="pendingTable"></table></div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px;font-size:18px">All applications</h2>
    <div style="overflow-x:auto"><table id="allTable"></table></div>
  </div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
offlineReady();

const DATA = (typeof window.data === 'undefined' || !Array.isArray(window.data)) ? [] : window.data;
const COLS = ['District', 'Taluka', 'Status', 'Marks %', 'Family Income', 'Name of scheme'];
const PENDING = 'Pending';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const isPending = r => String(r.Status || '').trim().toLowerCase() === PENDING.toLowerCase();
const uniq = arr => Array.from(new Set(arr.filter(v => v != null && String(v).trim() !== ''))).sort((a, b) => String(a).localeCompare(String(b)));

function statusBadge(s) {
  const t = String(s || '').trim().toLowerCase();
  let color = '#6b7280', bg = '#f3f4f6';
  if (t === 'approved' || t === 'sanctioned' || t === 'disbursed' || t === 'completed') { color = '#15803d'; bg = '#dcfce7'; }
  else if (t === 'rejected' || t === 'cancelled' || t === 'declined') { color = '#b91c1c'; bg = '#fee2e2'; }
  else if (t === 'pending' || t === 'in review' || t === 'under review' || t === 'processing') { color = '#b45309'; bg = '#fef3c7'; }
  return '<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:' + bg + ';color:' + color + '">' + esc(s) + '</span>';
}

function statCard(label, value, sub) {
  return '<div class="card" style="margin:0"><div class="muted" style="font-size:13px">' + esc(label) + '</div><div style="font-size:28px;font-weight:700">' + esc(value) + '</div>' + (sub ? '<div class="muted" style="font-size:12px">' + esc(sub) + '</div>' : '') + '</div>';
}

function renderSummary() {
  const total = DATA.length;
  const pending = DATA.filter(isPending).length;
  const approved = DATA.filter(r => { const t = String(r.Status || '').trim().toLowerCase(); return t === 'approved' || t === 'sanctioned' || t === 'disbursed' || t === 'completed'; }).length;
  const districts = uniq(DATA.map(r => r.District)).length;
  const schemes = uniq(DATA.map(r => r['Name of scheme'])).length;
  $('summary').innerHTML =
    statCard('Total applications', total, 'across ' + districts + ' districts') +
    statCard('Pending cases', pending, pct(pending, total) + '% of total') +
    statCard('Approved / disbursed', approved, pct(approved, total) + '% of total') +
    statCard('Schemes covered', schemes, 'distinct schemes');
}

function renderDistricts() {
  const groups = {};
  DATA.forEach(r => { const d = String(r.District || '—'); (groups[d] = groups[d] || []).push(r); });
  const names = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  if (!names.length) { $('districts').innerHTML = '<p class="muted">No data available.</p>'; return; }
  let html = '<table><thead><tr><th>District</th><th>Total</th><th>Pending</th><th>Approved</th><th>Progress</th></tr></thead><tbody>';
  names.forEach(d => {
    const rows = groups[d];
    const p = rows.filter(isPending).length;
    const a = rows.filter(r => { const t = String(r.Status || '').trim().toLowerCase(); return t === 'approved' || t === 'sanctioned' || t === 'disbursed' || t === 'completed'; }).length;
    const prog = pct(a, rows.length);
    html += '<tr><td><strong>' + esc(d) + '</strong></td><td>' + rows.length + '</td><td>' + p + '</td><td>' + a + '</td>' +
      '<td style="min-width:120px"><div style="background:#eef2ff;border-radius:6px;height:10px;overflow:hidden"><div style="height:100%;width:' + prog + '%;background:var(--accent)"></div></div><span class="muted" style="font-size:12px">' + prog + '%</span></td></tr>';
  });
  html += '</tbody></table>';
  $('districts').innerHTML = html;
}

function fillSelect(sel, values) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">All</option>' + values.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
  if (values.includes(cur)) sel.value = cur;
}

function applyFilters() {
  const d = $('fDistrict').value, s = $('fStatus').value, sc = $('fScheme').value, q = $('fSearch').value.trim().toLowerCase();
  return DATA.filter(r =>
    (!d || String(r.District) === d) &&
    (!s || String(r.Status) === s) &&
    (!sc || String(r['Name of scheme']) === sc) &&
    (!q || String(r['Name of scheme'] || '').toLowerCase().includes(q) || String(r.Taluka || '').toLowerCase().includes(q))
  );
}

function renderTables() {
  const filtered = applyFilters();
  const pending = filtered.filter(isPending);
  $('pendingNote').textContent = pending.length + ' pending case(s) matching current filters.';
  const head = '<thead><tr>' + COLS.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead>';
  const body = rows => rows.length ? '<tbody>' + rows.map(r => '<tr>' + COLS.map(c => '<td>' + esc(r[c]) + '</td>').join('') + '</tr>').join('') + '</tbody>' : '<tbody><tr><td colspan="' + COLS.length + '" class="muted">No records.</td></tr></tbody>';
  $('pendingTable').innerHTML = head + body(pending);
  $('allTable').innerHTML = head + body(filtered);
}

function init() {
  renderSummary();
  renderDistricts();
  fillSelect($('fDistrict'), uniq(DATA.map(r => r.District)));
  fillSelect($('fStatus'), uniq(DATA.map(r => r.Status)));
  fillSelect($('fScheme'), uniq(DATA.map(r => r['Name of scheme'])));
  renderTables();

  ['fDistrict', 'fStatus', 'fScheme'].forEach(id => $(id).addEventListener('change', renderTables));
  $('fSearch').addEventListener('input', renderTables);
  $('btnReset').addEventListener('click', () => { $('fDistrict').value = ''; $('fStatus').value = ''; $('fScheme').value = ''; $('fSearch').value = ''; renderTables(); });
  $('btnCSV').addEventListener('click', () => { const rows = applyFilters(); download('scholarship-progress.csv', toCSV(rows.map(r => { const o = {}; COLS.forEach(c => o[c] = r[c]); return o; })), 'text/csv'); });
  $('btnJSON').addEventListener('click', () => { download('scholarship-progress.json', JSON.stringify(applyFilters(), null, 2), 'application/json'); });
}

init();
</script>
</body></html>
