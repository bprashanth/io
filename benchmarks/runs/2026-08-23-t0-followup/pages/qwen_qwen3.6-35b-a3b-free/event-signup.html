<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Camp Signup - 14 September</title>
    <style>
        :root {
            --primary: #2c7a7b; /* Teal */
            --primary-dark: #234e52;
            --accent: #e6fffa;
            --text: #2d3748;
            --bg: #f7fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --danger: #e53e3e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Countdown */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .time-box {
            background: var(--primary);
            color: var(--white);
            padding: 15px;
            border-radius: 8px;
            min-width: 80px;
            text-align: center;
        }

        .time-val {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-dark);
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Form */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .status-msg {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .success { color: #38a169; }
        .error { color: var(--danger); }

        /* List */
        .signup-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .signup-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.3s ease-in;
        }

        .signup-item:last-child {
            border-bottom: none;
        }

        .user-info strong {
            display: block;
            color: var(--text);
        }

        .user-info span {
            font-size: 0.85rem;
            color: #718096;
        }

        .delete-btn {
            background: transparent;
            color: #cbd5e0;
            width: auto;
            padding: 5px;
            font-size: 1.2rem;
        }

        .delete-btn:hover {
            color: var(--danger);
            background: transparent;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 20px;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Community Health Camp</h1>
        <div class="subtitle">Free checkups, vaccinations, and health education.</div>
        <div style="font-weight: bold; font-size: 1.2rem; color: var(--primary);">14 September</div>
        
        <div class="countdown-container" id="countdown">
            <div class="time-box">
                <span class="time-val" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="minutes">00</span>
                <span class="time-label">Mins</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="seconds">00</span>
                <span class="time-label">Secs</span>
            </div>
        </div>
    </header>

    <div class="content-grid">
        <!-- Signup Form -->
        <div class="card">
            <h2>Register Now</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. Jane Doe">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="e.g. 555-0123">
                </div>
                <div class="form-group">
                    <label for="service">Service Needed</label>
                    <select id="service">
                        <option value="General Checkup">General Checkup</option>
                        <option value="Dental">Dental Care</option>
                        <option value="Eye Test">Eye Test</option>
                        <option value="Vaccination">Vaccination</option>
                    </select>
                </div>
                <button type="submit">Confirm Signup</button>
                <div id="formStatus" class="status-msg"></div>
            </form>
        </div>

        <!-- Attendee List -->
        <div class="card">
            <h2>Attendees (<span id="count">0</span>)</h2>
            <ul class="signup-list" id="listContainer">
                <!-- Items injected here -->
            </ul>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- Data Handling ---
        // If window.data is provided, use it. Otherwise initialize empty.
        // We expect window.data to be an array of objects: { name, phone, service, id }
        let attendees = [];
        
        if (window.data && Array.isArray(window.data)) {
            attendees = window.data;
        }

        // --- DOM Elements ---
        const form = document.getElementById('signupForm');
        const listContainer = document.getElementById('listContainer');
        const countSpan = document.getElementById('count');
        const statusMsg = document.getElementById('formStatus');
        
        // --- Countdown Logic ---
        function updateCountdown() {
            const now = new Date();
            // Target: September 14 of the current year
            let targetYear = now.getFullYear();
            let targetDate = new Date(`September 14, ${targetYear} 09:00:00`);

            // If date has passed this year, target next year
            if (now > targetDate) {
                targetDate = new Date(`September 14, ${targetYear + 1} 09:00:00`);
            }

            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call

        // --- Rendering ---
        function renderList() {
            listContainer.innerHTML = '';
            countSpan.innerText = attendees.length;

            if (attendees.length === 0) {
                listContainer.innerHTML = '<li class="empty-state">No one has signed up yet.</li>';
                return;
            }

            // Show newest first
            const reversed = [...attendees].reverse();

            reversed.forEach(person => {
                const li = document.createElement('li');
                li.className = 'signup-item';
                li.innerHTML = `
                    <div class="user-info">
                        <strong>${escapeHtml(person.name)}</strong>
                        <span>${escapeHtml(person.service)}</span>
                    </div>
                    <button class="delete-btn" onclick="window.removeAttendee('${person.id}')" title="Remove">&times;</button>
                `;
                listContainer.appendChild(li);
            });
        }

        // --- Form Handling ---
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('name');
            const phoneInput = document.getElementById('phone');
            const serviceInput = document.getElementById('service');

            const newAttendee = {
                id: Date.now().toString(), // Simple unique ID
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim(),
                service: serviceInput.value
            };

            // Add to data
            attendees.push(newAttendee);
            
            // Update UI
            renderList();
            
            // Reset Form
            form.reset();
            statusMsg.innerText = "Successfully registered!";
            statusMsg.className = "status-msg success";
            
            setTimeout(() => {
                statusMsg.innerText = "";
            }, 3000);
        });

        // --- Global Functions (for inline HTML onclick) ---
        window.removeAttendee = function(id) {
            if(confirm('Remove this person from the list?')) {
                attendees = attendees.filter(p => p.id !== id);
                renderList();
            }
        };

        // --- Utilities ---
        function escapeHtml(text) {
            if (!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initial Render
        renderList();

    })();
</script>

</body>
</html>
