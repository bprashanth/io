<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Scheme Progress</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #27ae60;
            --warning: #e67e22;
            --danger: #c0392b;
            --light: #ecf0f1;
            --white: #ffffff;
            --border: #bdc3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background-color: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .status-badge {
            background-color: var(--light);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        /* Dashboard Cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .card.pending { border-left-color: var(--warning); }
        .card.pending .value { color: var(--warning); }
        
        .card.approved { border-left-color: var(--accent); }
        .card.approved .value { color: var(--accent); }

        /* Controls */
        .controls {
            background: var(--white);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        input[type="text"] {
            flex-grow: 1;
        }

        /* Table */
        .table-container {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--light);
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: var(--secondary);
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #e9ecef;
        }

        tr:hover {
            background-color: #f1f2f6;
        }

        /* Status Colors */
        .status-pill {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background-color: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        /* Loading State */
        #loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--secondary);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .controls {
                flex-direction: column;
            }
            input[type="text"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Scholarship Scheme Progress</h1>
        <div class="status-badge" id="data-status">Initializing...</div>
    </header>

    <div id="loading">Loading data...</div>

    <div id="main-content" style="display: none;">
        <!-- Summary Cards -->
        <div class="dashboard">
            <div class="card">
                <h3>Total Applications</h3>
                <div class="value" id="total-count">0</div>
            </div>
            <div class="card approved">
                <h3>Approved</h3>
                <div class="value" id="approved-count">0</div>
            </div>
            <div class="card pending">
                <h3>Pending Cases</h3>
                <div class="value" id="pending-count">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search by Name, District, or Scheme...">
            <select id="district-filter">
                <option value="">All Districts</option>
            </select>
            <select id="status-filter">
                <option value="">All Statuses</option>
                <option value="Pending">Pending Only</option>
                <option value="Approved">Approved Only</option>
                <option value="Rejected">Rejected Only</option>
            </select>
        </div>

        <!-- Data Table -->
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Name</th>
                        <th onclick="sortTable(1)">District</th>
                        <th onclick="sortTable(2)">Taluka</th>
                        <th onclick="sortTable(3)">Scheme</th>
                        <th onclick="sortTable(4)">Marks %</th>
                        <th onclick="sortTable(5)">Family Income</th>
                        <th onclick="sortTable(6)">Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
            <div id="no-results" class="empty-state" style="display: none;">
                No records found matching your criteria.
            </div>
        </div>
    </div>
</div>

<script>
    // Global state
    let appData = [];
    let filteredData = [];
    let sortDirection = 1; // 1 for asc, -1 for desc

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        if (window.data && Array.isArray(window.data)) {
            appData = window.data;
            initializeDashboard();
        } else {
            document.getElementById('loading').innerHTML = `
                <div style="color: var(--danger);">
                    <strong>Error:</strong> Data not found.<br>
                    Please ensure <code>window.data</code> is defined as an array of objects.
                </div>
            `;
        }
    });

    function initializeDashboard() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('data-status').textContent = `Loaded ${appData.length} records`;

        populateDistrictFilter();
        applyFilters();
        setupEventListeners();
    }

    function populateDistrictFilter() {
        const select = document.getElementById('district-filter');
        const districts = [...new Set(appData.map(item => item.District))].sort();
        
        districts.forEach(district => {
            const option = document.createElement('option');
            option.value = district;
            option.textContent = district;
            select.appendChild(option);
        });
    }

    function setupEventListeners() {
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('district-filter').addEventListener('change', applyFilters);
        document.getElementById('status-filter').addEventListener('change', applyFilters);
    }

    function applyFilters() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const districtVal = document.getElementById('district-filter').value;
        const statusVal = document.getElementById('status-filter').value;

        filteredData = appData.filter(row => {
            const matchesSearch = 
                (row.Name || '').toLowerCase().includes(searchTerm) ||
                (row.District || '').toLowerCase().includes(searchTerm) ||
                (row['Name of scheme'] || '').toLowerCase().includes(searchTerm);
            
            const matchesDistrict = districtVal ? row.District === districtVal : true;
            const matchesStatus = statusVal ? row.Status === statusVal : true;

            return matchesSearch && matchesDistrict && matchesStatus;
        });

        updateStats();
        renderTable();
    }

    function updateStats() {
        const total = appData.length;
        const approved = appData.filter(r => r.Status === 'Approved').length;
        const pending = appData.filter(r => r.Status === 'Pending').length;

        document.getElementById('total-count').textContent = total;
        document.getElementById('approved-count').textContent = approved;
        document.getElementById('pending-count').textContent = pending;
    }

    function renderTable() {
        const tbody = document.getElementById('table-body');
        const noResults = document.getElementById('no-results');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            noResults.style.display = 'block';
            return;
        } else {
            noResults.style.display = 'none';
        }

        filteredData.forEach(row => {
            const tr = document.createElement('tr');
            
            // Determine status class
            let statusClass = 'status-pending';
            if (row.Status === 'Approved') statusClass = 'status-approved';
            if (row.Status === 'Rejected') statusClass = 'status-rejected';

            tr.innerHTML = `
                <td><strong>${escapeHtml(row.Name || 'N/A')}</strong></td>
                <td>${escapeHtml(row.District || 'N/A')}</td>
                <td>${escapeHtml(row.Taluka || 'N/A')}</td>
                <td>${escapeHtml(row['Name of scheme'] || 'N/A')}</td>
                <td>${row['Marks %'] !== undefined ? row['Marks %'] + '%' : 'N/A'}</td>
                <td>${row['Family Income'] !== undefined ? row['Family Income'] : 'N/A'}</td>
                <td><span class="status-pill ${statusClass}">${escapeHtml(row.Status || 'Unknown')}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function sortTable(columnIndex) {
        const keys = ['Name', 'District', 'Taluka', 'Name of scheme', 'Marks %', 'Family Income', 'Status'];
        const key = keys[columnIndex];

        filteredData.sort((a, b) => {
            let valA = a[key];
            let valB = b[key];

            // Handle undefined/null
            if (valA === null || valA === undefined) valA = '';
            if (valB === null || valB === undefined) valB = '';

            // Numeric sort for Marks and Income
            if (key === 'Marks %' || key === 'Family Income') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
                return (valA - valB) * sortDirection;
            }

            // String sort
            valA = String(valA).toLowerCase();
            valB = String(valB).toLowerCase();
            
            if (valA < valB) return -1 * sortDirection;
            if (valA > valB) return 1 * sortDirection;
            return 0;
        });

        sortDirection *= -1;
        renderTable();
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
