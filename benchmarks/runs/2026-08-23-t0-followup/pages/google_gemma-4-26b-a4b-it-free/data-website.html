<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Scheme Progress Report</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --text: #333;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--secondary);
        }

        .card .value {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        .table-container {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--primary);
            color: var(--white);
            padding: 12px 15px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-completed { background: #d4edda; color: #155724; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .district-row {
            background-color: #f8f9fa;
            font-weight: bold;
            color: var(--primary);
        }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="page-title">Scholarship Scheme Progress</h1>
    </header>

    <div id="dashboard-content" style="display: none;">
        <div class="summary-grid">
            <div class="card">
                <h3>Total Applications</h3>
                <span id="stat-total" class="value">0</span>
            </div>
            <div class="card">
                <h3>Completed</h3>
                <span id="stat-completed" class="value" style="color: var(--success);">0</span>
            </div>
            <div class="card">
                <h3>Pending Cases</h3>
                <span id="stat-pending" class="value" style="color: var(--warning);">0</span>
            </div>
            <div class="card">
                <h3>Rejected</h3>
                <span id="stat-rejected" class="value" style="color: var(--danger);">0</span>
            </div>
        </div>

        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>District</th>
                        <th>Taluka</th>
                        <th>Scheme Name</th>
                        <th>Marks %</th>
                        <th>Family Income</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="error-container" class="error-msg" style="display: none;">
        No data available. Please ensure window.data is populated.
    </div>

    <div id="empty-container" class="no-data" style="display: none;">
        No records found in the dataset.
    </div>
</div>

<script>
    (function() {
        function init() {
            const data = window.data;

            if (!data || !Array.isArray(data) || data.length === 0) {
                document.getElementById('error-container').style.display = 'block';
                return;
            }

            renderDashboard(data);
        }

        function renderDashboard(data) {
            const tbody = document.getElementById('table-body');
            const statTotal = document.getElementById('stat-total');
            const statCompleted = document.getElementById('stat-completed');
            const statPending = document.getElementById('stat-pending');
            const statRejected = document.getElementById('stat-rejected');

            let counts = {
                total: data.length,
                completed: 0,
                pending: 0,
                rejected: 0
            };

            // Sort data by District then Taluka
            const sortedData = [...data].sort((a, b) => {
                if (a.District < b.District) return -1;
                if (a.District > b.District) return 1;
                if (a.Taluka < b.Taluka) return -1;
                if (a.Taluka > b.Taluka) return 1;
                return 0;
            });

            tbody.innerHTML = '';
            let lastDistrict = null;

            sortedData.forEach(row => {
                // Update counts
                const status = String(row.Status).toLowerCase();
                if (status.includes('complete') || status.includes('approved') || status.includes('success')) {
                    counts.completed++;
                } else if (status.includes('pend') || status.includes('wait')) {
                    counts.pending++;
                } else if (status.includes('reject') || status.includes('fail')) {
                    counts.rejected++;
                }

                // District grouping row
                if (row.District !== lastDistrict) {
                    const dRow = document.createElement('tr');
                    dRow.className = 'district-row';
                    dRow.innerHTML = `<td colspan="6">${row.District}</td>`;
                    tbody.appendChild(dRow);
                    lastDistrict = row.District;
                }

                // Data row
                const tr = document.createElement('tr');
                
                // Status CSS class
                let statusClass = '';
                const s = String(row.Status).toLowerCase();
                if (s.includes('complete') || s.includes('approved')) statusClass = 'status-completed';
                else if (s.includes('pend')) statusClass = 'status-pending';
                else if (s.includes('reject')) statusClass = 'status-rejected';

                tr.innerHTML = `
                    <td>${row.District}</td>
                    <td>${row.Taluka}</td>
                    <td>${row['Name of scheme']}</td>
                    <td>${row['Marks %']}%</td>
                    <td>${row['Family Income']}</td>
                    <td><span class="status-pill ${statusClass}">${row.Status}</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Update Stats
            statTotal.textContent = counts.total;
            statCompleted.textContent = counts.completed;
            statPending.textContent = counts.pending;
            statRejected.textContent = counts.rejected;

            // Show content
            document.getElementById('dashboard-content').style.display = 'block';
        }

        // Run on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>

</body>
</html>
