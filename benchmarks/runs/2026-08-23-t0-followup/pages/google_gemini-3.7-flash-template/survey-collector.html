<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Point Survey</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Water Point Survey</h1></header>
<main>
<form id="survey-form" class="card">
  <div class="grid">
    <div>
      <label for="habitation">Habitation / Village Name *</label>
      <input type="text" id="habitation" required placeholder="e.g., Rampur Ward 4">
    </div>
    <div>
      <label for="pumpType">Pump / Source Type *</label>
      <select id="pumpType" required>
        <option value="">-- Select Type --</option>
        <option value="Handpump (India Mark II)">Handpump (India Mark II)</option>
        <option value="Handpump (Afridev)">Handpump (Afridev)</option>
        <option value="Solar Submersible Pump">Solar Submersible Pump</option>
        <option value="Electric Borewell Pump">Electric Borewell Pump</option>
        <option value="Piped Water Tap Stand">Piped Water Tap Stand</option>
        <option value="Open Well with Pulley">Open Well with Pulley</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div>
      <label for="isWorking">Functional Status *</label>
      <select id="isWorking" required>
        <option value="Yes">Working / Functional</option>
        <option value="No">Not Working / Breakdown</option>
        <option value="Partial">Partially Functional</option>
      </select>
    </div>
    <div>
      <label for="users">Estimated Dependent Users (Households/People) *</label>
      <input type="number" id="users" min="0" required placeholder="e.g., 45">
    </div>
  </div>

  <div style="margin-top: 12px;">
    <label>GPS Coordinates</label>
    <div class="row" style="align-items: center;">
      <input type="text" id="gps" placeholder="Latitude, Longitude" readonly style="flex: 1; min-width: 200px; background: #fafafa;">
      <button type="button" id="btn-gps" class="secondary" style="white-space: nowrap;">📍 Capture GPS</button>
    </div>
    <div id="gps-status" class="muted" style="font-size: 12px; margin-top: 4px;">GPS not recorded yet.</div>
  </div>

  <div style="margin-top: 12px;">
    <label for="notes">Survey Notes / Condition Remarks</label>
    <textarea id="notes" rows="2" placeholder="Additional observations, repair needs, or water quality remarks..."></textarea>
  </div>

  <div class="row" style="margin-top: 16px;">
    <button type="submit">Save Water Point Survey</button>
    <button type="reset" class="secondary" id="btn-reset">Clear Form</button>
  </div>
</form>

<div class="card">
  <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 12px;">
    <div>
      <strong>Collected Records (<span id="record-count">0</span>)</strong>
      <div class="muted" style="font-size: 12px;">Saved securely on this device.</div>
    </div>
    <div class="row">
      <button type="button" id="btn-export-json" class="secondary">Export JSON</button>
      <button type="button" id="btn-export-csv" class="secondary">Export CSV</button>
      <button type="button" id="btn-clear-all" class="secondary" style="border-color: #ef4444; color: #ef4444;">Delete All</button>
    </div>
  </div>

  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Habitation</th>
          <th>Pump Type</th>
          <th>Working?</th>
          <th>Users</th>
          <th>GPS Coordinates</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="records-tbody">
        <tr><td colspan="7" class="muted" style="text-align: center; padding: 16px;">No survey records stored yet.</td></tr>
      </tbody>
    </table>
  </div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }

offlineReady();

const STORAGE_KEY = 'ngo_water_point_surveys';
let surveys = store.get(STORAGE_KEY, []);

const form = document.getElementById('survey-form');
const gpsInput = document.getElementById('gps');
const gpsStatus = document.getElementById('gps-status');
const btnGps = document.getElementById('btn-gps');
const countSpan = document.getElementById('record-count');
const tbody = document.getElementById('records-tbody');

btnGps.addEventListener('click', () => {
  if (!navigator.geolocation) {
    gpsStatus.textContent = 'Geolocation is not supported by your browser.';
    return;
  }
  gpsStatus.textContent = 'Acquiring GPS location...';
  btnGps.disabled = true;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      const acc = Math.round(pos.coords.accuracy);
      gpsInput.value = `${lat}, ${lng}`;
      gpsStatus.textContent = `Location captured (accuracy: ±${acc}m)`;
      btnGps.disabled = false;
    },
    (err) => {
      gpsStatus.textContent = `Unable to retrieve GPS (${err.message}).`;
      btnGps.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
});

function renderRecords() {
  countSpan.textContent = surveys.length;
  if (!surveys.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align: center; padding: 16px;">No survey records stored yet.</td></tr>';
    return;
  }

  tbody.innerHTML = surveys.map((item, idx) => {
    const time = item.timestamp ? new Date(item.timestamp).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const isOk = item.isWorking === 'Yes';
    const badgeStyle = isOk ? 'color:#15803d;font-weight:600;' : 'color:#b91c1c;font-weight:600;';
    return `
      <tr>
        <td style="white-space:nowrap;">${time}</td>
        <td><strong>${escapeHtml(item.habitation)}</strong></td>
        <td>${escapeHtml(item.pumpType)}</td>
        <td style="${badgeStyle}">${escapeHtml(item.isWorking)}</td>
        <td>${escapeHtml(String(item.users))}</td>
        <td class="muted" style="font-family:monospace; font-size:12px;">${escapeHtml(item.gps || '—')}</td>
        <td><button type="button" class="secondary" style="padding:2px 8px; font-size:12px; border-color:#ef4444; color:#ef4444;" onclick="deleteSurvey(${idx})">Delete</button></td>
      </tr>
    `;
  }).join('');
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

window.deleteSurvey = function(index) {
  if (confirm('Delete this record?')) {
    surveys.splice(index, 1);
    store.set(STORAGE_KEY, surveys);
    renderRecords();
  }
};

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const entry = {
    id: 'wp_' + Date.now(),
    timestamp: new Date().toISOString(),
    habitation: document.getElementById('habitation').value.trim(),
    pumpType: document.getElementById('pumpType').value,
    isWorking: document.getElementById('isWorking').value,
    users: Number(document.getElementById('users').value) || 0,
    gps: gpsInput.value.trim(),
    notes: document.getElementById('notes').value.trim()
  };

  surveys.unshift(entry);
  store.set(STORAGE_KEY, surveys);
  form.reset();
  gpsStatus.textContent = 'GPS not recorded yet.';
  renderRecords();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  gpsStatus.textContent = 'GPS not recorded yet.';
});

document.getElementById('btn-export-json').addEventListener('click', () => {
  if (!surveys.length) {
    alert('No data to export.');
    return;
  }
  const dataStr = JSON.stringify(surveys, null, 2);
  const dateStr = new Date().toISOString().split('T')[0];
  download(`water_points_${dateStr}.json`, dataStr, 'application/json');
});

document.getElementById('btn-export-csv').addEventListener('click', () => {
  if (!surveys.length) {
    alert('No data to export.');
    return;
  }
  const csvStr = toCSV(surveys);
  const dateStr = new Date().toISOString().split('T')[0];
  download(`water_points_${dateStr}.csv`, csvStr, 'text/csv');
});

document.getElementById('btn-clear-all').addEventListener('click', () => {
  if (!surveys.length) return;
  if (confirm('Are you sure you want to delete all offline survey records? This cannot be undone.')) {
    surveys = [];
    store.set(STORAGE_KEY, surveys);
    renderRecords();
  }
});

renderRecords();
</script>
</body></html>
