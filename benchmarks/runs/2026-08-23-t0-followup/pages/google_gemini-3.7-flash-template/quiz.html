<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Washing Quiz for Kids</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Hand Washing Super Hero Quiz 🧼</h1></header>
<main>
<div id="quiz-container">
  <div class="card">
    <p class="muted" style="margin-top:0">Answer these 5 quick questions to test your clean hands superpowers!</p>
    <form id="quiz-form">
      <div id="questions-list"></div>
      <div style="margin-top:16px" class="row">
        <button type="submit" id="submit-btn">Check My Score</button>
      </div>
    </form>
  </div>
</div>

<div id="result-container" style="display:none">
  <div class="card" style="text-align:center;padding:24px">
    <h2 id="score-text" style="margin:0 0 8px 0;font-size:24px"></h2>
    <p id="score-feedback" class="muted" style="font-size:16px;margin:0 0 16px 0"></p>
    <div class="row" style="justify-content:center">
      <button type="button" id="retry-btn">Try Again</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;font-size:18px">Review Answers</h3>
    <div id="review-list"></div>
  </div>
</div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob disposition(name, {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }
// YOUR CODE HERE
const quizData = [
  {
    id: 1,
    question: "1. How long should you scrub your hands with soap and water?",
    options: ["5 seconds", "20 seconds (sing 'Happy Birthday' twice)", "1 minute", "2 seconds"],
    answer: 1,
    tip: "Scrubbing for at least 20 seconds removes harmful germs effectively."
  },
  {
    id: 2,
    question: "2. What is the most important item to use with water when washing hands?",
    options: ["Soap", "Cold juice", "Sand", "Just a towel"],
    answer: 0,
    tip: "Soap lifts dirt and germs from your skin so water can wash them away."
  },
  {
    id: 3,
    question: "3. When is it super important to wash your hands?",
    options: ["Before eating food", "After using the restroom", "After playing outside or coughing", "All of the above"],
    answer: 3,
    tip: "Washing at all these times stops germs from spreading into your body."
  },
  {
    id: 4,
    question: "4. Which parts of your hands should you make sure to wash?",
    options: ["Only the palms", "Only fingertips", "Palms, backs of hands, between fingers, and under nails", "Just thumb tips"],
    answer: 2,
    tip: "Germs hide between fingers and under nails, so wash everywhere!"
  },
  {
    id: 5,
    question: "5. What should you do after washing your hands with clean water?",
    options: ["Wipe them on your dirty shirt", "Dry them with a clean towel or air dry", "Touch the floor", "Do nothing"],
    answer: 1,
    tip: "Drying with a clean towel keeps your freshly cleaned hands germ-free."
  }
];

function renderQuiz() {
  const container = document.getElementById('questions-list');
  container.innerHTML = quizData.map((q, idx) => `
    <div style="margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)">
      <strong style="display:block;margin-bottom:8px">${q.question}</strong>
      ${q.options.map((opt, oIdx) => `
        <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);cursor:pointer;margin:6px 0">
          <input type="radio" name="q_${q.id}" value="${oIdx}" style="width:auto;margin:0" required>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `).join('');
}

document.getElementById('quiz-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  let score = 0;
  const userAnswers = [];

  quizData.forEach((q) => {
    const selected = formData.get(`q_${q.id}`);
    const selectedIdx = selected !== null ? parseInt(selected, 10) : -1;
    const isCorrect = selectedIdx === q.answer;
    if (isCorrect) score++;
    userAnswers.push({
      question: q.question,
      selected: selectedIdx,
      correct: q.answer,
      tip: q.tip,
      options: q.options,
      isCorrect: isCorrect
    });
  });

  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('result-container').style.display = 'block';

  document.getElementById('score-text').textContent = `You scored ${score} out of ${quizData.length}! 🎉`;
  
  let feedback = "Great effort! Practice good hand washing every day.";
  if (score === quizData.length) feedback = "Outstanding! You are a certified Hand Washing Champion! 🌟";
  else if (score >= 3) feedback = "Well done! You know your hygiene basics! 👍";
  document.getElementById('score-feedback').textContent = feedback;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = userAnswers.map((item) => `
    <div style="margin-bottom:14px;padding:10px;border-radius:8px;background:${item.isCorrect ? '#f0fdf4' : '#fef2f2'};border:1px solid ${item.isCorrect ? '#bbf7d0' : '#fecaca'}">
      <div style="font-weight:bold;margin-bottom:4px">${item.question}</div>
      <div style="font-size:14px">Your answer: <strong>${item.selected >= 0 ? item.options[item.selected] : 'None'}</strong> ${item.isCorrect ? '✅' : '❌'}</div>
      ${!item.isCorrect ? `<div style="font-size:14px;color:#15803d;margin-top:2px">Correct answer: <strong>${item.options[item.correct]}</strong></div>` : ''}
      <div class="muted" style="font-size:13px;margin-top:4px">💡 ${item.tip}</div>
    </div>
  `).join('');
});

document.getElementById('retry-btn').addEventListener('click', function() {
  document.getElementById('quiz-form').reset();
  document.getElementById('result-container').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderQuiz();
offlineReady();
</script>
</body></html>
