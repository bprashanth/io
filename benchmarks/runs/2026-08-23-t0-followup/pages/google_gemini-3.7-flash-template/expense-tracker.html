<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Expense Tracker</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body>
<header><h1>Field Expense Tracker</h1></header>
<main>
  <div class="grid">
    <div class="card" style="margin:0;">
      <span class="muted" style="font-size:13px;">Total Expenses</span>
      <div id="stat-total" style="font-size:24px;font-weight:bold;margin-top:4px;">$0.00</div>
    </div>
    <div class="card" style="margin:0;">
      <span class="muted" style="font-size:13px;">Total Entries</span>
      <div id="stat-count" style="font-size:24px;font-weight:bold;margin-top:4px;">0</div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px 0;">Add Field Expense</h2>
    <form id="exp-form">
      <div class="row">
        <div style="flex:1;min-width:140px;">
          <label for="exp-date">Date</label>
          <input type="date" id="exp-date" required>
        </div>
        <div style="flex:1;min-width:160px;">
          <label for="exp-head">Expense Head</label>
          <select id="exp-head" required>
            <option value="Travel & Transport">Travel & Transport</option>
            <option value="Food & Refreshments">Food & Refreshments</option>
            <option value="Accommodation">Accommodation</option>
            <option value="Community Activity">Community Activity</option>
            <option value="Supplies & Stationery">Supplies & Stationery</option>
            <option value="Communication & Data">Communication & Data</option>
            <option value="Other / Miscellaneous">Other / Miscellaneous</option>
          </select>
        </div>
        <div style="flex:1;min-width:120px;">
          <label for="exp-amount">Amount</label>
          <input type="number" id="exp-amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
      </div>
      <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px;">
        <button type="submit">Add Expense</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px 0;">Totals by Expense Head</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Expense Head</th>
            <th style="text-align:right;">Entries</th>
            <th style="text-align:right;">Subtotal</th>
            <th style="text-align:right;">Share</th>
          </tr>
        </thead>
        <tbody id="breakdown-tbody">
          <tr><td colspan="4" class="muted" style="text-align:center;padding:12px;">No expenses recorded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <h2 style="font-size:16px;margin:0;">Expense Log</h2>
      <div class="row" style="margin:0;">
        <button type="button" class="secondary" id="export-btn" style="padding:4px 10px;font-size:13px;">Export CSV</button>
        <button type="button" class="secondary" id="clear-btn" style="padding:4px 10px;font-size:13px;border-color:#ef4444;color:#ef4444;">Clear All</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Head</th>
            <th style="text-align:right;">Amount</th>
            <th style="text-align:center;width:60px;">Action</th>
          </tr>
        </thead>
        <tbody id="log-tbody">
          <tr><td colspan="4" class="muted" style="text-align:center;padding:12px;">No expenses recorded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script>
// helper: offline storage and CSV/JSON export (keep as is)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }

offlineReady();

const initialData = (typeof window !== 'undefined' && Array.isArray(window.data)) ? window.data : store.get('ngo_field_expenses', []);
let expenses = initialData.map((e, idx) => ({
  id: e.id || Date.now() + '_' + idx,
  date: e.date || new Date().toISOString().split('T')[0],
  head: e.head || 'Other / Miscellaneous',
  amount: Number(e.amount) || 0
}));

const form = document.getElementById('exp-form');
const dateInput = document.getElementById('exp-date');
const headInput = document.getElementById('exp-head');
const amountInput = document.getElementById('exp-amount');
const statTotal = document.getElementById('stat-total');
const statCount = document.getElementById('stat-count');
const breakdownTbody = document.getElementById('breakdown-tbody');
const logTbody = document.getElementById('log-tbody');
const exportBtn = document.getElementById('export-btn');
const clearBtn = document.getElementById('clear-btn');

dateInput.value = new Date().toISOString().split('T')[0];

function formatCurr(num) {
  return '$' + Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function render() {
  store.set('ngo_field_expenses', expenses);

  const total = expenses.reduce((acc, curr) => acc + curr.amount, 0);
  statTotal.textContent = formatCurr(total);
  statCount.textContent = expenses.length;

  const byHead = {};
  expenses.forEach(e => {
    if (!byHead[e.head]) {
      byHead[e.head] = { count: 0, total: 0 };
    }
    byHead[e.head].count += 1;
    byHead[e.head].total += e.amount;
  });

  const headKeys = Object.keys(byHead);
  if (headKeys.length === 0) {
    breakdownTbody.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center;padding:12px;">No expenses recorded yet.</td></tr>';
  } else {
    breakdownTbody.innerHTML = headKeys.sort((a, b) => byHead[b].total - byHead[a].total).map(head => {
      const share = total > 0 ? ((byHead[head].total / total) * 100).toFixed(1) : 0;
      return `<tr>
        <td><strong>${head}</strong></td>
        <td style="text-align:right;">${byHead[head].count}</td>
        <td style="text-align:right;">${formatCurr(byHead[head].total)}</td>
        <td style="text-align:right;" class="muted">${share}%</td>
      </tr>`;
    }).join('');
  }

  if (expenses.length === 0) {
    logTbody.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center;padding:12px;">No expenses recorded yet.</td></tr>';
  } else {
    logTbody.innerHTML = expenses.slice().reverse().map(e => `
      <tr>
        <td>${e.date}</td>
        <td>${e.head}</td>
        <td style="text-align:right;">${formatCurr(e.amount)}</td>
        <td style="text-align:center;">
          <button type="button" data-id="${e.id}" class="secondary delete-btn" style="padding:2px 6px;font-size:12px;border-color:#ef4444;color:#ef4444;">&times;</button>
        </td>
      </tr>
    `).join('');
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const amt = parseFloat(amountInput.value);
  if (isNaN(amt) || amt <= 0) return;

  expenses.push({
    id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
    date: dateInput.value,
    head: headInput.value,
    amount: amt
  });

  amountInput.value = '';
  render();
});

logTbody.addEventListener('click', e => {
  const btn = e.target.closest('.delete-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  expenses = expenses.filter(item => item.id !== id);
  render();
});

exportBtn.addEventListener('click', () => {
  if (expenses.length === 0) return;
  const rows = expenses.map(e => ({
    Date: e.date,
    Head: e.head,
    Amount: e.amount
  }));
  download('field-expenses.csv', toCSV(rows), 'text/csv');
});

clearBtn.addEventListener('click', () => {
  if (expenses.length === 0) return;
  if (confirm('Are you sure you want to clear all logged expenses?')) {
    expenses = [];
    render();
  }
});

render();
</script>
</body></html>
