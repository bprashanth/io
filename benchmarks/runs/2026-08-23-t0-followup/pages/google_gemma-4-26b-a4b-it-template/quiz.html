<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Washing Hero Quiz</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}button{font:inherit;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}button.secondary{background:#fff;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.option-card { display: block; padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
.option-card:hover { background: #f0f7ff; }
.option-card input { width: auto; margin-right: 10px; }
.hidden { display: none; }
.score-text { font-size: 24px; font-weight: bold; text-align: center; margin: 20px 0; }
</style></head><body>
<header><h1>🧼 Hand Washing Hero Quiz</h1></header>
<main>
<div id="quiz-container">
<div id="question-area"></div>
<div style="margin-top: 20px; text-align: right;">
<button id="next-btn">Next Question</button>
</div>
</div>
<div id="result-area" class="hidden">
<div class="card">
<div class="score-text" id="score-display"></div>
<div id="feedback-msg" style="text-align:center; margin-bottom:20px;"></div>
<div style="text-align:center;">
<button onclick="resetQuiz()">Try Again 🔄</button>
</div>
</div>
</div>
</main>
<script>
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'})); a.download = name; a.click(); }
function toCSV(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(',')].concat(rows.map(r => cols.map(c => esc(r[c])).join(','))).join('\n'); }
function offlineReady() { if (!('serviceWorker' in navigator)) return; const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});"; try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'text/javascript'}))).catch(()=>{}); } catch (e) {} }

const questions = [
  { q: "How long should you scrub your hands with soap?", a: ["5 seconds", "20 seconds", "2 minutes"], c: 1 },
  { q: "When is the MOST important time to wash your hands?", a: ["After playing outside", "Before eating", "After touching a pet"], c: 1 },
  { q: "What should you use to dry your hands after washing?", a: ["A dirty towel", "A clean towel or air dry", "Your clothes"], c: 1 },
  { q: "True or False: Water alone is enough to get rid of all germs.", a: ["True", "False"], c: 1 },
  { q: "Which part of your hands should you not forget to wash?", a: ["Just your palms", "Just your fingers", "Between fingers and under nails"], c: 2 }
];

let currentIdx = 0;
let score = 0;

const qArea = document.getElementById('question-area');
const nextBtn = document.getElementById('next-btn');
const quizCont = document.getElementById('quiz-container');
const resArea = document.getElementById('result-area');
const scoreDisp = document.getElementById('score-display');
const feedback = document.getElementById('feedback-msg');

function renderQuestion() {
  const item = questions[currentIdx];
  qArea.innerHTML = `
    <div class="card">
      <p style="font-weight:bold; font-size:18px;">Question ${currentIdx + 1} of ${questions.length}</p>
      <p>${item.q}</p>
      <div id="options">
        ${item.a.map((opt, i) => `
          <label class="option-card">
            <input type="radio" name="quiz-opt" value="${i}">
            ${opt}
          </label>
        `).join('')}
      </div>
    </div>
  `;
}

nextBtn.addEventListener('click', () => {
  const selected = document.querySelector('input[name="quiz-opt"]:checked');
  if (!selected) {
    alert("Please select an answer!");
    return;
  }

  if (parseInt(selected.value) === questions[currentIdx].c) {
    score++;
  }

  currentIdx++;

  if (currentIdx < questions.length) {
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults() {
  quizCont.classList.add('hidden');
  resArea.classList.remove('hidden');
  scoreDisp.innerText = `You scored ${score} / ${questions.length}!`;
  
  if (score === questions.length) {
    feedback.innerText = "🌟 Amazing! You are a Hand Washing Hero!";
  } else if (score >= 3) {
    feedback.innerText = "👍 Good job! Keep practicing!";
  } else {
    feedback.innerText = "🧼 Keep learning! Germs are sneaky!";
  }
}

function resetQuiz() {
  currentIdx = 0;
  score = 0;
  quizCont.classList.remove('hidden');
  resArea.classList.add('hidden');
  renderQuestion();
}

renderQuestion();
offlineReady();
</script>
</body></html>
