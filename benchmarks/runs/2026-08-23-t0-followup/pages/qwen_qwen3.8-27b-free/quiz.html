<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Washing Hero Quiz</title>
<style>
  :root{
    --ink:#123a4a;
    --ink-soft:#3f6b7d;
    --paper:#f4fbfd;
    --card:#ffffff;
    --line:#d3e8ef;
    --aqua:#12b3c9;
    --aqua-deep:#0a8ba0;
    --aqua-soft:#d6f3f8;
    --sun:#ffc23c;
    --sun-deep:#f0a400;
    --coral:#ff7a59;
    --coral-deep:#e85a37;
    --good:#2fae6b;
    --good-soft:#e2f6ec;
    --bad:#e85a37;
    --bad-soft:#fdeae4;
    --shadow:0 14px 34px rgba(18,58,74,.14);
    --shadow-sm:0 6px 16px rgba(18,58,74,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -10%, #eafcff 0%, rgba(234,252,255,0) 60%),
      radial-gradient(900px 500px at -10% 110%, #fff4dd 0%, rgba(255,244,221,0) 55%),
      var(--paper);
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px;}

  /* ---------- Header ---------- */
  header{
    position:relative;
    background:linear-gradient(135deg,var(--aqua) 0%,var(--aqua-deep) 100%);
    color:#fff;
    border-radius:26px;
    padding:26px 26px 30px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,.28) 0 6px, transparent 7px),
      radial-gradient(circle at 22% 60%, rgba(255,255,255,.22) 0 4px, transparent 5px),
      radial-gradient(circle at 88% 30%, rgba(255,255,255,.25) 0 5px, transparent 6px),
      radial-gradient(circle at 78% 78%, rgba(255,255,255,.20) 0 4px, transparent 5px),
      radial-gradient(circle at 55% 15%, rgba(255,255,255,.18) 0 3px, transparent 4px);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
  .logo{
    width:58px;height:58px;flex:0 0 58px;
    background:#fff;border-radius:18px;
    display:grid;place-items:center;
    box-shadow:var(--shadow-sm);
    animation:bob 3.4s ease-in-out infinite;
  }
  .logo svg{width:38px;height:38px;}
  .brand h1{
    margin:0;font-size:clamp(1.5rem,4.5vw,2.1rem);
    letter-spacing:.3px;line-height:1.05;
  }
  .brand p{margin:4px 0 0;font-size:.95rem;opacity:.92;max-width:42ch;}
  .badge{
    position:absolute;top:18px;right:18px;z-index:1;
    background:var(--sun);color:#5a3d00;
    font-weight:700;font-size:.8rem;
    padding:6px 12px;border-radius:999px;
    box-shadow:var(--shadow-sm);
    transform:rotate(4deg);
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}

  /* ---------- Progress ---------- */
  .progress{
    margin:20px 4px 18px;
    display:flex;align-items:center;gap:14px;
  }
  .progress .label{font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--ink-soft);}
  .track{
    flex:1;height:16px;background:#e3f1f5;border-radius:999px;
    overflow:hidden;box-shadow:inset 0 1px 3px rgba(18,58,74,.12);
  }
  .fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--sun),var(--coral));
    border-radius:999px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .dots{display:flex;gap:7px;}
  .dot{
    width:12px;height:12px;border-radius:50%;
    background:#cfe6ec;transition:all .3s ease;
  }
  .dot.done{background:var(--aqua);}
  .dot.now{background:var(--coral);transform:scale(1.35);box-shadow:0 0 0 4px rgba(255,122,89,.25);}

  /* ---------- Card ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:26px 24px 28px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .card.enter{animation:pop .45s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

  .q-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .q-num{
    background:var(--aqua-soft);color:var(--aqua-deep);
    font-weight:800;font-size:.85rem;
    padding:6px 12px;border-radius:999px;
  }
  .q-tag{font-size:.8rem;color:var(--ink-soft);font-weight:600;}
  .q-text{
    font-size:clamp(1.2rem,3.6vw,1.55rem);
    font-weight:800;line-height:1.25;margin:0 0 20px;
  }

  .options{display:grid;gap:12px;}
  .opt{
    display:flex;align-items:center;gap:14px;
    width:100%;text-align:left;
    background:#f7fcfe;
    border:2px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    font:inherit;font-size:1.02rem;font-weight:600;color:var(--ink);
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(:disabled){
    border-color:var(--aqua);
    background:#eefbfe;
    transform:translateX(4px);
    box-shadow:var(--shadow-sm);
  }
  .opt:focus-visible{outline:3px solid var(--aqua);outline-offset:2px;}
  .opt .key{
    flex:0 0 34px;height:34px;border-radius:10px;
    background:#fff;border:2px solid var(--line);
    display:grid;place-items:center;
    font-weight:800;color:var(--aqua-deep);
    transition:all .15s ease;
  }
  .opt:hover:not(:disabled) .key{background:var(--aqua);color:#fff;border-color:var(--aqua);}
  .opt:disabled{cursor:default;}
  .opt.correct{
    border-color:var(--good);background:var(--good-soft);
    animation:flash .5s ease;
  }
  .opt.correct .key{background:var(--good);color:#fff;border-color:var(--good);}
  .opt.wrong{
    border-color:var(--bad);background:var(--bad-soft);
    animation:shake .4s ease;
  }
  .opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad);}
  @keyframes flash{0%{transform:scale(1);}40%{transform:scale(1.03);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  .feedback{
    margin-top:18px;
    padding:14px 16px;border-radius:14px;
    font-weight:600;font-size:.98rem;
    display:none;align-items:flex-start;gap:10px;
  }
  .feedback.show{display:flex;animation:pop .35s ease;}
  .feedback.good{background:var(--good-soft);color:#1c6b43;border:1px solid #bfe6d0;}
  .feedback.bad{background:var(--bad-soft);color:#9c3a22;border:1px solid #f4c9bd;}
  .feedback .ico{font-size:1.2rem;line-height:1.2;}

  .actions{margin-top:22px;display:flex;justify-content:flex-end;}
  .btn{
    font:inherit;font-weight:800;font-size:1rem;
    border:none;border-radius:14px;
    padding:13px 24px;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(135deg,var(--coral),var(--coral-deep));
    color:#fff;box-shadow:0 8px 18px rgba(232,90,55,.35);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(232,90,55,.42);}
  .btn-sun{
    background:linear-gradient(135deg,var(--sun),var(--sun-deep));
    color:#5a3d00;box-shadow:0 8px 18px rgba(240,164,0,.35);
  }
  .btn-sun:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(240,164,0,.42);}
  .btn-ghost{
    background:#fff;color:var(--aqua-deep);
    border:2px solid var(--aqua);
  }
  .btn-ghost:hover{background:var(--aqua-soft);}

  /* ---------- Result ---------- */
  .result{text-align:center;}
  .result .face{
    width:120px;height:120px;margin:6px auto 14px;
    border-radius:50%;
    display:grid;place-items:center;
    font-size:3.4rem;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.3);
  }
  .result .face.great{background:var(--good-soft);}
  .result .face.good{background:var(--aqua-soft);}
  .result .face.try{background:var(--bad-soft);}
  .result h2{margin:0 0 6px;font-size:clamp(1.5rem,5vw,2rem);}
  .result .sub{color:var(--ink-soft);font-size:1.05rem;margin:0 0 22px;}
  .score-ring{
    position:relative;width:170px;height:170px;margin:0 auto 22px;
  }
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .ring-bg{fill:none;stroke:#e3f1f5;stroke-width:14;}
  .score-ring .ring-fg{
    fill:none;stroke:url(#grad);stroke-width:14;stroke-linecap:round;
    transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .score-center{
    position:absolute;inset:0;display:grid;place-content:center;
  }
  .score-center .big{font-size:2.6rem;font-weight:800;line-height:1;}
  .score-center .small{font-size:.9rem;color:var(--ink-soft);font-weight:700;}
  .result .actions{justify-content:center;gap:12px;flex-wrap:wrap;}

  .tip{
    margin-top:22px;background:var(--aqua-soft);
    border:1px dashed var(--aqua);
    border-radius:14px;padding:14px 16px;
    font-size:.95rem;color:var(--ink-soft);
  }
  .tip b{color:var(--aqua-deep);}

  footer{
    text-align:center;margin-top:26px;
    color:var(--ink-soft);font-size:.85rem;
  }
  footer .heart{color:var(--coral);}

  /* ---------- Confetti ---------- */
  .confetti{
    position:fixed;top:-12px;width:10px;height:14px;
    border-radius:2px;pointer-events:none;z-index:50;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(105vh) rotate(720deg);opacity:.9;}
  }

  @media (max-width:480px){
    .card{padding:22px 18px 24px;}
    .brand h1{font-size:1.4rem;}
    .badge{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">Fun &amp; Safe</span>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 4c-6 8-11 13-11 20a11 11 0 0 0 22 0c0-7-5-12-11-20z" fill="#12b3c9"/>
            <path d="M24 12c-3.5 4.5-6 7.5-6 12a6 6 0 0 0 12 0c0-4.5-2.5-7.5-6-12z" fill="#d6f3f8"/>
            <circle cx="18" cy="30" r="2.4" fill="#fff"/>
            <circle cx="30" cy="28" r="1.8" fill="#fff"/>
          </svg>
        </div>
        <div>
          <h1>Hand Washing Hero Quiz</h1>
          <p>Five quick questions to show you how to keep germs away. Ready to be a hero?</p>
        </div>
      </div>
    </header>

    <div class="progress" id="progress">
      <span class="label" id="progressLabel">Question 1 of 5</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>

    <main>
      <section class="card" id="quizCard" aria-live="polite"></section>
      <section class="card result" id="resultCard" hidden></section>
    </main>

    <footer>
      Made with <span class="heart">&#9829;</span> for young heroes &middot; Wash your hands, save the day!
    </footer>
  </div>

<script>
(function(){
  "use strict";

  // ---- Data: read from window.data if provided, otherwise use built-in quiz ----
  var fallback = {
    title: "Hand Washing Hero Quiz",
    questions: [
      {
        q: "When should you wash your hands the most?",
        options: [
          "Only when they look dirty",
          "Before eating and after using the toilet",
          "Once a day at night",
          "Only when you feel sick"
        ],
        answer: 1,
        explain: "Washing before eating and after the toilet stops germs from getting into your body."
      },
      {
        q: "How long should you rub your hands with soap?",
        options: [
          "Just a quick splash",
          "About 20 seconds",
          "One second",
          "As long as you can"
        ],
        answer: 1,
        explain: "About 20 seconds is perfect. That is like singing the alphabet song twice!"
      },
      {
        q: "Which of these helps kill germs on your hands?",
        options: [
          "Just cold water",
          "Soap and water",
          "A dry towel",
          "Nothing works"
        ],
        answer: 1,
        explain: "Soap and water work together to lift germs off your skin and wash them away."
      },
      {
        q: "What should you do after washing your hands?",
        options: [
          "Wipe them on your clothes",
          "Dry them with a clean towel or air",
          "Leave them wet",
          "Touch the door handle first"
        ],
        answer: 1,
        explain: "Dry hands with a clean towel or let them air dry so germs do not spread."
      },
      {
        q: "Which part of your hands is easy to forget when washing?",
        options: [
          "Your palms",
          "Your fingertips and thumbs",
          "Your wrists",
          "Your whole hand"
        ],
        answer: 1,
        explain: "Fingertips and thumbs hide lots of germs, so rub them well with soap."
      }
    ]
  };

  var data = (typeof window !== "undefined" && window.data && window.data.questions)
    ? window.data
    : fallback;

  var questions = data.questions;
  var total = questions.length;

  // ---- State ----
  var current = 0;
  var score = 0;
  var answered = false;

  // ---- Elements ----
  var quizCard = document.getElementById("quizCard");
  var resultCard = document.getElementById("resultCard");
  var fill = document.getElementById("fill");
  var dotsWrap = document.getElementById("dots");
  var progressLabel = document.getElementById("progressLabel");
  var progressWrap = document.getElementById("progress");

  // Build progress dots
  for (var i = 0; i < total; i++) {
    var d = document.createElement("span");
    d.className = "dot";
    dotsWrap.appendChild(d);
  }
  var dots = dotsWrap.children;

  function updateProgress(){
    var pct = (current / total) * 100;
    fill.style.width = pct + "%";
    progressLabel.textContent = "Question " + (current + 1) + " of " + total;
    for (var i = 0; i < total; i++) {
      dots[i].className = "dot" + (i < current ? " done" : (i === current ? " now" : ""));
    }
  }

  function renderQuestion(){
    answered = false;
    var q = questions[current];
    var keys = ["A","B","C","D"];

    var html =
      '<div class="q-top">' +
        '<span class="q-num">Question ' + (current + 1) + '</span>' +
        '<span class="q-tag">Pick the best answer</span>' +
      '</div>' +
      '<h2 class="q-text">' + escapeHtml(q.q) + '</h2>' +
      '<div class="options" role="group" aria-label="Answer choices">';

    for (var i = 0; i < q.options.length; i++) {
      html +=
        '<button class="opt" data-index="' + i + '" type="button">' +
          '<span class="key">' + (keys[i] || (i + 1)) + '</span>' +
          '<span class="opt-text">' + escapeHtml(q.options[i]) + '</span>' +
        '</button>';
    }
    html += '</div>';

    html +=
      '<div class="feedback" id="feedback" role="status"></div>' +
      '<div class="actions">' +
        '<button class="btn btn-primary" id="nextBtn" type="button" hidden>' +
          (current === total - 1 ? "See my score" : "Next question") +
        '</button>' +
      '</div>';

    quizCard.innerHTML = html;
    quizCard.classList.remove("enter");
    void quizCard.offsetWidth; // restart animation
    quizCard.classList.add("enter");

    var opts = quizCard.querySelectorAll(".opt");
    for (var j = 0; j < opts.length; j++) {
      opts[j].addEventListener("click", onAnswer);
    }
    document.getElementById("nextBtn").addEventListener("click", onNext);

    updateProgress();
  }

  function onAnswer(e){
    if (answered) return;
    answered = true;

    var btn = e.currentTarget;
    var chosen = parseInt(btn.getAttribute("data-index"), 10);
    var q = questions[current];
    var correct = q.answer;
    var opts = quizCard.querySelectorAll(".opt");

    for (var i = 0; i < opts.length; i++) {
      opts[i].disabled = true;
      if (i === correct) opts[i].classList.add("correct");
    }

    var fb = document.getElementById("feedback");
    if (chosen === correct) {
      score++;
      fb.className = "feedback show good";
      fb.innerHTML = '<span class="ico">&#10004;</span><span>Great job! ' + escapeHtml(q.explain) + '</span>';
    } else {
      btn.classList.add("wrong");
      fb.className = "feedback show bad";
      fb.innerHTML = '<span class="ico">&#10007;</span><span>Not quite. ' + escapeHtml(q.explain) + '</span>';
    }

    document.getElementById("nextBtn").hidden = false;
    document.getElementById("nextBtn").focus();
  }

  function onNext(){
    if (current < total - 1) {
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult(){
    quizCard.hidden = true;
    progressWrap.style.display = "none";
    resultCard.hidden = false;
    resultCard.classList.remove("enter");
    void resultCard.offsetWidth;
    resultCard.classList.add("enter");

    var pct = Math.round((score / total) * 100);
    var face, cls, headline, sub;

    if (pct === 100) {
      face = "&#128513;"; cls = "great";
      headline = "Perfect! You
