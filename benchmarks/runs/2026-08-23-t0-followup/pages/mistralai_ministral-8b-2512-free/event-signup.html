<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Camp Signup - 14 September</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .countdown {
            background-color: #3498db;
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .countdown-item {
            display: inline-block;
            margin: 0 10px;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 18px;
        }
        .countdown-item .label {
            font-size: 12px;
            opacity: 0.8;
            display: block;
        }
        .signup-form {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #27ae60;
        }
        .attendees {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .attendee {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .attendee:last-child {
            border-bottom: none;
        }
        .attendee-name {
            flex-grow: 1;
        }
        .attendee-age {
            font-weight: bold;
        }
        .attendee-gender {
            font-style: italic;
        }
        .success-message {
            color: #27ae60;
            margin-top: 10px;
            font-weight: bold;
        }
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .countdown-item {
                margin: 0 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Health Camp Signup</h1>
            <p>Join us for our free health checkup on 14 September</p>
        </header>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="label">Days</span>
                <span id="days">00</span>
            </div>
            <span>:</span>
            <div class="countdown-item">
                <span class="label">Hours</span>
                <span id="hours">00</span>
            </div>
            <span>:</span>
            <div class="countdown-item">
                <span class="label">Minutes</span>
                <span id="minutes">00</span>
            </div>
            <span>:</span>
            <div class="countdown-item">
                <span class="label">Seconds</span>
                <span id="seconds">00</span>
            </div>
        </div>

        <div class="signup-form">
            <h2>Sign Up for the Health Camp</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="contact" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>
                <button type="submit">Register for Health Camp</button>
                <div id="formMessage" class="success-message" style="display: none;"></div>
                <div id="formError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <div class="attendees">
            <h2>People Who Have Signed Up</h2>
            <div id="attendeesList">
                <p>No attendees yet. Be the first to sign up!</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize data from window object
        const eventDate = new Date(window.data.eventDate || '2023-09-14T00:00:00');
        let attendees = window.data.attendees || [];

        // Countdown timer
        function updateCountdown() {
            const now = new Date();
            const diff = eventDate - now;

            if (diff <= 0) {
                document.getElementById('countdown').textContent = 'Event has started!';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        // Update countdown every second
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Display attendees
        function displayAttendees() {
            const list = document.getElementById('attendeesList');
            if (attendees.length === 0) {
                list.innerHTML = '<p>No attendees yet. Be the first to sign up!</p>';
                return;
            }

            let html = '<ul>';
            attendees.forEach(attendee => {
                html += `
                    <li class="attendee">
                        <div class="attendee-name">${attendee.name} (${attendee.age})</div>
                        <div class="attendee-details">
                            <span class="attendee-gender">${attendee.gender}</span>
                            <span class="attendee-contact">${attendee.contact}</span>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            list.innerHTML = html;
        }

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const contact = document.getElementById('contact').value.trim();
            const address = document.getElementById('address').value.trim();

            if (!name || !age || !gender || !contact || !address) {
                document.getElementById('formError').textContent = 'Please fill in all required fields.';
                document.getElementById('formError').style.display = 'block';
                document.getElementById('formMessage').style.display = 'none';
                return;
            }

            // Create new attendee object
            const newAttendee = {
                id: Date.now(),
                name,
                age,
                gender,
                contact,
                address
            };

            // Add to attendees array
            attendees.push(newAttendee);

            // Update local storage
            window.localStorage.setItem('healthCampAttendees', JSON.stringify(attendees));

            // Show success message
            document.getElementById('formMessage').textContent = 'Thank you! You have been successfully registered.';
            document.getElementById('formMessage').style.display = 'block';
            document.getElementById('formError').style.display = 'none';

            // Reset form
            this.reset();

            // Update attendees list
            displayAttendees();
        });

        // Initialize attendees display
        displayAttendees();

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(new Blob([
                    `self.addEventListener('install', (event) => {
                        event.waitUntil(
                            caches.open('health-camp-v1').then((cache) => {
                                return cache.addAll([
                                    '${location.href}'
                                ]);
                            })
                        );
                    });

                    self.addEventListener('fetch', (event) => {
                        event.respondWith(
                            caches.match(event.request).then((response) => {
                                return response || fetch(event.request);
                            })
                        );
                    });
                `], { type: 'application/javascript' }))
                .then(registration => {
                    console.log('ServiceWorker registration successful');
                })
                .catch(error => {
                    console.log('ServiceWorker registration failed: ', error);
                });
            });
        }
    </script>
</body>
</html>
