<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .expense-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f2f2f2;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .totals {
            background: #e8f4fc;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .running-total {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .category-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .grand-total {
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Field Expense Tracker</h1>

    <div class="expense-form">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="head">Expense Head</label>
            <select id="head" required>
                <option value="">Select Head</option>
                <option value="Transport">Transport</option>
                <option value="Food">Food</option>
                <option value="Accommodation">Accommodation</option>
                <option value="Miscellaneous">Miscellaneous</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" step="0.01" min="0" required>
        </div>
        <button id="add-expense">Add Expense</button>
    </div>

    <div id="expense-table-container">
        <table id="expense-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Head</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="expense-table-body">
                <!-- Expenses will be added here -->
            </tbody>
        </table>
    </div>

    <div class="totals">
        <div class="running-total">Running Total: <span id="running-total">0.00</span></div>
        <div id="category-totals"></div>
        <div class="grand-total">Grand Total: <span id="grand-total">0.00</span></div>
    </div>

    <script>
        // Initialize data from window if available, otherwise empty array
        const expenses = window.data?.expenses || [];

        // DOM elements
        const dateInput = document.getElementById('date');
        const headSelect = document.getElementById('head');
        const amountInput = document.getElementById('amount');
        const addExpenseBtn = document.getElementById('add-expense');
        const expenseTableBody = document.getElementById('expense-table-body');
        const runningTotalSpan = document.getElementById('running-total');
        const categoryTotalsDiv = document.getElementById('category-totals');
        const grandTotalSpan = document.getElementById('grand-total');

        // Initialize the page
        function init() {
            renderExpenses();
            updateTotals();
        }

        // Add new expense
        addExpenseBtn.addEventListener('click', function() {
            const date = dateInput.value;
            const head = headSelect.value;
            const amount = parseFloat(amountInput.value);

            if (date && head && amount > 0) {
                const newExpense = {
                    date: date,
                    head: head,
                    amount: amount
                };

                expenses.push(newExpense);
                saveData();
                renderExpenses();
                updateTotals();

                // Clear form
                dateInput.value = '';
                headSelect.value = '';
                amountInput.value = '';
            }
        });

        // Render expenses to table
        function renderExpenses() {
            expenseTableBody.innerHTML = '';

            expenses.forEach(expense => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${expense.date}</td>
                    <td>${expense.head}</td>
                    <td>$${expense.amount.toFixed(2)}</td>
                `;
                expenseTableBody.appendChild(row);
            });
        }

        // Update totals
        function updateTotals() {
            let runningTotal = 0;
            const categoryTotals = {};

            expenses.forEach(expense => {
                runningTotal += expense.amount;

                if (!categoryTotals[expense.head]) {
                    categoryTotals[expense.head] = 0;
                }
                categoryTotals[expense.head] += expense.amount;
            });

            runningTotalSpan.textContent = runningTotal.toFixed(2);
            grandTotalSpan.textContent = runningTotal.toFixed(2);

            // Clear previous category totals
            categoryTotalsDiv.innerHTML = '';

            // Add category totals
            for (const [head, total] of Object.entries(categoryTotals)) {
                const categoryRow = document.createElement('div');
                categoryRow.className = 'category-total';
                categoryRow.innerHTML = `
                    <span>${head}</span>
                    <span>$${total.toFixed(2)}</span>
                `;
                categoryTotalsDiv.appendChild(categoryRow);
            }
        }

        // Save data to window.data
        function saveData() {
            window.data = {
                expenses: expenses
            };
        }

        // Initialize the page when loaded
        window.addEventListener('load', init);
    </script>
</body>
</html>
