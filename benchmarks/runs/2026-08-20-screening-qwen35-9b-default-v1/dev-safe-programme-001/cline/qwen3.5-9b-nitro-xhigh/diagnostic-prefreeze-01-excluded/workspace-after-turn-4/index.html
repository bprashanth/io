<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women Training Dashboard 2023</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        .card.target {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .card h3 { font-size: 1em; margin-bottom: 15px; }
        .value { font-size: 3em; font-weight: bold; }
        .sub-text { font-size: 1em; opacity: 0.9; margin-top: 5px; }
        .comparison {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
        .comparison h2 { text-align: center; color: #333; }
        .bar-container {
            margin: 20px 0;
        }
        .bar-label { font-weight: 600; margin-bottom: 8px; color: #333; }
        .bar-bg {
            height: 35px;
            background: #eee;
            border-radius: 8px;
            position: relative;
        }
        .bar {
            height: 100%;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.85em;
            transition: width 0.5s ease;
        }
        .bar-completion { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
        .bar-employment { background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%); }
        .bar-old { background: #ccc; color: #666 !important; }
        .gap-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
        }
        .gap-box h4 { margin-bottom: 8px; }
        .gap-value { font-size: 2em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Training Completion Rate</h3>
            <div class="value" id="purniaCompletion">-</div>
            <div class="sub-text">Purnia - 2023</div>
        </div>
        <div class="card target">
            <h3>6-Month Employment Rate</h3>
            <div class="value" id="purniaEmployment">-</div>
            <div class="sub-text">Purnia - 2023</div>
        </div>
    </div>
</body>
</html>
